<title>OAuth Clearance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a permit office. Library = departures board of apps; each guide opens on a "clearance ticket" (two clocks), then the flight plan (steps), then the evidence file. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#eceef2; --ink:#141a24; --muted:#586273; --faint:#8a93a3; --line:#dde1e8;
  --accent:#1d3fc4; --accent-ink:#ffffff; --accent-soft:#e6ebfb;
  --d1:#1f9d6b; --d2:#2f7fc0; --d3:#b08c00; --d4:#cc3340; --d5:#8e44c2;
  --ok:#1f8a5b; --warn:#a86b00; --bad:#c22f3c;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1217; --surface:#171b22; --sunk:#1d222b; --ink:#e7eaf0; --muted:#a2abba; --faint:#6f7888; --line:#2a303b;
  --accent:#8ea6ff; --accent-ink:#0f1217; --accent-soft:#1f2740;
  --d1:#2ea677; --d2:#4a8fd4; --d3:#b8931f; --d4:#e2585f; --d5:#ad6be0;
  --ok:#3dbb84; --warn:#d9a03a; --bad:#ef6b73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#171b22; --sunk:#1d222b; --ink:#e7eaf0; --muted:#a2abba; --faint:#6f7888; --line:#2a303b;
  --accent:#8ea6ff; --accent-ink:#0f1217; --accent-soft:#1f2740;
  --d1:#2ea677; --d2:#4a8fd4; --d3:#b8931f; --d4:#e2585f; --d5:#ad6be0;
  --ok:#3dbb84; --warn:#d9a03a; --bad:#ef6b73; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;overflow-wrap:break-word}
.step,.gotcha,.callout,.path,.clock{overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent);overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.12;margin:0}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px}
.skip:focus{left:16px}
/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none}
.brand .stamp{width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;transform:rotate(-8deg)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--sunk);color:var(--ink)}
main{padding-block:28px 64px}
/* generic */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.diff{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.meter{display:inline-flex;gap:2px}
.meter i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.grid{display:grid;gap:16px}
section.block{display:grid;gap:14px;margin-top:36px}
section.block > *, .content > section > *, main > section > *{min-width:0}
section.block, .content, .content > section, main > section{grid-template-columns:minmax(0,1fr)}
.lead{font-size:17px;color:var(--muted);max-width:62ch}
/* lookup */
.lookup{display:flex;gap:8px;margin-top:20px;max-width:680px}
.lookup input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tries{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tries button{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:3px 10px;font-size:13px}
/* chart */
.chart-wrap{overflow-x:auto;padding:16px 16px 8px}
.chart-wrap svg{display:block;min-width:640px;width:100%}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .name{fill:var(--ink);font-family:var(--f-body);font-size:12.5px;font-weight:500}
.chart .row:hover .hit{fill:var(--sunk)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 10px;border-radius:8px;max-width:280px;line-height:1.4}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:grid;gap:10px;align-content:start;padding:16px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.card:hover{border-color:var(--faint)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:17px}
.card .clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px}
.card .clocks b{display:block;font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--ink)}
.card .verdict{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* catalog */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td .btn{padding:4px 10px;font-size:13px}
.status-ready{color:var(--ok);font-weight:600}
.status-gen{color:var(--accent);font-weight:600}
/* ticket */
.ticket{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket .main{padding:24px;display:grid;gap:14px;align-content:start}
.ticket .stub{padding:24px;border-left:2px dashed var(--line);background:var(--sunk);display:grid;gap:16px;align-content:start;position:relative}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .stub::before{top:-11px}.ticket .stub::after{bottom:-11px}
.clock{display:grid;gap:2px}
.clock .v{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.clock .s{font-size:13px;color:var(--muted)}
.split{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.split span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.verdict-big{font-size:17px;max-width:62ch}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.callout.info{background:var(--accent-soft);border-color:transparent}
.guide-actions{display:flex;gap:8px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;margin-top:28px}
.toc{position:sticky;top:76px;align-self:start;display:grid;gap:2px;font-size:13.5px}
.toc a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px}
.toc a:hover{background:var(--sunk);color:var(--ink)}
.content{display:grid;gap:36px;min-width:0}
.content > section{display:grid;gap:14px;scroll-margin-top:76px}
/* paths */
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.path{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:6px;align-content:start;font-size:14px}
/* steps */
.phase{display:grid;gap:8px}
.phase-h{display:flex;align-items:center;gap:10px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.step input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.step.done{opacity:.6}
.step.done .st{text-decoration:line-through}
.step .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.step .meta .chip{white-space:normal;max-width:100%}
.owner-agent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.owner-human{color:var(--ink);border-color:var(--faint)}
.wait{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
/* two col lists */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{margin:0;padding-left:18px;display:grid;gap:6px}
.gotcha{border-left:3px solid var(--line);padding:4px 0 4px 14px;display:grid;gap:4px}
.gotcha.high{border-color:var(--bad)}.gotcha.medium{border-color:var(--warn)}.gotcha.low{border-color:var(--faint)}
.sev{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.sev.high{color:var(--bad)}.sev.medium{color:var(--warn)}.sev.low{color:var(--muted)}
.ev-ref{font-family:var(--f-mono);font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.st-verified{color:var(--ok)} .st-reported{color:var(--warn)} .st-uncertain{color:var(--bad)}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:target{background:var(--accent-soft)}
.conf{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
/* generator */
.gen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.log{font-family:var(--f-mono);font-size:12.5px;display:grid;gap:6px;max-height:420px;overflow:auto;padding:14px}
.log div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px}
.log .t{color:var(--faint)}
.log .k-tool{color:var(--accent)} .log .k-err{color:var(--bad)} .log .k-ok{color:var(--ok)}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--sunk);font-size:13.5px}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;flex:none;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
/* method */
.flow{overflow-x:auto}
.flow svg{min-width:640px;width:100%;display:block}
.flow text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.flow .sub{fill:var(--muted);font-size:11.5px}
.flow rect{fill:var(--surface);stroke:var(--line)}
.flow .acc{stroke:var(--accent)}
.flow path{stroke:var(--faint);fill:none;stroke-width:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30}
/* onboarding */
dialog.onb{border:1px solid var(--line);border-radius:14px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog.onb::backdrop{background:rgb(0 0 0 / .45)}
.onb .in{padding:24px;display:grid;gap:16px}
.onb .q{display:grid;gap:8px;border:0;margin:0;padding:0}
.onb legend{font-weight:600;margin-bottom:6px}
.onb .opts{display:grid;gap:6px}
.onb .opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);color:var(--ink);text-align:left;font:inherit;width:100%}
.onb .opt:hover{border-color:var(--faint)}
.onb .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.onb .opts.grid2{grid-template-columns:1fr 1fr}
@media (max-width:480px){.onb .opts.grid2{grid-template-columns:1fr}}
.onb .opt input{margin-top:3px;accent-color:var(--accent)}
.onb .foot{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.onb .dots{display:flex;gap:6px}.onb .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.onb .dots i.on{background:var(--accent)}
.onb ol.read{margin:0;padding-left:20px;display:grid;gap:10px}
.mine{outline:2px solid var(--accent);outline-offset:-1px}
.me-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer}
@media (max-width:860px){
  .ticket{grid-template-columns:minmax(0,1fr)}
  .ticket .stub{border-left:0;border-top:2px dashed var(--line)}
  .ticket .stub::before,.ticket .stub::after{display:none}
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  nav.tabs{margin-left:0;width:100%}
  nav.tabs a{padding:6px 10px;font-size:14px}
  .clock .v{font-size:22px}
  .twocol,.gen{grid-template-columns:minmax(0,1fr)}
  dl.kv{grid-template-columns:minmax(0,1fr)}
  dl.kv dt{margin-top:6px}
}
</style>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
const LIB = DATA.guides; // slug -> guide
const LABELS = ["", "Instant", "Easy", "Moderate", "Hard", "Gated"];
const DCOL = n => `var(--d${n})`;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const generated = new Map(); // id -> guide (db + this session)
let ENV = { kind: "static", live: false };

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || "Copied"); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast(okMsg || "Copied"); } catch { toast("Select and copy the text manually"); } ta.remove(); }
}

const diffBadge = g => { const n = g.difficulty?.score || 3; return `<span class="diff" style="color:${DCOL(n)}"><span class="meter" aria-hidden="true">${[1,2,3,4,5].map(i => `<i style="${i <= n ? `background:${DCOL(n)}` : ""}"></i>`).join("")}</span>${n} · ${esc(LABELS[n])}</span>`; };
const composioChip = m => m === true ? `<span class="chip" title="Composio's directory offers a managed OAuth app for this toolkit">Composio-managed available</span>` : m === false ? `<span class="chip" title="Composio's directory lists this toolkit as bring-your-own OAuth app">Bring your own app</span>` : "";
const reviewWord = r => ({ never: "No review", conditional: "Review if…", always: "Review required" }[r?.required] || "Review: unknown");

// ---------- routing
const routes = { library: viewLibrary, new: viewNew, method: viewMethod };
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "library";
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", false));
  let navKey = "library";
  if (routes[h]) { navKey = h; routes[h](); }
  else if (LIB[h]) viewGuide(LIB[h], { source: "library" });
  else if (h.startsWith("gen-") && generated.has(h.slice(4))) viewGuide(generated.get(h.slice(4)), { source: "generated", id: h.slice(4) });
  else if (h.startsWith("gen-")) { $("#app").innerHTML = `<p class="muted">Loading generated guide…</p>`; envReady.then(loadGenerated).then(() => generated.has(h.slice(4)) ? route() : ($("#app").innerHTML = `<p>That generated guide isn't available in this view. <a href="#library">Back to the library</a></p>`)); }
  else viewLibrary();
  const a = document.querySelector(`[data-nav="${navKey}"]`); if (a) a.setAttribute("aria-current", "page");
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

// ---------- library
let diffFilter = 0, catFilter = "all";
function viewLibrary() {
  const ready = Object.values(LIB).sort((a, b) => a.difficulty.score - b.difficulty.score || a.name.localeCompare(b.name));
  $("#app").innerHTML = `
  <section style="display:grid;gap:12px">
    <span class="eyebrow">OAuth app setup &amp; approval guides for agent builders</span>
    <h1>Know what it takes to get your OAuth app approved before you start.</h1>
    <p class="lead">Look up an app to see how hard it is, how long it takes (including the wait for review), what can block you, and which steps an agent can do for you. Apps outside the library get a guide researched live by an agent.</p>
    <form class="lookup" id="lookup" autocomplete="off"><label for="q" class="sr">App name or website</label>
      <input id="q" placeholder="App name or website, e.g. Google Calendar or hubspot.com" list="appnames">
      <datalist id="appnames">${DATA.catalog.map(c => `<option value="${esc(c.name)}">`).join("")}</datalist>
      <button class="btn primary" type="submit">Look up</button></form>
    <div class="me-bar" id="mebar"></div>

function card(g, href, extra = "") {
  return `<a class="card" href="${href}">

    <div class="badges"><span class="chip">${esc(reviewWord(g.review))}</span>${composioChip(g.composio_managed)}${extra}</div></a>`;
}
function shortProd(g) { const c = DATA.chart[g.slug]; return c ? c.label : g.timeline.production.estimate.split(/[.;(]/)[0].slice(0, 48); }
function drawCards(list) { $("#cards").innerHTML = list.filter(g => !diffFilter || g.difficulty.score === diffFilter).map(g => card(g, "#" + g.slug)).join("") || `<p class="muted">No ready guides at this level yet.</p>`; }

function drawCatalog() {
  const genBySlug = {}; for (const [id, g] of generated) genBySlug[(g.catalog_slug || g.slug)] = id;
  const rows = DATA.catalog.filter(c => catFilter === "all" || (catFilter === "ready" && LIB[c.slug]) || (catFilter === "byo" && !c.managed) || (catFilter === "managed" && c.managed));
  $("#catbody").innerHTML = rows.map(c => {

      : genBySlug[c.slug] ? `<a class="status-gen" href="#gen-${genBySlug[c.slug]}">Generated</a>`
      : `<button class="btn" data-gen="${esc(c.name)}" data-slug="${esc(c.slug)}">Generate</button>`;
    return `<tr><td>${esc(c.name)}</td><td class="muted">${esc(c.category)}</td><td>${c.managed ? "Managed available" : "<b>Bring your own</b>"}</td><td>${st}</td></tr>`;
  }).join("");
  $("#catbody").onclick = e => { const b = e.target.closest("[data-gen]"); if (b) startGenerate(b.dataset.gen, { catalogSlug: b.dataset.slug }); };
}
function lookup(raw) {
  const q = String(raw || "").trim(); if (!q) return;
  const n = s => s.toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/[^a-z0-9]/g, "");
  const nq = n(q);
  const hit = Object.values(LIB).find(g => [g.slug, g.name, g.name.replace(/\s*\(.*\)$/, ""), g.provider].some(x => x && n(x) === nq) || (g.aliases || []).some(a => n(a) === nq) || nq.startsWith(g.slug + "com"));
  if (hit) { location.hash = hit.slug; return; }
  for (const [id, g] of generated) if (n(g.name) === nq || n(g.query || "") === nq) { location.hash = "gen-" + id; return; }
  const cat = DATA.catalog.find(c => n(c.name) === nq);
  startGenerate(q, { catalogSlug: cat?.slug });
}

// ---------- chart (log-scale range bars)
function drawChart(list) {
  const rows = list.filter(g => DATA.chart[g.slug]).sort((a, b) => DATA.chart[a.slug].prod[1] - DATA.chart[b.slug].prod[1]);
  const W = 960, L = 150, R = 150, rowH = 30, top = 28, H = top + rows.length * rowH + 10;
  const lo = Math.log10(5), hi = Math.log10(260000);
  const x = m => L + (Math.log10(Math.max(5, m)) - lo) / (hi - lo) * (W - L - R);
  const ticks = [[10, "10 min"], [60, "1 h"], [1440, "1 day"], [10080, "1 wk"], [43200, "1 mo"], [129600, "3 mo"], [259200, "6 mo"]];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Time to first token and to production per app">`;
  for (const [m, t] of ticks) s += `<line x1="${x(m)}" x2="${x(m)}" y1="${top - 6}" y2="${H - 6}" stroke="var(--line)" stroke-width="1"/><text x="${x(m)}" y="${top - 12}" text-anchor="middle">${t}</text>`;
  rows.forEach((g, i) => {
    const c = DATA.chart[g.slug], y = top + i * rowH + rowH / 2, col = DCOL(g.difficulty.score);
    s += `<g class="row" data-slug="${g.slug}" style="cursor:pointer"><rect class="hit" x="0" y="${y - rowH / 2}" width="${W}" height="${rowH}" fill="transparent" rx="6"/>
      <text class="name" x="${L - 12}" y="${y + 4}" text-anchor="end">${esc(g.name.replace(/\s*\(.*\)$/, ""))}</text>
      <line x1="${x(c.first)}" x2="${x(c.prod[0])}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2" stroke-dasharray="2 3" opacity=".7"/>
      <rect x="${x(c.prod[0])}" y="${y - 5}" width="${Math.max(6, x(c.prod[1]) - x(c.prod[0]))}" height="10" rx="4" fill="${col}"/>
      <circle cx="${x(c.first)}" cy="${y}" r="5" fill="var(--surface)" stroke="${col}" stroke-width="2"/>
      <text x="${x(c.prod[1]) + 10}" y="${y + 4}">${esc(c.label)}</text></g>`;
  });
  s += `</svg>`;
  $("#chart").innerHTML = `<div class="chart-wrap">${s}</div><div class="legend"><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--muted)" stroke-width="2"/></svg>First working token</span><span><svg width="26" height="10"><rect width="26" height="10" rx="4" fill="var(--muted)"/></svg>Production window (incl. review wait)</span>${[1,2,3,4,5].map(n => `<span><span class="dot" style="background:${DCOL(n)}"></span>${LABELS[n]}</span>`).join("")}</div>`;
  const tip = $("#tip");
  $("#chart").querySelectorAll(".row").forEach(r => {
    const g = LIB[r.dataset.slug];
    r.onmousemove = e => { tip.hidden = false; tip.innerHTML = `<b>${esc(g.name)}</b><br>First token: ${esc(g.timeline.first_token.estimate)}<br>Production: ${esc(g.timeline.production.estimate)}`; tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px"; tip.style.top = e.clientY + 14 + "px"; };
    r.onmouseleave = () => (tip.hidden = true);
    r.onclick = () => { tip.hidden = true; location.hash = g.slug; };
  });
}

  L.push("", "## Agent can", li(g.agent_vs_human.agent_can), "", "## You must", li(g.agent_vs_human.human_must), "");

async function startGenerate(input, opts) {
  if (run?.status === "running") { toast("A guide is already being generated"); location.hash = "new"; return; }
  if (!(ENV.kind === "server" && ENV.live)) { location.hash = "new"; toast("Live generation isn't available on this copy"); return; }
  run = { input, opts, ctl: new AbortController(), log: [], status: "running", t0: Date.now(), chars: 0 };

  logLine("ok", opts.existing ? `Re-checking "${input}" against live sources` : `Starting: "${input}"`);
  try {
    const { guide, id } = await runServer(input, opts);
    if (!guide.error) {
      guide.query = input; if (opts.catalogSlug) guide.catalog_slug = opts.catalogSlug;
      const dirHit = checkComposio(DATA.directory, guide.name.replace(/\s*\(.*\)$/, "")).exact[0] || checkComposio(DATA.directory, input).exact[0];
      if (dirHit) guide.composio_managed = /managed/.test(dirHit.composio);

      run.saved = !!id;

    } else logLine("err", "Agent could not identify the app");

  } catch (e) {
    run.status = "error";

  }

}

// Server runner: SSE stream from /api/generate
async function runServer(input, opts) {
  const res = await fetch("api/generate", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ input, catalogSlug: opts.catalogSlug || null, existing: opts.existing ? condenseGuide(opts.existing) : null }), signal: run.ctl.signal });
  if (!res.ok || !res.body) throw new Error((await res.text().catch(() => "")) || `Server error ${res.status}`);
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", guide = null, gid = null;
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split("\n").find(l => l.startsWith("data:")); if (!line) continue;
      const ev = JSON.parse(line.slice(5));
      if (ev.type === "log") logLine(ev.kind || "tool", ev.message);
      else if (ev.type === "text") { run.chars = ev.chars; paintRun(); }
      else if (ev.type === "guide") { guide = ev.guide; gid = ev.id; }
      else if (ev.type === "error") throw new Error(ev.message);
    }
  }
  if (!guide) throw new Error("The server ended without a guide");
  return { guide, id: gid };
}

  if (s.access === "read" || s.access === "both") lines.push('Your agent reads data, so check which scopes count as sensitive in <a href="#s-gotchas">Gotchas</a> and <a href="#s-review">Review</a>; read access is the usual trigger for security assessments.');
  if (s.access === "write") lines.push("Your agent only acts or writes, so ask for the narrowest write scopes; that often keeps you out of the strictest review tier.");
  return `<div class="callout" style="border-color:var(--accent)"><span class="eyebrow">For you</span>${lines.map(l => `<p class="small">${l}</p>`).join("")}<p class="small"><button class="linkbtn" type="button" data-editsetup>Change your answers</button></p></div>`;
}
function drawMeBar() {
  const el = $("#mebar"); if (!el) return; const s = getSetup();
  const chips = s ? [optLabel("role", s.role), optLabel("audience", s.audience), optLabel("access", s.access)].filter(Boolean) : [];
  if (!chips.length) { el.innerHTML = `<span class="muted">New here?</span> <button class="linkbtn" type="button" data-editsetup>Answer 3 quick questions</button> <span class="muted">to tailor every guide to you.</span>`; return; }
  el.innerHTML = `<span class="muted">Tailored for:</span> ${chips.map(t => `<span class="chip">${esc(t)}</span>`).join("")} <button class="linkbtn" type="button" data-editsetup>Change</button>`;
}
let onbStep = 0, onbDraft = {};
function openOnboarding() { onbStep = 0; onbDraft = { ...setup() }; const d = $("#onb"); if (!d.open) d.showModal(); renderOnb(); }
function visitorId() {
  let id = store.get("oc:vid", null);
  if (!id || !/^[0-9a-f-]{36}$/.test(id)) { id = crypto.randomUUID ? crypto.randomUUID() : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); store.set("oc:vid", id); }
  return id;
}
async function syncSetup(rec, skipped) { // send to our server; the page keeps working if this fails
  await envReady; if (ENV.kind !== "server") return;
  try {
    const r = await fetch("api/setup", { method: "POST", headers: { "content-type": "application/json" }, keepalive: true,
      body: JSON.stringify({ vid: visitorId(), role: rec.role || null, audience: rec.audience || null, access: rec.access || null, skipped: !!skipped }) });
    if (r.ok) store.set("oc:synced2", true);
  } catch {}
}
function finishOnb(save) {
  const prev = getSetup() || {};
  const rec = save ? { ...onbDraft, done: true } : { ...prev, done: true };
  const answered = !!(rec.role || rec.audience || rec.access);
  store.set(ONB_KEY, rec);
  syncSetup(rec, !answered);
  $("#onb").close(); route();
  if (save && answered) toast("Guides tailored to you");
}
function renderOnb() {
  const f = $("#onbform"), q = Q[onbStep];
  f.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="eyebrow">Tailor the guides · ${onbStep + 1} of ${Q.length}</span><button class="linkbtn small" type="button" data-onb="skip">Skip</button></div>
    <div class="progress" aria-hidden="true"><i style="width:${(onbStep / Q.length) * 100}%"></i></div>
    <div><h2 id="onb-title">${esc(q.q)}</h2><p class="small muted" style="margin-top:6px">${esc(q.help)}</p></div>
    <div class="opts ${q.opts.length > 4 ? "grid2" : ""}" role="group" aria-labelledby="onb-title">
      ${q.opts.map(([v, l, h]) => `<button type="button" class="opt" data-pick="${v}" aria-pressed="${onbDraft[q.id] === v}"><span><b>${esc(l)}</b>${h ? `<br><span class="small muted">${esc(h)}</span>` : ""}</span></button>`).join("")}
    </div>
    <div class="foot">${onbStep ? `<button class="linkbtn small" type="button" data-onb="back">← Back</button>` : "<span></span>"}<span class="small muted">One tap per question</span></div>
    <p class="small muted">Answers are saved anonymously on our server to improve these guides, linked to a random ID for this browser. No name, email or IP address.</p>`;
  (f.querySelector('[aria-pressed="true"]') || f.querySelector("[data-pick]")).focus();
}
$("#onbform").addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    onbDraft[Q[onbStep].id] = pick.dataset.pick;
    $("#onbform").querySelectorAll("[data-pick]").forEach(x => x.setAttribute("aria-pressed", String(x === pick)));
    setTimeout(() => { if (onbStep < Q.length - 1) { onbStep++; renderOnb(); } else finishOnb(true); }, 160);
    return;
  }
  const b = e.target.closest("[data-onb]"); if (!b) return;
  if (b.dataset.onb === "back") { onbStep = Math.max(0, onbStep - 1); renderOnb(); }
  else if (b.dataset.onb === "skip") finishOnb(!!(onbDraft.role || onbDraft.audience || onbDraft.access));
});
$("#onb").addEventListener("cancel", e => { e.preventDefault(); finishOnb(!!(onbDraft.role || onbDraft.audience || onbDraft.access)); });
$("#mysetup").onclick = openOnboarding;
document.addEventListener("click", e => { if (e.target.closest("[data-editsetup]")) openOnboarding(); });

// ---------- boot
let envReady;
async function boot() {
  envReady = (async () => { try { const r = await fetch("api/health"); if (r.ok) { const h = await r.json(); ENV.kind = "server"; ENV.live = !!h.live; } } catch {} })();
  route();
  if (!getSetup()?.done && typeof HTMLDialogElement === "function" && (!location.hash || location.hash === "#library")) openOnboarding();
  await envReady;
  const s0 = getSetup(); if (s0?.done && !store.get("oc:synced2", false)) syncSetup(s0, !(s0.role || s0.audience || s0.access));
  await loadGenerated();
  if (location.hash === "#new") viewNew();
}
boot();
})();
</script>
