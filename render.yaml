services:
  - type: web
    name: oauth-clearance
    runtime: node
    plan: free
    buildCommand: "npm test"
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste in the Render dashboard; never commit it
      - key: TRUST_PROXY
        value: "1"
      - key: GEN_PER_HOUR
        value: "10"
      - key: GEN_PER_DAY
        value: "150"
      - key: ADMIN_TOKEN
        generateValue: true  # Render creates a random secret; copy it from the dashboard to read saved answers
      - key: DATA_DIR
        value: /var/data     # only persistent if the disk below is enabled
    # The free plan has no persistent disk: saved answers and generated guides reset on each redeploy/restart.
    # To keep them, switch `plan` to `starter` and uncomment:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
