ts": "One store, or stores in one Plus org. Installed by a generated install link. The distribution method can't be changed later, so you'd need a new app to go public. Not listed in the App Store. Level 1 and Level 2 protected customer data are available without review."}, {"name": "Public distribution (Shopify App Store listing)", "who_for": "An AI-agent product where any merchant can connect their store", "review": "App Store review (automated checks plus human review), and protected customer data review if requested", "limits": "Before approval, installs work only on development stores. Installs must be initiated from Shopify (App Store URL or Shopify-managed install). Needs a merchant-facing UI, compliance webhooks, expiring offline tokens, Billing API for charges and GraphQL Admin API for new apps."}, {"name": "Store-owned app (created inside a merchant's organization in Dev Dashboard)", "who_for": "A merchant building an internal integration for their own store", "review": "none", "limits": "Replaces legacy admin-created custom apps, which can't be created after Jan 1, 2026. Can use the client credentials grant for stores in its own organization. Not a multi-tenant option."}], "prerequisites": [{"item": "Shopify Partner account (free) with access to the Dev Dashboard at dev.shopify.com", "owner": "human", "note": "Sign up and 2FA. Partner Dashboard data has been migrated into Dev Dashboard."}, {"item": "Shopify CLI 3.84.1+ and Node.js (if building with the app template)", "owner": "agent", "note": "Needed to deploy config (scopes, compliance webhooks) via shopify.app.toml"}, {"item": "Public HTTPS app URL and redirect URL(s)", "owner": "agent", "note": "Valid TLS cert required for App Store"}, {"item": "A development store", "owner": "agent", "note": "Created from the Dev Dashboard. Can be created on any plan, including Plus."}, {"item": "Privacy policy URL, support contact, emergency developer contact", "owner": "human", "note": "Needed for App Store listing"}, {"item": "Data protection answers and security controls for Level 2 PCD (encryption, access logs, incident response policy, etc.)", "owner": "both", "note": "Only if you need customer name/email/phone/address"}], "steps": [{"phase": "Prepare", "title": "Create a Partner account and open the Dev Dashboard", "detail": "Sign up at partners.shopify.com and open dev.shopify.com/dashboard. Apps, stores, payouts and org settings now live there. App listings, pricing and review still live in the Partner Dashboard until distribution moves to Dev Dashboard.", "owner": "human", "time": "10 min", "url": "https://shopify.dev/docs/apps/build/dev-dashboard/migrate-from-partners"}, {"phase": "Register", "title": "Create the app", "detail": "Option A: `shopify app init` (React Router template) then `shopify app dev`. This uses Shopify-managed installation plus token exchange, and expiring offline tokens via `future: { expiringOfflineAccessTokens: true }`. Option B: Dev Dashboard > Apps > Create app for a standalone or API-only agent backend that uses the authorization code grant. Copy the Client ID and Client secret.", "owner": "agent", "time": "10–20 min", "url": "https://shopify.dev/docs/apps/build/authentication-authorization"}, {"phase": "Configure", "title": "Set scopes and redirect URLs in shopify.app.toml", "detail": "Under [access_scopes] set `scopes` to the minimum needed (e.g. read_products,read_orders). Avoid read_all_orders unless justified. Under [auth] set `redirect_urls`. These must exactly match the redirect_uri you send. Deploy with `shopify app deploy` to release a version.", "owner": "agent", "time": "15 min", "url": "https://shopify.dev/docs/apps/build/authentication-authorization/get-access-tokens/auth-code-grant/implement-auth-code-grants-manually"}, {"phase": "Configure", "title": "Declare mandatory compliance webhooks", "detail": "In shopify.app.toml add [webhooks] api_version plus [[webhooks.subscriptions]] with compliance_topics = [\"customers/data_request\",\"customers/redact\",\"shop/redact\"] and a uri. Verify X-Shopify-Hmac-Sha256 and return 401 on bad HMAC (the community reports the automated checker also accepts 400). Respond 2xx, and complete the action within 30 days. These are no longer set in the dashboard UI. Runtime subscriptions don't satisfy the checker.", "owner": "agent", "time": "1–2 h", "url": "https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance"}, {"phase": "Configure", "title": "Choose the distribution method (irreversible)", "detail": "Dev Dashboard > your app > Home > Distribution card > Select distribution method. Custom: enter the merchant's myshopify.com domain, toggle multi-store for a Plus org, then Generate link. Public: you'll create an App Store listing. 'You can't change the method after you select it.'", "owner": "human", "time": "5 min", "url": "https://shopify.dev/docs/apps/launch/distribution/select-distribution-method"}, {"phase": "Configure", "title": "Request protected customer data access (if agent touches customer PII)", "detail": "Partner Dashboard > Apps > your app > API access requests > Protected customer data access > Request access. Select 'Protected customer data' (Level 1) with reasons, then select individual fields (Name, Email, Phone, Address = Level 2) with reasons, then complete Data protection details. On dev stores this unlocks immediately. Public apps need review. This also covers customer-related data on orders, so agent workflows over orders usually need at least Level 1.", "owner": "both", "time": "1–3 h", "url": "https://shopify.dev/docs/apps/launch/protected-customer-data"}, {"phase": "Test", "title": "Install on a dev store and obtain an expiring offline token", "detail": "Authorize: https://{shop}.myshopify.com/admin/oauth/authorize?client_id=...&scope=...&redirect_uri=...&state=.... On callback, verify hmac and state, and validate shop against ^[a-zA-Z0-9][a-zA-Z0-9\\-]*\\.myshopify\\.com$. Then POST https://{shop}.myshopify.com/admin/oauth/access_token with client_id, client_secret, code, expiring=1. Store access_token (expires_in 3600) and refresh_token (refresh_token_expires_in ≈ 90 days).", "owner": "agent", "time": "30 min", "url": "https://shopify.dev/docs/apps/build/authentication-authorization/get-access-tokens/auth-code-grant/implement-auth-code-grants-manually"}, {"phase": "Review", "title": "Build the App Store requirements (public only)", "detail": "Requirements: OAuth immediately on install, before any UI, then redirect to the app UI. A UI is required even for backend or agent apps, embedded in the admin with the latest App Bridge and session tokens that work without third-party cookies. New public apps must use the GraphQL Admin API and expiring offline tokens. Charges go through the Billing API or App Pricing, including upgrade, downgrade and reinstall handling. Run the AI self-review checklist or Dev MCP before you submit.", "owner": "agent", "time": "3–10 days", "url": "https://shopify.dev/docs/apps/launch/shopify-app-store/app-store-requirements"}, {"phase": "Review", "title": "Create listing and submit", "detail": "Listing: name, icon, screenshots, pricing details, privacy policy URL. The submission needs a demo screencast (English or subtitled) of onboarding and core features, and test credentials that bypass 2FA/SSO and stay valid after publish. Set an emergency developer contact. Make sure automated checks pass, then submit.", "owner": "human", "time": "2–4 h", "wait": "Officially up to ~2 weeks. 2026 community reports: 2–5+ weeks.", "url": "https://community.shopify.dev/t/longer-app-store-review-times-what-you-need-to-know/31728"}, {"phase": "Launch", "title": "Publish and handle token refresh at scale", "detail": "After approval, merchants install from the App Store URL. Refresh with grant_type=refresh_token per shop. Serialize refreshes per shop, save the new access/refresh pair atomically, and always use the newest refresh token. Handle 401 on uninstall (subscribe to app/uninstalled).", "owner": "agent", "time": "ongoing", "url": "https://shopify.dev/changelog/more-resilient-refreshes-for-expiring-offline-access-tokens"}], "review": {"required": "conditional", "trigger": "Public distribution, so any merchant outside one store or Plus org can install, needs App Store review. Requesting protected customer data on a public app adds PCD review (Level 1 or Level 2). Custom distribution and dev-store-only use need no review.", "process": "Submit from the Partner Dashboard listing. Automated checks run first (compliance webhooks, HMAC verification, OAuth-on-install, etc.), then a human reviewer installs the app on a test store using your screencast and credentials. Feedback comes by email and in the dashboard. Fix and resubmit; resubmitting puts you at the back of the queue. Apps that repeatedly fail may be temporarily suspended from submitting.", "typical_wait": "Confirmation email says up to 2 weeks. Shopify staff acknowledged longer-than-usual times in Feb 2026, and community threads report 2–5+ weeks through Oct 2026.", "reviewers_check": ["OAuth happens immediately after install and reinstall, before any UI interaction (2.3.2/2.3.4)", "App has a functional merchant UI, embedded in the admin with current App Bridge (2.1.3, 2.2.3)", "Embedded app works without third-party cookies or local storage, e.g. in Chrome incognito (session tokens, 1.1.1)", "Mandatory compliance webhooks are declared in config and verify HMAC", "All charges go through the Shopify Billing API or App Pricing, with plan changes working (1.2.x)", "Minimal scopes, with justification for sensitive ones like read_all_orders (3.2)", "Expiring offline access tokens used (3.1.2), valid TLS (3.1.1), GraphQL Admin API for new apps (2.2.4)", "Screencast, working test credentials, accurate listing with no unsubstantiated claims (4.x)", "Protected customer data use matches stated purpose; Level 2 security controls"], "common_rejections": ["Automated check fails: 'Provides mandatory compliance webhooks' and 'Verifies webhooks with HMAC signatures', because topics were subscribed at runtime instead of in shopify.app.toml, or bad HMAC wasn't rejected", "Install flow not initiated from Shopify, or UI shown before OAuth", "Off-platform billing (Stripe checkout etc.) instead of the Billing API", "Test credentials missing, expired or behind 2FA", "Requesting scopes or protected fields not clearly needed by visible features", "Backend-only/headless app with no meaningful merchant UI"]}, "pre_approval_limits": ["Before approval, a public app can only be installed on development stores; merchant installs are blocked", "Custom distribution: one store, or stores in one Plus organization, permanently for that app", "Protected customer data fields on unreviewed public apps work only on development stores", "Partner Dashboard CLI tokens expire by Feb 6, 2027. Switch CI to SHOPIFY_SERVICE_ACCOUNT_TOKEN."], "oauth": {"authorize_url": "https://{shop}.myshopify.com/admin/oauth/authorize", "token_url": "https://{shop}.myshopify.com/admin/oauth/access_token", "pkce": "not supported", "refresh_tokens": "Only for expiring offline tokens, requested with expiring=1. The refresh token lasts ~90 days from issue (refreshing can shorten it) and rotates on use. Since Aug 2026 an already-used refresh token can be retried for up to 30 days, until the replacement is used. Online tokens have no refresh token; get a new one by re-running token exchange. Legacy non-expiring offline tokens can be migrated with token exchange (subject_token_type=urn:shopify:params:oauth:token-type:offline-access-token, expiring=1), which permanently invalidates the old token for GraphQL.", "access_token_lifetime": "Expiring offline: 1 hour (expires_in 3600). Online: 24 h or until the user logs out of admin. Non-expiring offline (legacy): no expiry, but rejected with 403 for existing public apps after Jan 1, 2027, and not allowed for public apps created on or after Apr 1, 2026.", "redirect_uri_rules": "Must exactly match one of the redirect_urls in the Dev Dashboard or the [auth] section of shopify.app.toml. HTTPS expected (CLI tunnels used in dev). Validate hmac, state, shop and timestamp before exchanging code.", "scopes": "Comma-separated access scopes like read_products, write_orders, read_customers. read_all_orders (beyond 60 days) needs justification. Protected customer data is a separate permission layer. Level 1 covers customer data excluding identifying fields. Level 2 adds per-field Name, Email, Phone, Address and needs extra security controls and review for public apps. Optional scopes can be dynamically granted and revoked.", "tenant_notes": "Every store is a separate tenant with its own hostname, so all OAuth and API URLs are per shop ({shop}.myshopify.com) and tokens are per app per shop. Shopify keeps one current expiring offline token per app+shop; getting a new one retires older ones after their expiry. Embedded CLI apps use Shopify-managed installation (scopes from toml) plus token exchange of the App Bridge session token (id_token) for online or offline tokens. Uninstall revokes all tokens and gives 401."}, "gotchas": [{"title": "Distribution method is permanent", "detail": "Picking Custom distribution for a quick pilot means you need a brand-new app (new client_id, every merchant reinstalls) to go public later.", "severity": "high", "evidence": ["e4"]}, {"title": "Customer PII needs a separate protected customer data approval", "detail": "Agents that read customer names, emails, phones or addresses (including on orders) need Level 2 PCD. Without it, those fields are redacted or error even if you hold read_customers. It works on dev stores, so it often surprises teams only at production.", "severity": "high", "evidence": ["e5"]}, {"title": "Expiring offline tokens are mandatory for new public apps", "detail": "Public apps created on or after Apr 1, 2026 must send expiring=1 and refresh hourly. Existing public apps lose non-expiring tokens on Jan 1, 2027 (403). Your library must implement per-shop serialized refresh with atomic storage.", "severity": "high", "evidence": ["e6", "e7", "e8"]}, {"title": "App Store apps must have a merchant UI and use Shopify Billing", "detail": "A pure backend agent connector isn't permitted. 'All apps in the Shopify App Store must be operational through a UI.' Off-platform charging isn't allowed.", "severity": "high", "evidence": ["e9"]}, {"title": "Review backlog in 2026", "detail": "Shopify staff acknowledged longer review times in Feb 2026. Community threads report 2–5+ weeks, and resubmitting moves you to the back of the queue.", "severity": "medium", "evidence": ["e10", "e11"]}, {"title": "Compliance webhooks must be declared in config, not at runtime", "detail": "The automated checker reads compliance_topics from the released app version. Subscribing via API after install fails the check.", "severity": "medium", "evidence": ["e12", "e13"]}, {"title": "Strict shop hostname validation", "detail": "Use an anchored regex. An unanchored check lets exampleshop.myshopify.com.attacker.example receive the code.", "severity": "medium", "evidence": ["e14"]}, {"title": "Legacy admin custom apps are gone", "detail": "Merchants can no longer create admin custom apps with pre-generated tokens (since Jan 1, 2026). Old tutorials telling users to 'Develop apps > Create an app' in admin are outdated.", "severity": "low", "evidence": ["e3", "e15"]}, {"title": "Refresh-token anomalies have occurred", "detail": "In July 2026 refresh tokens were issued with ~1 second expiry, which Shopify fixed after reports. Log request IDs and treat refresh failures as recoverable for the 30-day window.", "severity": "low", "evidence": ["e16", "e8"]}], "blockers": [{"symptom": "Merchant sees an error installing your public app before approval", "cause": "Unapproved public apps can only install on development stores, and installs must start from Shopify", "fix": "Use dev stores until approved, or ship a separate custom-distribution app for a pilot merchant"}, {"symptom": "Automated check failed: 'Provides mandatory compliance webhooks' / 'Verifies webhooks with HMAC signatures'", "cause": "compliance_topics not in the released shopify.app.toml, or invalid HMAC not rejected", "fix": "Add [[webhooks.subscriptions]] compliance_topics, run shopify app deploy, return 401 on bad HMAC, then rerun checks"}, {"symptom": "Customer fields null or access-denied errors for email/phone/address on a production store", "cause": "Protected customer data (Level 2 fields) not approved for public app", "fix": "Partner Dashboard > API access requests > Protected customer data access; select fields, complete data protection details, submit for review"}, {"symptom": "403 on GraphQL Admin API after Jan 1, 2027 with an old token", "cause": "Non-expiring offline token on a public app", "fix": "Migrate with token exchange (expiring=1) before the deadline, or make merchants re-authenticate"}, {"symptom": "invalid_request / redirect_uri mismatch on authorize", "cause": "redirect_uri not exactly in [auth] redirect_urls of the released version", "fix": "Add the URL to shopify.app.toml and shopify app deploy"}], "agent_vs_human": {"agent_can": ["scaffold the app with Shopify CLI and write shopify.app.toml (scopes, redirect_urls, compliance webhooks)", "implement OAuth with HMAC, state and shop validation and expiring-token refresh", "implement compliance webhook handlers", "draft protected customer data justifications and data-protection answers", "run the AI self-review checklist or Dev MCP against the codebase", "draft listing copy, privacy policy and screencast script", "create dev stores and test installs"], "human_must": ["sign up for a Partner account and complete 2FA", "accept Partner Program terms", "choose the distribution method (irreversible)", "attest to security controls for Level 2 PCD", "record the demo screencast", "provide test credentials and an emergency contact", "click Submit for review and respond to reviewer emails", "set up payout and tax details if charging"]}, "evidence": [{"id": "e1", "claim": "Dev Dashboard is the new home for apps; listings/pricing/review still in Partner Dashboard", "source": "https://shopify.dev/docs/apps/build/dev-dashboard/migrate-from-partners", "type": "official_docs", "status": "verified", "note": "Distribution expected to move to Dev Dashboard 'soon'; CLI tokens expire by Feb 6, 2027"}, {"id": "e2", "claim": "Next-gen dev platform GA Sep 3, 2025; apps and dev stores moved to Dev Dashboard; CLI 3.84.1+", "source": "https://shopify.dev/changelog/next-gen-dev-platform-ga", "type": "official_docs", "status": "verified", "note": "Dev stores can be created on any plan"}, {"id": "e3", "claim": "Admin-created custom apps can no longer be created", "source": "https://shopify.dev/docs/apps/build/authentication-authorization", "type": "official_docs", "status": "verified", "note": "admin-created custom apps, which you can no longer create"}, {"id": "e4", "claim": "Custom distribution limited to one store or one Plus org; method can't be changed", "source": "https://shopify.dev/docs/apps/launch/distribution/select-distribution-method", "type": "official_docs", "status": "verified", "note": "You can't change the method after you select it."}, {"id": "e5", "claim": "PCD Level 1 vs Level 2; Level 2 = name, address, phone, email; public apps need review; dev stores exempt", "source": "https://shopify.dev/docs/apps/launch/protected-customer-data", "type": "official_docs", "status": "verified", "note": "Request via Apps > API access requests > Protected customer data access"}, {"id": "e6", "claim": "Expiring offline tokens required for public apps created on/after Apr 1, 2026", "source": "https://shopify.dev/changelog/expiring-offline-access-tokens-required-for-public-apps-april-1-2026", "type": "official_docs", "status": "verified", "note": "new public apps must request and use expiring offline access tokens | Apr 2026 changelog said pre-Apr apps \"not affected\"; superseded by migration guide Jan 1 2027 deadline (e7)"}, {"id": "e7", "claim": "expiring=1 parameter; token exchange migration; Jan 1, 2027 deadline for existing public apps", "source": "https://shopify.dev/docs/apps/build/authentication-authorization/migrate-to-expiring-offline-access-tokens", "type": "official_docs", "status": "verified", "note": "Migration permanently invalidates the old token for GraphQL Admin API requests"}, {"id": "e8", "claim": "Used refresh token retryable up to 30 days; refresh token 90-day lifetime", "source": "https://shopify.dev/changelog/more-resilient-refreshes-for-expiring-offline-access-tokens", "type": "official_docs", "status": "verified", "note": "Changelog dated Aug 28, 2026"}, {"id": "e9", "claim": "App Store requirements: UI required, OAuth before UI, Billing API, session tokens, expiring tokens, GraphQL", "source": "https://shopify.dev/docs/apps/launch/shopify-app-store/app-store-requirements", "type": "official_docs", "status": "verified", "note": "All apps ... must be operational through a UI"}, {"id": "e10", "claim": "Shopify staff: review times longer than usual; resubmitting goes to back of queue", "source": "https://community.shopify.dev/t/longer-app-store-review-times-what-you-need-to-know/31728", "type": "community", "status": "verified", "note": "Staff post Feb 26, 2026"}, {"id": "e11", "claim": "Review taking more than 2 weeks; 'up to 2 weeks' stated in confirmation email", "source": "https://community.shopify.dev/t/shopify-app-review-taking-more-than-2-weeks-is-this-normal/29646", "type": "community", "status": "reported", "note": "Related threads report 3+ weeks in 2026"}, {"id": "e12", "claim": "Three mandatory compliance webhooks, configured in shopify.app.toml; 30 days to act; 401 on bad HMAC", "source": "https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance", "type": "official_docs", "status": "verified", "note": "Applies to every App Store app"}, {"id": "e13", "claim": "Automated checks fail when compliance topics subscribed at runtime", "source": "https://community.shopify.dev/t/automated-checks-failing-provides-mandatory-compliance-webhooks-verifies-webhooks-with-hmac-signatures-node-express-embedded-app/24933", "type": "community", "status": "reported", "note": "Fix: declare in toml, deploy, reject bad HMAC"}, {"id": "e14", "claim": "Authorize/token URLs, HMAC verification, shop regex, response fields incl. refresh_token_expires_in", "source": "https://shopify.dev/docs/apps/build/authentication-authorization/get-access-tokens/auth-code-grant/implement-auth-code-grants-manually", "type": "official_docs", "status": "verified", "note": "Anchor both ends of the pattern"}, {"id": "e15", "claim": "No new legacy custom apps from admin after Jan 1, 2026", "source": "https://cartcoders.com/blog/shopify-apps/shopify-custom-apps-after-january-1year-dev-dashboard-and-legacy-app-guide/", "type": "community", "status": "reported", "note": "Consistent with official auth overview"}, {"id": "e16", "claim": "Refresh tokens issued with ~1s expiry in July 2026, later fixed", "source": "https://community.shopify.dev/t/refresh-token-returned-with-an-expiry-far-shorter-than-the-documented-90-days/35880", "type": "community", "status": "reported", "note": "Fix reported Jul 31, 2026"}, {"id": "e17", "claim": "Unapproved public apps blocked from installs outside dev stores; installs must start from App Store URL", "source": "https://community.shopify.dev/t/public-app-review/16253", "type": "community", "status": "reported", "note": "Shopify staff reply, June 10, 2025"}, {"id": "e18", "claim": "Offline token 1h/90d refresh; online token 24h or until logout", "source": "https://shopify.dev/docs/apps/auth/access-token-types/offline", "type": "official_docs", "status": "verified", "note": "One current expiring offline token per app and store | Old refresh token stays usable up to 30 days or until newer one used"}, {"id": "e19", "claim": "Embedded apps use token exchange + managed install; client credentials only for own-org stores", "source": "https://shopify.dev/docs/apps/build/authentication-authorization", "type": "official_docs", "status": "verified", "note": "Apps built with Shopify CLI use managed installation by default"}], "uncertain": ["Exact current App Store review SLA; only 'up to 2 weeks' (confirmation email) and community reports of 2–5+ weeks", "Protected customer data review duration, which isn't published", "Shopify revenue share percentage on app charges, not verified in this pass", "Whether every App Store app must be embedded, versus just having a UI integrated into admin; requirements text is ambiguous", "Exact date distribution and listing management move from Partner Dashboard to Dev Dashboard ('soon')", "PKCE: not mentioned in the Shopify auth-code-grant docs reviewed; marked 'not supported' because the documented flow is confidential-client only", "Whether the automated HMAC checker expects 401 (official docs) or 400 (community fix); returning 401 per docs is the safe default"], "last_checked": "2026-10-30", "probes": [{"what": "Not probed", "result": "Authorize URL is per-shop ({shop}.myshopify.com); needs a dev store, which requires creating an account — out of scope for an automated agent.", "outcome": "skipped", "date": "2026-10-30", "method": "n/a"}]}, "slack": {"slug": "slack", "name": "Slack", "provider": "Slack (Salesforce)", "website": "https://api.slack.com/apps", "category": "Communication", "composio_managed": true, "verdict": "You can have other workspaces installing an unlisted app within an hour, but a paid or commercial AI agent needs Slack Marketplace approval. Without it, Slack's terms don't allow commercial distribution and conversations.history/replies are capped at 1 request/min with 15 messages. Start getting 10 active installs now (Slack's minimum again since July 2026, and you must stay at 10+ for the whole review) and budget 1-3 months for review.", "difficulty": {"score": 4, "label": "Hard", "rationale": "Turning on unlisted distribution takes one click and has no review. However, Slack's API Terms forbid commercially distributing an app (including a free app tied to a paid product) without authorization, which normally means a Marketplace listing. Since 29 May 2025, newly created unlisted commercial apps and new installs also get a crippling 1 req/min, 15-object limit on conversations.history/replies. Marketplace review requires a minimum number of active installs, a preliminary review of up to 10 business days, and a functional review of up to 10 weeks."}, "timeline": {"first_token": {"estimate": "10-20 min", "note": "Create the app at api.slack.com/apps, add bot scopes, then click Install to Workspace in your own workspace. You get an xoxb- bot token right away, with no review."}, "production": {"estimate": "6-14+ weeks (unlisted pilots work on day 1)", "active_effort": "3-7 days (landing page, privacy policy, support page, demo video, scope justifications, test account, AI disclosures)", "waiting": "Time to reach the minimum active-workspace installs, plus up to 10 business days of preliminary review and up to 10 weeks of functional review", "note": "Three things drive the wait: (1) collecting the required active-workspace installs while you're throttled as an unlisted app, (2) the functional review queue, (3) resubmissions. A resubmission during preliminary review resets your place in the queue. Enhanced-review scopes such as *:history and files:read make the review longer."}}, "cost": "Free. There is no fee for API access, unlisted distribution or a Marketplace listing. Agent/assistant features need a paid Slack plan on the customer side.", "paths": [{"name": "Internal app (single workspace / your own org)", "who_for": "Testing, or a customer building the agent for its own workspace", "review": "none", "limits": "Full Tier 3 limits on conversations.history/replies (50+ req/min, up to 1,000 objects). Only installable in the workspace that owns the app."}, {"name": "Unlisted public distribution (Manage Distribution)", "who_for": "Pilots with early customers, dev/test installs in other workspaces", "review": "none", "limits": "conversations.history and conversations.replies are capped at Tier 1 (1 req/min, max 15 objects per call) for apps created and installs made since 29 May 2025 (Slack's changelog says installs that pre-date that are not impacted; third-party claims of a 3 March 2026 cutover for existing installs are unconfirmed). Slack terms forbid commercial distribution without authorization. Workspaces may block non-Marketplace apps or require admin approval."}, {"name": "Slack Marketplace listing", "who_for": "Any commercially distributed agent (paid, freemium, or free but tied to a paid product)", "review": "Preliminary review (up to 10 business days), then functional review (up to 10 weeks for new apps, 6 weeks for updates)", "limits": "Standard rate limits. Requires a minimum number of active installs (10 active workspaces since July 2026, maintained throughout review) before you can submit. Every later scope or feature change needs re-review. AI agent/assistant apps must not store Slack data (zero-copy)."}], "prerequisites": [{"item": "A Slack workspace where you can install apps (a free dev workspace works; a Developer Program sandbox is recommended)", "owner": "human", "note": "Use it as your development workspace. Marketplace testing must happen in a different workspace."}, {"item": "A public HTTPS backend with an OAuth redirect endpoint (plus Events/Interactivity request URLs if used)", "owner": "agent", "note": "Slack requires SSL for redirect, interactivity, options-load and Events API URLs."}, {"item": "Secure token store (DB/secret manager) for bot tokens, user tokens, and rotating refresh tokens", "owner": "agent", "note": "With token rotation, refresh tokens are single-use. Always persist the newest one."}, {"item": "For Marketplace: a public landing page, privacy policy, support contact (2-business-day response), and test credentials for your service", "owner": "both", "note": "The landing page must be a dedicated, login-free web page, not a PDF or a repo."}, {"item": "For Marketplace: installs in at least 10 active workspaces (used in the last 28 days, sandboxes excluded)", "owner": "human", "note": "Submissions below the threshold are blocked automatically, and the app must stay at 10+ during the entire review (Slack changelog 2026-09-01)."}], "steps": [{"phase": "Register", "title": "Create the app", "detail": "Go to api.slack.com/apps > Create New App > 'From a manifest' (recommended so config lives in git) or 'From scratch'. Choose the development workspace. App name and icon appear on the consent screen.", "owner": "human", "time": "5 min", "url": "https://api.slack.com/apps"}, {"phase": "Configure", "title": "Add redirect URLs and scopes", "detail": "Open OAuth & Permissions. Under Redirect URLs, add your https callback(s); no '#' fragments are allowed. Under Scopes, add Bot Token Scopes (e.g. chat:write, app_mentions:read, channels:history, im:history). Add User Token Scopes only if the agent must act as the user (e.g. search:read). In the authorize URL, bot scopes go in `scope` and user scopes in `user_scope`.", "owner": "both", "time": "15 min", "url": "https://docs.slack.dev/authentication/installing-with-oauth"}, {"phase": "Configure", "title": "Decide on token rotation (one-way)", "detail": "OAuth & Permissions > Advanced token security via token rotation > Opt in (manifest: settings.token_rotation_enabled: true). Access tokens then expire every 12 hours (expires_in 43200) with an xoxe. prefix. Refresh via POST oauth.v2.access with grant_type=refresh_token. You can't turn this off once it's on, so build the refresh logic first.", "owner": "agent", "time": "30 min", "url": "https://docs.slack.dev/authentication/using-token-rotation"}, {"phase": "Configure", "title": "Enable Events / Agents & AI Apps features as needed", "detail": "Event Subscriptions: set the Request URL and subscribe to bot events (app_mention, message.im, etc.). If you use the assistant/agent surface, enable it in the app config. Verify requests with the Signing Secret; verification tokens are deprecated. Prefer Events over polling history, because the history methods are heavily throttled for unlisted apps.", "owner": "agent", "time": "30-60 min"}, {"phase": "Test", "title": "Install to your own workspace and get a token", "detail": "OAuth & Permissions > Install to Workspace (or run your own /slack/install route). Bot token (xoxb-) is top-level in the oauth.v2.access response; user token is under authed_user. Check the `state` param on callback.", "owner": "both", "time": "5 min"}, {"phase": "Configure", "title": "(Optional) Opt in to org-wide deployment for Enterprise orgs", "detail": "Add at least one bot scope, then open Org Level Apps in the sidebar > Opt-In > Yes, Opt-in (manifest: org_deploy_enabled: true). An Enterprise org admin/owner must install at the org level. The oauth.v2.access response then has is_enterprise_install: true, team: null, and enterprise.id. The admin must add the app to workspaces afterwards, so redirect them to do that.", "owner": "both", "time": "30 min", "url": "https://docs.slack.dev/enterprise/developing-for-enterprise-orgs"}, {"phase": "Launch", "title": "Activate unlisted public distribution", "detail": "Basic Information > Manage Distribution > 'Share Your App with Other Workspaces'. Complete the checklist, then click Activate Public Distribution. You get an Add to Slack button and a shareable install URL. There is no review, but remember the commercial-distribution and rate-limit restrictions.", "owner": "human", "time": "10 min", "url": "https://docs.slack.dev/app-management/distribution/"}, {"phase": "Prepare", "title": "Collect the required active installs", "detail": "Get the app used in at least 10 non-sandbox workspaces that are active within 28 days, and keep it there through review (Slack changelog 2026-09-01). Design pilot features around the Events API (message events) and RTS/search rather than bulk history reads.", "owner": "human", "time": "ongoing", "wait": "Depends on your pilot pipeline"}, {"phase": "Prepare", "title": "Prepare Marketplace materials", "detail": "Prepare a landing page (overview, how it works, install path, next steps, privacy link), a privacy policy (data collected, use, retention, access/deletion requests, contact), and a support page. Write a justification for every scope (only for features you can demo). Prepare a test account with dummy data plus third-party credentials, and a demo video covering install, OAuth, setup, end-to-end use and uninstall. For AI apps, add the Security & Compliance answers (model used, retention, LLM data tenancy/residency) and an inaccurate-output disclaimer.", "owner": "both", "time": "2-5 days", "url": "https://docs.slack.dev/slack-marketplace/slack-marketplace-app-guidelines-and-requirements/"}, {"phase": "Review", "title": "Submit to the Slack Marketplace", "detail": "Open Manage Distribution > Submit to Slack Marketplace and complete the submission form. Reviewers can't access your workspaces, so give them an install method plus credentials for your service.", "owner": "human", "time": "1-2 h", "wait": "Preliminary up to 10 business days; functional up to 10 weeks", "url": "https://docs.slack.dev/slack-marketplace/slack-marketplace-review-guide"}, {"phase": "Launch", "title": "Publish and manage changes", "detail": "After approval, scope and config changes go through Published App Settings and need re-review (up to 6 weeks for published apps). Token rotation for listed apps is set under Published App Settings.", "owner": "human", "time": "-", "wait": "Re-review up to 6 weeks per change"}], "review": {"required": "conditional", "trigger": "Any commercial distribution: users could pay for your product, including freemium apps and free apps tied to a paid product. Slack's API Terms require authorization, which in practice means a Marketplace listing. You also need it to escape the Tier 1 history/replies limit. Internal apps and non-commercial unlisted apps need no review.", "process": "Meet the active-install minimum, then submit. Preliminary review checks the listing, docs, scope justifications and installability. Functional review means a reviewer tests the features and scopes. Slack may run an advanced security review at any time. It is a moment-in-time review, not a code review.", "typical_wait": "Official maximums are 10 business days (preliminary) plus 10 weeks (functional, new apps). Community reports range from 2 weeks (an expedited, viral AI agent) to 2-3 months typical.", "reviewers_check": ["Each scope maps to a working, demoable feature, with minimal scopes and no bot/user duplication", "Landing page, privacy policy and support meet guidelines", "Install, onboarding, use and uninstall work in a non-dev workspace", "Security: tokens stored securely, `state` used, TLS 1.2+, requests verified with signing secret", "AI disclosures: model, retention, data tenancy/residency, no training on Slack data, disclaimer about inaccurate output", "Agent/assistant apps don't store Slack data (zero-copy) and disclose that a paid Slack plan is needed"], "common_rejections": ["Requesting scopes for features not yet built, or broad/legacy/restricted scopes (admin.*, identity.*, search:read)", "Missing or non-working test credentials, or giving Slack workspace credentials instead of an install method", "Bugs, poor UX, app not production-ready or still in beta", "Unnecessary user-token scopes"]}, "pre_approval_limits": ["Unlisted commercially distributed apps: conversations.history and conversations.replies at 1 request/min with max and default limit=15 objects (apps created / installs made since 2025-05-29; Slack says older existing installs are not impacted)", "Slack API Terms: no commercial distribution without authorization (Marketplace or separate agreement)", "Workspaces with 'Approve apps' turned on make members request the app, and an admin must approve it", "Some workspaces allow only Marketplace-listed apps"], "oauth": {"authorize_url": "https://slack.com/oauth/v2/authorize (user-only: https://slack.com/oauth/v2_user/authorize; GovSlack: https://slack-gov.com/oauth/v2/authorize)", "token_url": "https://slack.com/api/oauth.v2.access (user-only flow: oauth.v2.user.access)", "pkce": "supported", "refresh_tokens": "Only with token rotation, which is opt-in and irreversible. Refresh tokens are single-use, each refresh returns a new one, and at most 2 active access tokens are allowed per 12h window. PKCE-enabled (public client) apps get refresh tokens that expire after 30 days.", "access_token_lifetime": "No expiry by default; tokens last until revoked or the app is uninstalled. With rotation, 12 hours (xoxe. prefix).", "redirect_uri_rules": "HTTPS required. redirect_uri must match, or be a subdirectory of, a Redirect URL configured on OAuth & Permissions. You can register multiple URLs. Use the same redirect_uri in the authorize and token steps, otherwise you get bad_redirect_uri. No '#' fragments. Localhost and custom schemes only with PKCE (GA 2026-03-30), and those can't request bot scopes.", "scopes": "Granular scopes, split into bot scopes (`scope`) and user scopes (`user_scope`). *:history, files:read, search:read.*, canvases:read and admin.* trigger enhanced Marketplace review. admin.* is generally limited to partners. Unused or duplicate scopes get rejected.", "tenant_notes": "Each workspace install yields its own token keyed by team.id. Enterprise orgs: opt in to Org Level Apps and an org admin installs once (is_enterprise_install=true, enterprise.id), then adds the app to workspaces. Workspace or org admins may require app approval. Rate limits are per app per workspace per method."}, "gotchas": [{"title": "Unlisted AI agents get only 15 messages per minute of history", "detail": "Since 2025-05-29, for apps created or installed after that date, commercially distributed non-Marketplace apps can call conversations.history/replies only once per minute, with 15 objects max. Internal apps and Marketplace apps aren't affected. Agents degrade silently, getting less context with no error. Workarounds: build context from Events API message events, use the Real-time Search API, or get listed.", "severity": "high", "evidence": ["e1", "e2", "e3"]}, {"title": "Commercial distribution needs Slack's authorization", "detail": "The API Terms (effective 2025-10-10) forbid commercially distributing an app unless authorized. The definition covers paid, freemium, and free apps connected to a paid product. For most apps, authorization means a Marketplace listing.", "severity": "high", "evidence": ["e4"]}, {"title": "Don't train LLMs on Slack data, and don't build persistent indexes", "detail": "API Terms: you may not use API Data to train a large language model, or bulk export message/file data. With the Data Access/RTS APIs you can't create persistent copies, archives or indexes of other orgs' data. Marketplace guidelines also say agent/assistant apps must not store Slack data (zero-copy). This rules out the usual RAG-index-everything design.", "severity": "high", "evidence": ["e4", "e5"]}, {"title": "Marketplace submission needs real installs first", "detail": "Submissions are auto-blocked below the active-workspace threshold (workspaces active in the last 28 days, sandboxes excluded). The 2025-07-08 changelog lowered it to 5, but current review docs still say 10. Plan your pilot program accordingly.", "severity": "high", "evidence": ["e6", "e7", "e17"]}, {"title": "Token rotation can't be undone", "detail": "Once you opt in, every token expires in 12h and refresh tokens are single-use. If you lose the latest refresh token (race between workers, failed DB write), the user has to reinstall. Make the refresh-and-persist step atomic or locked.", "severity": "medium", "evidence": ["e8"]}, {"title": "Review is long and changes are re-reviewed", "detail": "Functional review can take up to 10 weeks (6 weeks for updates). Resubmitting during preliminary review resets your queue position. After listing, adding a scope means another review.", "severity": "medium", "evidence": ["e7"]}, {"title": "Admin approval and Marketplace-only workspaces", "detail": "Workspaces can require admin approval, or allow only Marketplace apps. Users then see a 'Request' flow and the install stalls until an admin acts. Fewer and narrower scopes get approved faster.", "severity": "medium", "evidence": ["e9", "e10"]}, {"title": "Enterprise org installs return no team", "detail": "An org-wide install returns team: null and is_enterprise_install: true. Code that keys tokens by team.id breaks. Store by enterprise.id and send the admin to add the app to workspaces.", "severity": "medium", "evidence": ["e11"]}, {"title": "Enhanced-review scopes", "detail": "*:history, files:read, search:read.* and canvases:read are exactly what agents want, and they trigger deeper review. search:read (user) is listed as generally unsuitable. Justify each one with a demoable feature.", "severity": "medium", "evidence": ["e5"]}], "blockers": [{"symptom": "bad_redirect_uri", "cause": "redirect_uri isn't a configured Redirect URL (or a subdirectory of one), or differs between the authorize and oauth.v2.access calls", "fix": "Add the exact https URL under OAuth & Permissions > Redirect URLs and pass the identical value in both steps."}, {"symptom": "Agent sees only ~15 recent messages / ratelimited on conversations.history", "cause": "Unlisted commercial app limit (Tier 1, limit=15)", "fix": "Use Events API to capture messages as they happen, use Real-time Search API, or get a Marketplace listing. Internal apps aren't affected."}, {"symptom": "Marketplace 'Submit' blocked", "cause": "Fewer active-workspace installs than the threshold", "fix": "Grow pilot installs (non-sandbox, active in the last 28 days) to the threshold."}, {"symptom": "invalid_refresh_token / invalid_grant after enabling rotation", "cause": "Reused an old single-use refresh token, or lost the newest one", "fix": "Always persist the refresh_token from each response before using the access token. Serialize refreshes per installation. As a last resort, reinstall."}, {"symptom": "User clicks Add to Slack but sees 'Request to install'", "cause": "Workspace has app approval enabled", "fix": "The workspace admin approves under app management. Give customers an admin-facing scope explanation."}], "agent_vs_human": {"agent_can": ["generate app manifest (scopes, redirect URLs, events, org_deploy_enabled, token_rotation_enabled)", "implement OAuth callback with state check and token storage", "implement rotation-safe refresh logic", "design Events-API-based context capture to avoid history rate limits", "draft scope justifications", "draft privacy policy, landing page and support page", "draft AI security & compliance disclosures", "write demo video script and test plan"], "human_must": ["sign in to Slack / own the dev workspace", "accept Slack API Terms and the Marketplace agreement", "click Activate Public Distribution and Submit", "recruit pilot workspaces to reach the install threshold", "record demo video", "provide test credentials", "answer reviewer emails"]}, "evidence": [{"id": "e1", "claim": "Non-Marketplace commercially distributed apps: history/replies drop to Tier 1, 1 req/min, limit 15; internal and Marketplace apps exempt", "source": "https://docs.slack.dev/changelog/2025/05/29/rate-limit-changes-for-non-marketplace-apps", "type": "official_docs", "status": "verified", "note": "Effective May 29, 2025 for new apps and new installs"}, {"id": "e2", "claim": "Slack changelog says existing (pre-29 May 2025) installations of unlisted apps are not impacted; no official source found for a 3 March 2026 cutover", "source": "https://docs.slack.dev/changelog/2025/05/29/rate-limit-changes-for-non-marketplace-apps/", "type": "official_docs", "status": "uncertain", "note": "Official page: \"These rate limits will not impact existing installations.\" 3 Mar 2026 date appears only in third-party posts (allanninal.dev, dev.to)."}, {"id": "e3", "claim": "Agents degrade silently; grace period ended 2026-03-03; Events API workaround", "source": "https://dev.to/helen_mireille_47b02db70c/slack-just-throttled-your-openclaw-agent-you-probably-havent-noticed-yet-d4", "type": "community", "status": "uncertain", "note": "Vendor-authored blog, March 2026"}, {"id": "e4", "claim": "API Terms: no LLM training on API Data, no bulk export, no persistent indexes (DAA/RTS); commercial distribution needs authorization", "source": "https://slack.com/terms-of-service/api", "type": "official_docs", "status": "verified", "note": "\"use API Data to train a large language model\" prohibited; effective Oct 10, 2025 | Re-checked 2026-10-30: \"Effective: October 10, 2025\""}, {"id": "e5", "claim": "Marketplace AI rules (no training, disclosures, zero-copy for agents) and enhanced-review scopes", "source": "https://docs.slack.dev/slack-marketplace/slack-marketplace-app-guidelines-and-requirements/", "type": "official_docs", "status": "verified", "note": "\"DON'T use Slack data to train LLMs.\""}, {"id": "e6", "claim": "Minimum active-workspace installs lowered from 10 to 5 starting August 11 (2025)", "source": "https://docs.slack.dev/changelog/2025/07/08/slack-marketplace", "type": "official_docs", "status": "verified", "note": "Conflicts with review guide still stating 10 | Superseded: 2026-09-01 changelog restores 10-workspace minimum (as of July 2026)"}, {"id": "e7", "claim": "Preliminary review up to 10 business days; functional up to 10 weeks (6 for updates); 10 active installs stated", "source": "https://docs.slack.dev/slack-marketplace/slack-marketplace-review-guide", "type": "official_docs", "status": "verified", "note": "\"up to 10 weeks for new submissions\""}, {"id": "e8", "claim": "Token rotation: 12h expiry, single-use refresh tokens, irreversible, xoxe. prefix", "source": "https://docs.slack.dev/authentication/using-token-rotation", "type": "official_docs", "status": "verified", "note": "\"Token rotation may not be turned off once it's turned on.\""}, {"id": "e9", "claim": "Manage Distribution > Activate Public Distribution; SSL required for redirect URLs; admins may require approval or Marketplace-only apps", "source": "https://docs.slack.dev/app-management/distribution/", "type": "official_docs", "status": "verified", "note": "Unlisted distribution described as suited to pilots"}, {"id": "e10", "claim": "With app approval on, members request apps and admins approve", "source": "https://slack.com/help/articles/202035138-Add-apps-to-your-Slack-workspace", "type": "official_docs", "status": "verified", "note": "\"members can request to install apps when app approval is turned on\""}, {"id": "e11", "claim": "Org Level Apps opt-in; is_enterprise_install true, team null, enterprise.id", "source": "https://docs.slack.dev/enterprise/developing-for-enterprise-orgs", "type": "official_docs", "status": "verified", "note": "Requires at least one bot scope before opt-in"}, {"id": "e12", "claim": "OAuth v2 endpoints, bot scope vs user_scope, redirect must be HTTPS, tokens don't expire without rotation", "source": "https://docs.slack.dev/authentication/installing-with-oauth", "type": "official_docs", "status": "verified", "note": "\"The redirect_uri must use HTTPS.\""}, {"id": "e13", "claim": "PKCE GA 2026-03-30; enabling makes app a public client (one-way); custom-scheme/localhost can't request bot scopes; refresh tokens 30 days", "source": "https://docs.slack.dev/changelog/2026/03/30/pkce", "type": "official_docs", "status": "verified", "note": "Optional for standard flows, required for custom URI schemes | Re-checked 2026-10-30"}, {"id": "e14", "claim": "Real-Time Search API and Slack MCP server generally available", "source": "https://slack.com/blog/news/mcp-real-time-search-api-now-available", "type": "official_docs", "status": "verified", "note": "Announced Feb 17, 2026"}, {"id": "e15", "claim": "AI agent approved in ~2 weeks (expedited); typical 2-3 months per Reddit", "source": "https://viktor.com/blog/slack-marketplace-ai-agent", "type": "community", "status": "reported", "note": "Self-reported marketing post, Feb 2026"}, {"id": "e16", "claim": "Third-party summary of 2026 Slack review stages and timelines; 5-workspace prerequisite", "source": "https://workos.com/blog/oauth-app-approval-slack-microsoft-atlassian", "type": "community", "status": "reported", "note": "Dated Aug 27, 2026 | 5-workspace figure outdated per 2026-09-01 changelog"}, {"id": "e17", "claim": "As of July 2026 Marketplace submissions need at least 10 active-workspace installs, maintained for the entire review (temporary lower threshold ended)", "source": "https://docs.slack.dev/changelog/2026/09/01/slack-marketplace-install-requirement", "type": "official_docs", "status": "verified", "note": "\"at least 10 installations on active workspaces\"; also stated in Marketplace review guide"}], "uncertain": ["Whether the conversations.history/replies 1 req/min limit now also applies to installs made before 29 May 2025: Slack's official changelog says existing installs are not impacted, but several third-party posts claim enforcement on existing installs by 3 March 2026. Assume the limit applies to anything you ship now.", "Exact items in the Manage Distribution checklist (e.g. 'Remove hard-coded information') weren't listed in the docs page fetched.", "Whether Real-Time Search API access requires a Marketplace listing, and its rate limits for unlisted apps, weren't confirmed.", "Real-world functional review duration varies widely (2 weeks to ~3 months). The data points are community-reported.", "Whether the API Terms' LLM clause restricts inference-time use beyond training. The terms only explicitly ban training, plus general minimization and no-persistent-index rules."], "last_checked": "2026-10-30", "probes": [{"what": "Authorize endpoint with fake client_id while signed out", "result": "Redirects to 'Find your workspace' sign-in; Slack resolves the workspace before validating client_id", "outcome": "partial", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}]}, "twitter": {"slug": "twitter", "name": "X (Twitter) API v2", "provider": "X Corp.", "website": "https://docs.x.com", "category": "Social Media", "composio_managed": false, "verdict": "Register an app in the X Developer Console (console.x.com), enable OAuth 2.0 (PKCE) as a Web App with offline.access, and buy pay-per-use credits. There is no app review and no managed option, but every call is billed and AI-generated replies need prior approval from X.", "difficulty": {"score": 3, "label": "Moderate", "rationale": "Technically self-serve with no app review. However, no free tier exists for new developers: pay-per-use credits are mandatory before any call succeeds. Strict automation and AI-reply policies carry suspension risk, and since Feb 2026 programmatic replies are blocked unless the author summoned your account."}, "timeline": {"first_token": {"estimate": "20–40 min", "note": "Sign up at console.x.com, accept the Developer Agreement, create an app, configure OAuth 2.0, add a card and buy credits."}, "production": {"estimate": "1–3 days", "active_effort": "0.5–2 days (token rotation handling, spend limits, automation-rule compliance)", "waiting": "None for standard posting/reading. Prior approval from X is needed for AI-generated replies (no published timeline). Enterprise sales cycle if you exceed the pay-per-use read cap.", "note": "No user caps or app review. Production readiness means billing and spend caps, single-flight refresh-token rotation, and compliance with automation rules."}}, "cost": "Pay-per-use credits required (no subscription). Pricing per docs.x.com as checked: post read $0.005/resource, user lookup $0.010, post create $0.015, post with URL $0.20, owned reads $0.001. Pay-per-use capped at 3M post reads per billing cycle; Enterprise is custom above that. Legacy Basic/Pro closed to new signups.", "paths": [{"name": "Pay-per-use (default for all new developers)", "who_for": "Any AI agent posting/reading on behalf of users.", "review": "none (use-case description at signup/app creation)", "limits": "Prepaid credits; spend limit per billing cycle; 3M post reads/cycle cap; per-endpoint rate limits; replies only when summoned (mentioned/quoted)."}, {"name": "Enterprise", "who_for": "High-volume read, firehose/compliance streams, or unrestricted programmatic replies.", "review": "Sales contract with X.", "limits": "Custom pricing (community reports tens of thousands USD/month)."}], "prerequisites": [{"item": "X account for the developer (phone/email verified)", "owner": "human", "note": "Developer Console sign-in uses an X account."}, {"item": "Payment card for credits", "owner": "human", "note": "Requests fail with 402 when credits are depleted."}, {"item": "Use-case description (how you will use the API)", "owner": "agent", "note": "Requested at signup and app creation; be accurate about AI/automation."}, {"item": "HTTPS callback URL(s) and website URL", "owner": "agent", "note": "Up to 10 callback URLs; exact match including trailing slash."}, {"item": "Terms of service and privacy policy URLs", "owner": "agent", "note": "Shown to users on the consent screen (reported)."}], "steps": [{"phase": "Register", "title": "Sign up in the Developer Console", "detail": "Go to console.x.com, sign in with X, accept the Developer Agreement and Policy, and complete the profile with a description of how you'll use the API (mention AI agent posting on users' behalf with consent).", "owner": "human", "time": "10 min", "url": "https://docs.x.com/x-api/getting-started/getting-access.md"}, {"phase": "Register", "title": "Create an app and save credentials", "detail": "Dashboard > New App > name, description, use case. Copy the API Key/Secret and Bearer Token right away, because credentials are shown only once. Regenerating them invalidates the old ones.", "owner": "human", "time": "5 min"}, {"phase": "Configure", "title": "Configure user authentication (OAuth 2.0)", "detail": "App > authentication settings: enable OAuth 2.0 (and OAuth 1.0a only if you need legacy endpoints). App permissions: Read and write (add Direct Messages only if needed). Type of App: Web App, Automated App or Bot (confidential client, gets a Client Secret). Callback URI / Redirect URL: exact HTTPS URLs, max 10. Website URL, plus Terms/Privacy URLs. Save, then copy the OAuth 2.0 Client ID and Client Secret.", "owner": "human", "time": "10 min", "url": "https://docs.x.com/resources/fundamentals/developer-apps.md"}, {"phase": "Configure", "title": "Buy credits and set a spend limit", "detail": "Developer Console > billing: add a card, buy credits, set a maximum spend per billing cycle, and optionally enable auto-recharge. Make sure the app is on the Pay-per-use package / Production environment, or calls return 403 client-not-enrolled.", "owner": "human", "time": "5 min", "url": "https://docs.x.com/x-api/getting-started/pricing"}, {"phase": "Test", "title": "Run Authorization Code + PKCE", "detail": "Redirect to https://x.com/i/oauth2/authorize?response_type=code&client_id=...&redirect_uri=...&scope=tweet.read%20tweet.write%20users.read%20offline.access&state=...&code_challenge=...&code_challenge_method=S256. Exchange the code within 30 seconds: POST https://api.x.com/2/oauth2/token with grant_type=authorization_code, code, redirect_uri, code_verifier, and Basic auth (client_id:client_secret) for confidential clients.", "owner": "agent", "time": "15 min", "url": "https://docs.x.com/fundamentals/authentication/oauth-2-0/authorization-code"}, {"phase": "Test", "title": "Post and read as the user", "detail": "GET https://api.x.com/2/users/me, then POST https://api.x.com/2/tweets {\"text\": \"...\"}. For media add the media.write scope. Remember each call debits credits (URL posts cost $0.20).", "owner": "agent", "time": "10 min"}, {"phase": "Launch", "title": "Harden token refresh", "detail": "Access tokens last 2 h. Refresh with grant_type=refresh_token. Each refresh returns a NEW refresh token and burns the old one, so serialize refreshes per user (distributed lock) and persist the new pair before using it.", "owner": "agent", "time": "2–4 h"}, {"phase": "Launch", "title": "Comply with automation and AI rules", "detail": "Get express user consent for automated actions and honor opt-outs. Use no keyword-triggered auto-replies and no trending-topic automation. Bot accounts must enable the 'Automated' label and say in the bio who runs them. Get prior approval from X before deploying AI-generated replies. Do not use X data to train models.", "owner": "both", "time": "0.5 day", "url": "https://docs.x.com/developer-guidelines"}, {"phase": "Review", "title": "Only if needed: request approval for AI replies / Enterprise", "detail": "If your agent replies with AI-generated content, request prior approval from X (via platform support/your X contact) before launch. For volume above the pay-per-use cap or replies without being summoned, contact X Enterprise sales.", "owner": "human", "time": "1 h", "wait": "No published timeline"}], "review": {"required": "conditional", "trigger": "No app review for standard OAuth apps. Prior approval from X is required before deploying AI-generated replies. Enterprise needs a contract. Policy enforcement happens after the fact (suspension).", "process": "Use-case description at signup and app creation, with no human review gate observed. For AI replies, request X's approval. Violations are handled by app suspension, and you appeal through the Platform Help Form (help.x.com/forms/platform).", "typical_wait": "None for standard access. AI-reply approval and Enterprise have no published timeline.", "reviewers_check": ["Developer Agreement and Policy compliance", "Automation rules (consent, opt-out, no spammy replies/mentions)", "Automated account labeling", "No scraping or unofficial automation", "Data use restrictions (no AI training, off-X matching only with consent)"], "common_rejections": ["App suspended for automated replies/mentions to non-consenting users", "Undisclosed AI-generated replies without approval", "Rate-limit circumvention", "Use case description not matching actual behaviour"]}, "pre_approval_limits": ["No calls succeed without purchased credits (402 when depleted).", "Pay-per-use: 3M post reads per billing cycle cap.", "Programmatic replies via API v2 only when the original author mentioned or quoted your account (since Feb 2026; Enterprise exempt).", "AI-generated replies require prior approval from X.", "Per-endpoint rate limits (e.g. user/post lookup 900 req/15 min per app under OAuth 2.0)."], "oauth": {"authorize_url": "https://x.com/i/oauth2/authorize (OAuth 1.0a: https://api.x.com/oauth/authorize after POST oauth/request_token)", "token_url": "https://api.x.com/2/oauth2/token (revoke: https://api.x.com/2/oauth2/revoke; OAuth 1.0a: POST oauth/access_token)", "pkce": "required", "refresh_tokens": "Only when offline.access scope is requested. Rotating, single-use: each refresh returns a new refresh token and invalidates the previous one. Unused refresh tokens eventually expire (reported ~months); revoked on user deauth or client secret regeneration.", "access_token_lifetime": "2 hours (expires_in 7200). Authorization code valid 30 seconds. OAuth 1.0a user tokens do not expire (until revoked).", "redirect_uri_rules": "Must exactly match a registered Callback URI (including trailing slash); up to 10 per app; for local dev use http://127.0.0.1 rather than localhost.", "scopes": "Granular OAuth 2.0 scopes: tweet.read, tweet.write, tweet.moderate.write, users.read, users.email, follows.read/write, like.read/write, list.read/write, block.read/write, mute.read/write, bookmark.read/write, dm.read/dm.write, media.write, space.read, offline.access. Most endpoints need tweet.read + users.read alongside the action scope. App-level permission (Read / Read and write / + DMs) also caps OAuth 1.0a tokens; changing permissions requires users to re-authorize.", "tenant_notes": "Single global tenant. Public clients (Native, SPA) send client_id in body and get no secret; confidential clients (Web App, Automated App/Bot) use Basic auth. Every user action is billed to YOUR developer account."}, "gotchas": [{"title": "No free tier: pay-per-use credits required", "detail": "Since Feb 6, 2026 new developers are on pay-per-use credits. Legacy Free users got a one-time voucher; Basic/Pro are closed to new signups. Budget for every read and write, and set a spend limit.", "severity": "high", "evidence": ["e1", "e2", "e3"]}, {"title": "Posts with links cost ~13x more", "detail": "Post create is $0.015, but a post containing a URL is $0.20 (April 2026 pricing). Agents that share links can burn credits fast.", "severity": "high", "evidence": ["e1", "e3"]}, {"title": "Programmatic replies blocked unless summoned", "detail": "Since late Feb 2026, API v2 replies are refused unless the post's author mentioned or quoted your account (Enterprise exempt). A 'reply to this thread' agent feature will fail for most targets.", "severity": "high", "evidence": ["e9", "e10"]}, {"title": "AI-generated replies need prior approval from X", "detail": "Deploying AI-generated replies without approval violates developer guidelines even if the content is helpful. Automated accounts must use the 'Automated' label and disclose the operator in the bio.", "severity": "high", "evidence": ["e7", "e8"]}, {"title": "Rotating single-use refresh tokens", "detail": "Each refresh invalidates the previous refresh token. Concurrent workers refreshing the same user cause 400 invalid_request 'Value passed for the token was invalid.' and force re-auth. Use a per-user lock.", "severity": "high", "evidence": ["e4", "e11"]}, {"title": "30-second authorization code lifetime", "detail": "The code must be exchanged within 30 seconds, so do the exchange synchronously in the callback handler.", "severity": "medium", "evidence": ["e4"]}, {"title": "OAuth authorization alone is not consent for automation", "detail": "Automation rules require express consent for automated actions beyond the OAuth grant, plus immediate opt-out handling. Keyword-triggered auto-replies and trending-topic posting are prohibited, and violations can suspend the app and user accounts.", "severity": "high", "evidence": ["e6"]}, {"title": "Credentials shown once; regenerating breaks tokens", "detail": "Console shows keys only once. Regenerating the client secret invalidates issued tokens.", "severity": "medium", "evidence": ["e5", "e11"]}, {"title": "No training on X data", "detail": "Developer guidelines prohibit using X data to train AI/ML models (Grok excepted). Keep fetched content out of fine-tuning datasets.", "severity": "medium", "evidence": ["e7"]}], "blockers": [{"symptom": "402 Payment Required / credits depleted", "cause": "Credit balance at or below zero.", "fix": "Top up credits in the Developer Console; auto-recharge does not trigger at zero."}, {"symptom": "403 client-not-enrolled (type client-forbidden)", "cause": "App not attached to the Pay-per-use package / Production environment.", "fix": "In the Developer Console move the app into the pay-per-use package and Production environment."}, {"symptom": "403 on reply POST /2/tweets", "cause": "Reply restriction: the target author did not mention or quote your account.", "fix": "Only reply when summoned, post standalone, or negotiate Enterprise."}, {"symptom": "400 invalid_request 'Value passed for the token was invalid.' on refresh", "cause": "Refresh token already used (rotation), revoked, or secret regenerated.", "fix": "Serialize refreshes; reload latest token pair; else re-authorize user."}, {"symptom": "'You weren't able to give access to the App' on consent screen", "cause": "Callback mismatch, OAuth 2.0 not enabled, bad PKCE params, or client ID/secret from different apps.", "fix": "Check exact callback URL (trailing slash), enable OAuth 2.0, send code_challenge + method."}, {"symptom": "403 oauth1-permissions", "cause": "OAuth 1.0a token issued while app was Read-only.", "fix": "Change permissions to Read and write, regenerate tokens, and have users re-authorize."}, {"symptom": "App suspended email", "cause": "Policy violation (automation/spam/AI replies).", "fix": "Appeal via help.x.com/forms/platform; fix behaviour before reinstatement."}], "agent_vs_human": {"agent_can": ["Write the use-case description and app description", "Generate PKCE flow and Basic-auth token exchange code", "Implement locked refresh-token rotation and 2h expiry handling", "Estimate monthly credit spend from expected usage", "Draft consent and opt-out UX copy and the bot bio disclosure", "Verify callback URLs (exact match, trailing slashes)"], "human_must": ["Sign in with X account and accept the Developer Agreement", "Create the app and store credentials shown once", "Add payment card, buy credits, set spend limit", "Request AI-reply approval or Enterprise contract from X", "Enable the Automated label on bot accounts", "Appeal suspensions"]}, "evidence": [{"id": "e1", "claim": "Pay-per-use prices: read $0.005, user $0.010, create $0.015, URL post $0.20; 3M post reads cap; spend limits; dedup 24h", "source": "https://docs.x.com/x-api/getting-started/pricing", "type": "official_docs", "status": "verified", "note": "\"capped at 3 million Post reads per monthly billing cycle\" | Re-checked 2026-10-30: create $0.015, URL post $0.200, 3M read cap"}, {"id": "e2", "claim": "Pay-per-use launched Feb 2026 with no subscription", "source": "https://www.medianama.com/2026/02/223-x-developer-api-pricing-pay-per-use-model/", "type": "community", "status": "reported", "note": "News article dated Feb 7, 2026 | Corroborated by docs.x.com pricing: \"No subscriptions—pay only for what you use\"; no free tier listed"}, {"id": "e3", "claim": "Feb 6 2026 launch; Basic deprecated after Jun 1 2026, Pro after Sep 1 2026; URL rate April 2026", "source": "https://opentweet.io/x-api-pricing", "type": "community", "status": "reported", "note": "Vendor page, last checked Oct 2026"}, {"id": "e4", "claim": "PKCE S256/plain, scopes list, 2h access token, offline.access refresh, 30s code, confidential vs public clients", "source": "https://docs.x.com/fundamentals/authentication/oauth-2-0/authorization-code.md", "type": "official_docs", "status": "verified", "note": "Auth code \"has a time limit of 30 seconds\" | 2h token and 30s code re-confirmed"}, {"id": "e5", "claim": "Getting access via console.x.com; credentials shown once; OAuth 2.0 recommended over 1.0a", "source": "https://docs.x.com/x-api/getting-started/getting-access.md", "type": "official_docs", "status": "verified", "note": "\"Credentials are only displayed once\""}, {"id": "e6", "claim": "Automation rules: OAuth not sufficient consent; no keyword auto-replies; suspension", "source": "https://help.x.com/en/rules-and-policies/x-automation", "type": "official_docs", "status": "verified", "note": "Page dated Nov 3, 2017 but still current policy"}, {"id": "e7", "claim": "AI-generated replies require prior approval; Automated label; no AI training on X data", "source": "https://docs.x.com/developer-guidelines", "type": "official_docs", "status": "verified", "note": "\"Deploying AI-generated replies without approval is a violation\""}, {"id": "e8", "claim": "Automated accounts must display label and link to a human-run account", "source": "https://help.x.com/en/using-x/automated-account-labels", "type": "official_docs", "status": "verified", "note": "\"Our Automation rules require these accounts to display labels\""}, {"id": "e9", "claim": "Self-serve customers: replies only permitted if the original author summoned the replying account (@mention or quote); Enterprise not covered by this note", "source": "https://docs.x.com/x-api/posts/manage-tweets/introduction.md", "type": "official_docs", "status": "verified", "note": "\"Replies are only permitted if the original post's author has explicitly summoned\"; secondary: roboin.io 2026-02-24"}, {"id": "e10", "claim": "Reply restriction applies to pay-per-use; refused at write step", "source": "https://opentweet.io/how-to/fix-x-api-reply-restriction", "type": "community", "status": "reported", "note": "Updated Aug 31, 2026"}, {"id": "e11", "claim": "Refresh tokens rotate (single-use); error 'Value passed for the token was invalid.'", "source": "https://opentweet.io/how-to/fix-x-oauth-refresh-token-expired", "type": "community", "status": "reported", "note": "Every refresh invalidates the one you sent"}, {"id": "e12", "claim": "Max 10 callback URLs, exact match incl. trailing slash, use 127.0.0.1; permission change requires reauth; suspension appeal form", "source": "https://docs.x.com/resources/fundamentals/developer-apps.md", "type": "official_docs", "status": "verified", "note": "\"URLs must match exactly (including trailing slashes)\""}, {"id": "e13", "claim": "OAuth 1.0a user tokens do not expire; 3-legged endpoints", "source": "https://docs.x.com/fundamentals/authentication/oauth-1-0a/obtaining-user-access-tokens.md", "type": "official_docs", "status": "verified", "note": "\"These tokens do not expire but can be revoked\""}, {"id": "e14", "claim": "402 credits depleted, 403 client-not-enrolled error meanings", "source": "https://opentweet.io/tools/x-api-error-decoder", "type": "community", "status": "reported", "note": "X's codes page does not list 402 per this source"}], "uncertain": ["How to request X's prior approval for AI-generated replies (form/contact) and how long it takes is not documented on the pages read.", "Exact dates when legacy Basic (Jun 1, 2026) and Pro (Sep 1, 2026) subscribers were migrated come from a vendor page only.", "Refresh token absolute lifetime for X OAuth 2.0 is not officially documented ('eventually expires' per community).", "Whether a human reviews the use-case description at signup; none was observed in docs, but X may act on it later.", "Enterprise pricing figures (tens of thousands USD/month) are community-reported only.", "Prices change frequently ('subject to change'); confirm in the Developer Console before quoting."], "last_checked": "2026-10-30", "probes": [{"what": "x.com/i/oauth2/authorize with fake client_id + PKCE params while signed out", "result": "'Log in to X to continue' — client validated after sign-in", "outcome": "partial", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}], "aliases": ["X", "x.com", "twitter.com", "X API"]}, "xero": {"slug": "xero", "name": "Xero (Accounting API)", "provider": "Xero", "website": "https://developer.xero.com", "category": "Accounting", "composio_managed": false, "verdict": "Create a 'Web app' at developer.xero.com/app/manage. It works instantly for up to 5 connected organisations on the free Starter tier. Add a credit card to go to 50 (Core, AUD 35/mo). Going past 50 needs Xero App Certification (Plus tier), which takes weeks to months. New apps (created on or after 2 Mar 2026) must use the granular scopes, and Xero API data may not be used to train AI models.", "difficulty": {"score": 4, "label": "Hard", "rationale": "Getting a token is easy and self-serve, and there's no review at all for up to 50 tenants (paid above 5). Scaling past 50 connections needs App Certification against Xero's checkpoints. Xero partner integrators describe that as taking 'several months', with no published SLA, and 10,000+ connections also need a security assessment. Tiered API fees apply from 2 Mar 2026."}, "timeline": {"first_token": {"estimate": "15–30 min", "note": "Free Xero account, create an app, authorise against the Demo Company. No sandbox host; you call the production API against the demo organisation."}, "production": {"estimate": "≤5 orgs: same day. ≤50 orgs: same day (card required). >50 orgs: ~1–4+ months", "active_effort": "Certification: 1–3 weeks of build work (Sign Up with Xero, app launcher, error handling, data integrity, account/tax mapping) plus listing and support docs", "waiting": "Certification review and App Store listing: no published SLA. Partner integrators report it 'can take several months'.", "note": "Driven by certification checkpoints, needing real beta customers (Xero material cites at least 3; a devblog title cites 10, see uncertain), and Xero's review queue. Security assessment (initial and annual) is needed for the Advanced tier (>1,000 connections)."}}, "cost": "Starter free (5 connections, 1,000 calls/day/org). Core AUD 35/mo (50 connections, 10 GB egress). Plus AUD 245/mo (1,000 connections, needs certification). Advanced AUD 1,445/mo (10,000 connections, certification + security assessment). Enterprise POA. Egress overage AUD 2.40/GB. Tax-exclusive, effective 2 Mar 2026. Custom Connections are billed separately per connection to the subscriber org (e.g. USD 5/mo).", "paths": [{"name": "Custom Connection (client credentials, single org)", "who_for": "One customer's own Xero organisation, for internal or machine-to-machine use", "review": "none", "limits": "One organisation per connection. The customer org pays per connection (AU $10 AUD, NZ $10 NZD, UK £5, US $5 per month). AU/NZ/UK/US orgs only. Free with the Demo Company. No refresh tokens or tenant header."}, {"name": "Uncertified multi-tenant Web app (Starter / Core tier)", "who_for": "Early-stage AI agent product, pilots, design partners", "review": "none", "limits": "Starter: max 5 connected orgs, free. Core: max 50, card required. Can't list on the Xero App Store. Rate limit 1,000 calls/day/org on Starter, 5,000 on Core."}, {"name": "Certified app (Plus / Advanced / Enterprise tier)", "who_for": "Production multi-tenant agent product needing >50 orgs", "review": "App Certification (checkpoints review). Advanced and Enterprise add an initial and annual security assessment. App Store listing optional on Plus/Advanced, required on Enterprise.", "limits": "1,000 / 10,000 / unlimited connections. Journals endpoint, Practice Manager API and Bulk Connections need security assessment and use-case approval (Advanced+)."}], "prerequisites": [{"item": "Xero user account (free trial is fine) to sign in to developer.xero.com", "owner": "human", "note": "Accept the Xero Developer Platform Terms. Developers registered on or after 4 Dec 2025 are on the new terms."}, {"item": "Demo Company enabled in your Xero account", "owner": "human", "note": "For testing. Uses the production API."}, {"item": "HTTPS redirect URI (localhost allowed for dev)", "owner": "agent", "note": "Exact match"}, {"item": "Credit card in the Developer Portal before your 6th connection", "owner": "human", "note": "Core tier and above"}, {"item": "For certification: beta customers, support docs, branding per Xero guidelines", "owner": "both", "note": "See certification checkpoints"}], "steps": [{"phase": "Register", "title": "Create the app", "detail": "developer.xero.com > My Apps > New app. Enter the app name, integration type ('Web app' for a server-side agent backend with a client secret, 'Mobile or desktop app' for PKCE without a secret, or 'Custom connection' for single-org M2M), company or application URL and redirect URI, then accept the terms. On the app's Configuration page, generate a client secret and copy it immediately.", "owner": "human", "time": "10 min", "url": "https://developer.xero.com/documentation/guides/oauth2/auth-flow/"}, {"phase": "Configure", "title": "Choose granular scopes", "detail": "Apps created on or after 2 Mar 2026 must request granular scopes. Use accounting.invoices(.read), accounting.payments(.read), accounting.banktransactions(.read), accounting.manualjournals(.read), accounting.classicexpenses, and report scopes like accounting.reports.profitandloss.read / balancesheet.read / trialbalance.read / aged.read / banksummary.read / executivesummary.read / taxreports.read. Unchanged: accounting.contacts, accounting.settings, accounting.attachments, accounting.budgets. Always include offline_access, plus openid profile email if you need identity. Broad accounting.transactions and accounting.reports.read aren't available to new apps.", "owner": "agent", "time": "20 min", "url": "https://devblog.xero.com/upcoming-changes-to-xero-accounting-api-scopes-705c5a9621a0"}, {"phase": "Test", "title": "Authorise against the Demo Company", "detail": "Redirect the user to https://login.xero.com/identity/connect/authorize?response_type=code&client_id=...&redirect_uri=...&scope=offline_access%20accounting.invoices%20...&state=.... Exchange the code at POST https://identity.xero.com/connect/token (Basic auth client_id:secret, grant_type=authorization_code). The code is single-use and lasts 5 min.", "owner": "agent", "time": "20 min", "url": "https://dev.to/ilshadyx/xero-api-integration-guide-2026-oauth-tenants-and-your-first-query-ked"}, {"phase": "Test", "title": "Resolve tenants via /connections", "detail": "GET https://api.xero.com/connections with the bearer token. This returns every org the user has connected to your app, not just this flow's. Filter by the authEventId claim in the access token to find newly authorised tenants. Send the Xero-tenant-id header on every Accounting API call. Ignore entries whose tenantType isn't ORGANISATION, unless you use Practice Manager.", "owner": "agent", "time": "20 min", "url": "https://dev.to/ilshadyx/xero-api-integration-guide-2026-oauth-tenants-and-your-first-query-ked"}, {"phase": "Configure", "title": "Implement rotating refresh", "detail": "The access token lasts 30 min. Refresh with grant_type=refresh_token; each refresh returns a NEW refresh token and the old one expires after a 30-min
