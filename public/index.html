official_docs", "status": "verified", "note": "Scope table lists gmail.readonly and gmail.modify under Restricted | Re-checked 2026-10-30 scope table; gmail.labels non-sensitive"}, {"id": "e2", "claim": "Restricted scopes require sensitive-scope requirements plus an annual security assessment", "source": "https://support.google.com/cloud/answer/13464321", "type": "official_docs", "status": "verified", "note": "restricted scopes must meet the additional requirement of secure data handling"}, {"id": "e3", "claim": "Testing refresh tokens expire in 7 days; 6-month inactivity; 100 tokens per account per client; password change revokes Gmail-scoped tokens", "source": "https://developers.google.com/identity/protocols/oauth2", "type": "official_docs", "status": "verified", "note": "is issued a refresh token expiring in 7 days"}, {"id": "e4", "claim": "Testing limited to 100 test users; authorizations lapse after 7 days", "source": "https://support.google.com/cloud/answer/15549945", "type": "official_docs", "status": "verified", "note": "limited to up to 100 test users listed in the OAuth consent screen"}, {"id": "e5", "claim": "Unverified user cap is 100 new users over the project's lifetime and cannot be reset", "source": "https://support.google.com/cloud/answer/15549945", "type": "official_docs", "status": "verified", "note": "User cap section: 100 new users, lifetime, not resettable"}, {"id": "e6", "claim": "CASA assurance levels AL1/AL2; all apps revalidated every year; Letter of Validation", "source": "https://support.google.com/cloud/answer/13465431", "type": "official_docs", "status": "verified", "note": "All applications must be revalidated every year"}, {"id": "e7", "claim": "Restricted-scope verification can take several weeks; reverify and reassess every 12 months after LOA; YouTube unlisted demo video", "source": "https://developers.google.com/identity/protocols/oauth2/production-readiness/restricted-scope-verification", "type": "official_docs", "status": "verified", "note": "can potentially take several weeks to complete"}, {"id": "e8", "claim": "Community timelines: CASA 5-20 days prepared; TAC $540-$720; renewal email ~90 days before; no generalized AI training; common rejection causes", "source": "https://nango.dev/docs/api-integrations/google-shared/google-security-review", "type": "community", "status": "reported", "note": "Vendor (Nango) guide, pricing as of August 2025"}, {"id": "e9", "claim": "Transfers of Workspace data for generalized AI/ML models are prohibited; privacy policy must state it", "source": "https://workspace.google.com/blog/ai-and-machine-learning/api-policy-protections?hl=en", "type": "official_docs", "status": "verified", "note": "Feb 2, 2024 post: generalized ML or AI models are prohibited"}, {"id": "e10", "claim": "Client secrets masked after creation; unused clients deleted after 6 months, restorable 30 days", "source": "https://developers.googleblog.com/en/usability-and-safety-updates-to-google-auth-platform/", "type": "official_docs", "status": "verified", "note": "Apr 28, 2025 post; changes starting June (2025)"}, {"id": "e11", "claim": "Sensitive scope verification up to 10 days; brand check minutes; result valid 7 days; brand verification 2-3 business days", "source": "https://developers.google.com/identity/protocols/oauth2/production-readiness/sensitive-scope-verification", "type": "official_docs", "status": "verified", "note": "can take up to 10 days to complete | Brand manual review \"usually takes 2-3 business days\" per brand-verification page"}, {"id": "e12", "claim": "Endpoints, access_type=offline, prompt=consent, redirect URI validation rules", "source": "https://developers.google.com/identity/protocols/oauth2/web-server", "type": "official_docs", "status": "verified", "note": "Redirect URI validation rules section; wildcards disallowed"}, {"id": "e13", "claim": "Verification exemptions: personal use <100, testing, service accounts, internal, admin-trusted", "source": "https://support.google.com/cloud/answer/13464323?hl=en", "type": "official_docs", "status": "verified", "note": "Apps in development/testing/staging mode are not subject to verification"}, {"id": "e14", "claim": "Google Auth Platform sections: Overview, Branding, Audience, Clients, Data Access, Verification Center", "source": "https://support.google.com/cloud/answer/15544987", "type": "official_docs", "status": "verified", "note": "Manage your configuration list"}, {"id": "e15", "claim": "CASA Tier 2/3 lab price ranges (TAC $540 Tier 2, ~$4,500 Tier 3; others $800-$1,500+)", "source": "https://www.switchlabs.dev/post/casa-tier-2-tier-3-security-review-providers-pricing-and-the-cheapest-option", "type": "community", "status": "reported", "note": "Table labeled 'as of 2024'; prices vary"}, {"id": "e16", "claim": "Vendor-reported restricted-scope end-to-end 4-12+ weeks; Q1 2026 CASA self-serve ~$540-$1,000", "source": "https://www.unipile.com/integrating-google-oauth-2-0-user-authentication-into-your-app/", "type": "community", "status": "reported", "note": "Vendor page; misclassifies gmail.readonly as sensitive, so use with caution"}], "uncertain": ["Exact CASA tier assignment (AL1 vs AL2 / Tier 2 vs 3) is decided by Google per app based on user count and scopes; lab prices are community-reported and change.", "Real-world restricted-scope wait times vary widely (2 to 12+ weeks); Google publishes only 'several weeks'.", "Whether a Gmail-scoped refresh token in a verified app has any hard expiry beyond the documented revocation conditions (none documented).", "Whether Google currently waives CASA for very small user bases; historically it was user-count dependent, and current docs only say tiering considers user count."], "last_checked": "2026-10-30", "probes": [{"what": "Authorize endpoint with fake client_id (scope gmail.readonly)", "result": "Google error page: 'Access blocked: Authorization Error' — Error 401: invalid_client ('The OAuth client was not found.')", "outcome": "confirmed", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}, {"what": "OIDC discovery https://accounts.google.com/.well-known/openid-configuration", "result": "code_challenge_methods_supported: plain, S256 → PKCE supported; token endpoint oauth2.googleapis.com/token; revocation endpoint present", "outcome": "confirmed", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}], "aliases": ["Google Mail"]}, "linkedin": {"slug": "linkedin", "name": "LinkedIn (Sign In with LinkedIn, Share on LinkedIn, Community Management API)", "provider": "LinkedIn (Microsoft)", "website": "https://developer.linkedin.com", "category": "Social Media", "composio_managed": true, "verdict": "Create an app linked to a verified LinkedIn Company Page and add the self-serve 'Sign In with LinkedIn using OpenID Connect' and 'Share on LinkedIn' products. That gets an agent basic profile plus posting as the member within minutes. Treat everything else (company pages, reading posts or feed, messages, connections, Sales Navigator) as partner-gated or unavailable.", "difficulty": {"score": 2, "label": "Easy", "rationale": "The self-serve products are granted instantly once the app exists and a Page super admin has verified it. Anything beyond member sign-in and posting is Gated (5): Community Management API needs a legal entity, business email, a separate app, review, and a screencast for Standard tier. SNAP is closed, and r_member_social is closed."}, "timeline": {"first_token": {"estimate": "15–45 min", "note": "Faster if you are already super admin of the Company Page (verification approves instantly). Otherwise you wait for the page's super admin to click the verification link, which can take up to 30 days."}, "production": {"estimate": "Same day for member sign-in + posting; weeks to months for Community Management Standard tier", "active_effort": "Self-serve: 1–2 hours. CM API: 2–5 days (form, integration, screencast)", "waiting": "Self-serve: none. CM API Development tier then Standard tier: LinkedIn publishes no SLA; community reports range from weeks to several months", "note": "No review gate for self-serve products and no user cap. Production effort goes into handling 60-day token expiry (no refresh tokens) and the AI policy's human-in-the-loop rules."}}, "cost": "Free (self-serve products and Community Management API). No paid tier for API access.", "paths": [{"name": "Self-serve consumer products (Sign In with LinkedIn using OIDC + Share on LinkedIn)", "who_for": "AI agents that identify the member and publish posts/comments as that member.", "review": "none (accept API terms when adding products)", "limits": "Scopes openid, profile, email, w_member_social only. Share on LinkedIn: 150 requests/member/day, 100,000/app/day. No refresh tokens; 60-day access tokens. Cannot read posts, feed, connections or messages."}, {"name": "Community Management API (vetted)", "who_for": "Agents managing Company Pages (post as org, read comments, analytics) or member post management.", "review": "Access request form for Development tier (legal org, business email, page verification); Standard tier form with screencast and test credentials.", "limits": "Must be a new app with no other products. Development tier: 500 calls/app/day, 100/member/day. Registered legal organizations, commercial use only. Rejection means creating a new app."}, {"name": "Partner programs (Advertising API, SNAP, Talent, Learning)", "who_for": "Ads management, sales/recruiting integrations.", "review": "Partner application; SNAP is not accepting new partners; Talent programs require partnership.", "limits": "Not realistic for a general AI-agent library."}], "prerequisites": [{"item": "Personal LinkedIn account for the developer (with 2FA/email verified)", "owner": "human", "note": "Apps are created under a member account at linkedin.com/developers/apps."}, {"item": "LinkedIn Company Page for your business", "owner": "human", "note": "Required field when creating an app; the page's super admin must verify the app."}, {"item": "App logo (square image) and privacy policy URL", "owner": "agent", "note": "Logo required at creation; privacy policy needed for CM API vetting."}, {"item": "HTTPS redirect URL(s) on your backend", "owner": "agent", "note": "Absolute URL, no fragment; query params are ignored."}, {"item": "For CM API only: registered legal entity, business email on your domain, verified website", "owner": "human", "note": "Personal email addresses fail vetting."}], "steps": [{"phase": "Prepare", "title": "Create or confirm your LinkedIn Company Page", "detail": "linkedin.com > For Business > Create a Company Page if you don't have one. Make sure you (or a colleague) are a super admin.", "owner": "human", "time": "10 min"}, {"phase": "Register", "title": "Create the app", "detail": "https://www.linkedin.com/developers/apps > Create app. Fields: App name, LinkedIn Page (search your Company Page), Privacy policy URL, App logo; tick the Legal agreement; Create app. Do not include 'LinkedIn' or Microsoft names/logos in the app.", "owner": "human", "time": "5 min", "url": "https://www.linkedin.com/developers/apps"}, {"phase": "Register", "title": "Verify the app with the Company Page", "detail": "App > Settings tab > App settings > Verify > Generate URL. Send the URL to the Page super admin (or open it yourself if you are one) and approve. The super admin has 30 days to approve.", "owner": "human", "time": "2 min", "wait": "Instant if you are super admin; otherwise until the admin acts (≤30 days)"}, {"phase": "Configure", "title": "Add self-serve products", "detail": "Products tab > 'Sign In with LinkedIn using OpenID Connect' > Request access (accept terms); 'Share on LinkedIn' > Request access. Both are granted immediately. Check the Auth tab > 'OAuth 2.0 scopes' now lists openid, profile, email, w_member_social.", "owner": "human", "time": "5 min", "url": "https://learn.microsoft.com/en-us/linkedin/shared/authentication/getting-access"}, {"phase": "Configure", "title": "Register redirect URLs and copy credentials", "detail": "Auth tab > OAuth 2.0 settings > Authorized redirect URLs for your app > add https://app.example.com/oauth/linkedin/callback. Copy Client ID and Primary Client Secret.", "owner": "both", "time": "5 min"}, {"phase": "Test", "title": "Run the 3-legged authorization code flow", "detail": "GET https://www.linkedin.com/oauth/v2/authorization?response_type=code&client_id=...&redirect_uri=...&state=<random>&scope=openid%20profile%20email%20w_member_social. Exchange the code within 30 minutes: POST https://www.linkedin.com/oauth/v2/accessToken (grant_type=authorization_code, code, client_id, client_secret, redirect_uri). Call GET https://api.linkedin.com/v2/userinfo; author URN = urn:li:person:{sub}.", "owner": "agent", "time": "15 min"}, {"phase": "Test", "title": "Create a test post as the member", "detail": "POST https://api.linkedin.com/rest/posts with headers Authorization: Bearer, X-Restli-Protocol-Version: 2.0.0, LinkedIn-Version: YYYYMM (a currently supported version), body author=urn:li:person:{sub}, lifecycleState=PUBLISHED, visibility, commentary. (Legacy: POST /v2/ugcPosts as in the Share on LinkedIn doc.) Posts go live immediately, so keep human approval in your own app.", "owner": "agent", "time": "15 min"}, {"phase": "Launch", "title": "Implement re-auth around day 60 and AI-policy UX", "detail": "Store expires_in (5184000 s). Prompt the user to reconnect before expiry, and on any 401. Show an 'AI-powered' label and let the user edit AI-generated content before it is posted, per LinkedIn's Developer AI policy.", "owner": "agent", "time": "0.5–1 day"}, {"phase": "Review", "title": "Optional: Community Management API (separate app)", "detail": "Create a NEW app (no other products) > Products > Community Management API > Request access > fill the access form (legal name, address, website, privacy 100/member/day."], "oauth": {"authorize_url": "https://www.linkedin.com/oauth/v2/authorization", "token_url": "https://www.linkedin.com/oauth/v2/accessToken", "pkce": "not supported", "refresh_tokens": "Not issued to self-serve apps. Programmatic refresh tokens (365-day TTL, not extended on use) are only for approved partners (MDP/CM). Otherwise re-run the authorization flow; consent is skipped if the member is still logged in and the token is unexpired.", "access_token_lifetime": "60 days (expires_in 5184000). Authorization code valid 30 minutes. LinkedIn may revoke tokens at any time.", "redirect_uri_rules": "Absolute HTTPS URL registered on the Auth tab; must match; query parameters are ignored; '#' fragments not allowed. PKCE native flow (loopback 127.0.0.1) only when LinkedIn enables it for your app.", "scopes": "Space-delimited; the member must accept all requested scopes (no granular opt-out). Available scopes depend on products on the app. Requesting a different scope set invalidates previous tokens for that member/app. Self-serve: openid, profile, email, w_member_social.", "tenant_notes": "Single global tenant. Each app is tied to one Company Page. Community Management API must live on its own app with no other products, so a library may need two client IDs (consumer app + CM app)."}, "gotchas": [{"title": "Company Page + super-admin verification required", "detail": "Every app must be associated with a LinkedIn Company Page, and the Page's super admin must approve the app via a verification URL (valid 30 days). Without it, product requests and CM vetting stall.", "severity": "high", "evidence": ["e7", "e8", "e5"]}, {"title": "No refresh tokens for self-serve apps — 60-day hard expiry", "detail": "Access tokens last 60 days. Programmatic refresh tokens are only for approved partners, so agents must prompt users to reconnect about every 2 months.", "severity": "high", "evidence": ["e3", "e4"]}, {"title": "What an agent cannot do", "detail": "Self-serve cover ional, takes 5–10 business days, and is reviewed by Notion.", "difficulty": {"score": 2, "label": "Easy", "rationale": "Fully self-serve: no security assessment, no verification queue, and no user cap for OAuth. The only review is optional Marketplace listing. The main complexity is the page-picker access model, and recent token-model changes (per-authorization tokens with refresh tokens)."}, "timeline": {"first_token": {"estimate": "10–20 min", "note": "Developer portal > Build > Public connections > Create new connection. Fill in the name, development workspace, redirect URI(s), installation scope and capabilities, copy the OAuth client ID and secret from the Configuration tab, and run the code flow."}, "production": {"estimate": "Same day without a Marketplace listing; 1–3 weeks with one", "active_effort": "2–4 hours (organization info, privacy policy, listing assets)", "waiting": "None for OAuth use. Marketplace listing review: Notion replies within 5–10 business days.", "note": "No approval gate for OAuth. The time goes into correct capability selection, handling page-picker UX (users must share pages), and, optionally, Marketplace review."}}, "cost": "Free", "paths": [{"name": "Internal connection (static token)", "who_for": "Agents operating on your own workspace only", "review": "none", "limits": "One workspace. You must be a workspace owner to create it. Pages must be shared with the connection manually (••• > Connections). No OAuth."}, {"name": "Public connection, 'Selected workspaces only'", "who_for": "Pilots or a fixed set of customer workspaces", "review": "none", "limits": "Only the workspaces chosen at creation can install it. Not Marketplace eligible. Scope cannot be changed after creation."}, {"name": "Public connection, 'Any workspace'", "who_for": "Multi-tenant agent products", "review": "none for OAuth. Optional Notion review for a Marketplace listing.", "limits": "Each user authorizes individually and only sees pages they shared through the page picker. Marketplace-eligible."}], "prerequisites": [{"item": "Notion account and a development workspace", "owner": "human", "note": ""}, {"item": "Organization information: company name, website, privacy policy URL (and terms/support email if prompted)", "owner": "both", "note": "Third-party setup guides report these as required fields in the public connection form."}, {"item": "HTTPS redirect URI(s) on your backend", "owner": "agent", "note": ""}, {"item": "Listing name, description, category/tags, logo and images (only for a Marketplace listing)", "owner": "both", "note": ""}], "steps": [{"phase": "Register", "title": "Create the public connection", "detail": "Developer portal > Build > Public connections > Create new connection. Enter the Connection name, Development workspace, Redirect URI(s), and Installation scope: choose 'Any workspace' for a multi-tenant product, because it is set once and is permanent. Fill in the organization fields (company name, website, privacy policy).", "owner": "human", "time": "10 min", "url": "https://developers.notion.com/guides/get-started/public-connections"}, {"phase": "Configure", "title": "Select capabilities", "detail": "Choose only what the agent needs: Read content, Update content, Insert content, comment read/insert, and user information (with or without email). Users see these on the consent screen.", "owner": "agent", "time": "5 min", "url": "https://developers.notion.com/guides/get-started/public-connections"}, {"phase": "Configure", "title": "Copy credentials", "detail": "Configuration tab > OAuth client ID and OAuth client secret. Store the secret server-side. The token endpoint uses HTTP Basic auth with base64(client_id:client_secret).", "owner": "human", "time": "2 min"}, {"phase": "Configure", "title": "Optional: template URL", "detail": "Set 'Notion URL for optional template' so users can duplicate a starter page during authorization. The token response then includes duplicated_template_id.", "owner": "both", iness days (official)", "reviewers_check": ["Listing quality (name, description, images, category)", "Brand and trademark use (no implying a Notion partnership)", "Baseline connection criteria in Notion's Connection Gallery best practices"], "common_rejections": ["Brand or trademark issues", "Quality concerns with the listing or connection", "Not meeting baseline connection criteria", "Connection created with 'Selected workspaces only' scope, which is ineligible and must be recreated"]}, "pre_approval_limits": ["None for OAuth. Any Notion user can authorize an 'Any workspace' public connection immediately", "'Selected workspaces only' connections are limited to the workspaces chosen at creation", "API rate limit (about 3 requests/second average per connection) applies regardless of review"], "oauth": {"authorize_url": "https://api.notion.com/v1/oauth/authorize", "token_url": "https://api.notion.com/v1/oauth/token", "pkce": "unknown", "refresh_tokens": "Yes. The token response includes refresh_token (nullable in the schema). Refreshing with grant_type=refresh_token returns a new access token and a new refresh token. Community reports say the old refresh token stops working (rotation), and reusing it gives invalid_grant. Since June 8, 2026, new public connections issue a unique token pair per authorization, including re-authorizations.", "access_token_lifetime": "Not documented. The token response has no expires_in field. Community sources say tokens expire, so refresh on 401 and proactively.", "redirect_uri_rules": "Registered in the Developer portal when creating the connection, and multiple URIs are allowed. redirect_uri in the token request is required if it was in the authorize URL or if the connection has more than one URI, and is not allowed otherwise. HTTPS, wildcard and localhost rules are not documented. Use exact HTTPS URIs.", "scopes": "No OAuth scope strings. Access is governed by capabilities chosen on the connection (read/update/insert content, comments io/integrations/builtin/credentials/notion.md", "type": "community", "status": "reported", "note": "n8n credential setup docs"}], "uncertain": ["Access token lifetime: no expires_in in the official schema; community sources say tokens expire, but no duration is published.", "PKCE support for public connections is not documented.", "Exact required organization fields (terms of use, support email) in the current Developer portal form; only company name, website and privacy policy were confirmed via third-party guides.", "Redirect URI constraints (HTTPS-only, localhost, wildcards, max count) are not documented.", "Whether rotation invalidates the previous refresh token immediately is reported by the community, not stated by Notion.", "The year of the space-level token deprecation (October 19) was not shown; it appears to be a historical change, not a 2026 one.", "Rate limit figure (about 3 requests/second) is from general knowledge, not re-verified in this pass."], "last_checked": "2026-10-30", "probes": [{"what": "api.notion.com/v1/oauth/authorize with fake client_id while signed out", "result": "Redirects to Notion login; client validated after sign-in", "outcome": "partial", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}]}, "outlook": {"slug": "outlook", "name": "Microsoft Outlook (Microsoft Graph / Entra ID)", "provider": "Microsoft", "website": "https://learn.microsoft.com/en-us/graph/outlook-mail-concept-overview", "category": "Email", "composio_managed": true, "verdict": "Register a multitenant Entra app with delegated Mail.Read/Mail.Send plus offline_access. You will have a working token in about 20 minutes, but get publisher verification through the Microsoft AI Cloud Partner Program before launch: unverified multitenant apps are stepped up to admin consent in most business tenants, and expect most business tenants to need admin consent for Mail.Read anyway: since late 2025 the Microsoft-managed default consent policy (default for new tenants) excludes Mail.Read/ReadWrite/ReadBasic, Calendars.*, Chat.* and IMAP/EWS from user consent, even for verified publishers. Mail.Send alone remains user-consentable.", "difficulty": {"score": 3, "label": "Moderate", "rationale": "Microsoft runs no app-review queue for Graph mail scopes. The practical gate is publisher verification, which needs a verified Partner Center (AI Cloud Partner Program) account (business, domain, employment and identity checks, typically 3–5 business days). The other gate is tenant admin consent policies that you do not control. Since Oct–Nov 2025 (MC1163922) tenants on the Microsoft-managed consent policy require admin consent for delegated mailbox-read permissions regardless of publisher verification, so admin consent is the norm for read-mail agents."}, "timeline": {"first_token": {"estimate": "15–30 min", "note": "Entra admin center > App registrations > New registration, add a Web redirect URI and client secret, add delegated Mail.Read, Mail.Send and offline_access, then run the auth code flow against /common/oauth2/v2.0. Works immediately for your own tenant and personal Microsoft accounts."}, "production": {"estimate": "1–2 weeks (plus per-customer admin consent time, which can be days to months)", "active_effort": "0.5–2 days", "waiting": "Partner Center account verification typically takes 3–5 business days and can run longer if documents are requested. Linking the Partner ID to the app takes minutes.", "note": "Driven by AI Cloud Partner Program enrollment and verification (legal business docs, domain registrar documentation, employment check) and by each enterprise customer's consent policy. Many tenants require an admin to approve any third-party app."}}, "cost": "Free. App registration, publisher verification and the AI Cloud Partner Program basic membership have no fee. Microsoft 365 App Certification is optional and paid to an audit firm.", "paths": [{"name": "Single tenant (AzureADMyOrg)", "who_for": "Internal agents for your own organization", "review": "none. A tenant admin can grant consent directly.", "limits": "Only users in your directory can sign in."}, {"name": "Multitenant + personal accounts (AzureADandPersonalMicrosoftAccount)", "who_for": "Public agent products where both work/school Outlook and Outlook.com/Hotmail users connect", "review": "No Microsoft review. Publisher verification is strongly recommended, but it does not unlock user consent for Mail.Read in tenants on the Microsoft-managed default policy (admin consent required there).", "limits": "Unverified: risk-based step-up blocks user consent for non-basic scopes in tenants that allow user consent, so users see AADSTS90094 or an admin-request flow. Personal-account configs allow 100 redirect URIs, no wildcards and no query strings, and at most 2 client secrets."}, {"name": "Multitenant work/school only (AzureADMultipleOrgs)", "who_for": "B2B agents targeting Microsoft 365 business customers only", "review": "Same as above (publisher verification recommended).", "limits": "Up to 256 redirect URIs. Customer admin consent is often required by tenant policy."}], "prerequisites": [{"item": "A Microsoft Entra tenant with a work/school account (not a personal MSA)", "owner": "human", "note": "Apps registered with a personal Microsoft account cannot be publisher verified."}, {"item": "A custom domain verified in the tenant (DNS TXT) and set as the app's Publisher domain", "owner": "human", "note": "*.onmicrosoft.com is not accepted for publisher verification."}, {"item": "Microsoft AI Cloud Partner Program (Partner Center) account, fully verified, using the Partner Global Account (PGA) Partner One ID", "owner": "human", "note": "Needs a business email on the same domain, business registration documents, and domain registrar documentation."}, {"item": "Application Administrator or Cloud Application Administrator role in Entra; Partner Admin or Account Admin in Partner Center; MFA enabled", "owner": "human", "note": ""}, {"item": "Privacy statement and terms of service URLs, and an app logo", "owner": "agent", "note": "Shown on the consent prompt via Branding & properties."}], "steps": [{"phase": "Register", "title": "Create the app registration", "detail": "entra.microsoft.com > Entra ID > App registrations > New registration. Name: your product name. Supported account types: 'Accounts in any organizational directory and personal Microsoft accounts' for broad reach, or 'Accounts in any organizational directory' for B2B only. Redirect URI: platform 'Web', e.g. https://app.example.com/oauth/microsoft/callback. Click Register and copy the Application (client) ID and Directory (tenant) ID.", "owner": "human", "time": "5 min", "url": "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade"}, {"phase": "Configure", "title": "Add a credential", "detail": "Certificates & secrets > Client secrets > New client secret. Choose an expiry (the portal caps it at 24 months; the recommended default is 180 days). Copy the Value immediately because it is shown once. For production, prefer a certificate or federated credential and automate rotation before expiry.", "owner": "human", "time": "5 min", "url": "https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials"}, {"phase": "Configure", "title": "Add delegated Graph permissions", "detail": "API permissions > Add a permission > Microsoft Graph > Delegated permissions: openid, profile, email, offline_access, User.Read, Mail.Read (or Mail.ReadBasic / Mail.ReadWrite), and Mail.Send. Avoid Application permissions (Mail.Read app-only), which always need admin consent and grant access to every mailbox. Do not click 'Grant admin consent' unless you mean it for your own tenant.", "owner": "agent", "time": "5 min", "url": "https://learn.microsoft.com/en-us/graph/permissions-reference"}, {"phase": "Configure", "title": "Branding & properties", "detail": "Set Name, Logo, Home page URL, Terms of service URL, Privacy statement URL. Under Publisher domain, select 'Update domain' and pick your DNS-verified custom domain.", "owner": "both", "time": "10 min"}, {"phase": "Test", "title": "Run the auth code flow", "detail": "GET https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=...&response_type=code&redirect_uri=...&response_mode=query&scope=offline_access%20User.Read%20Mail.Read%20Mail.Send&state=...&code_challenge=...&code_challenge_method=S256. POST the code to https://login.microsoftonline.com/common/oauth2/v2.0/token with client_secret and code_verifier. Call GET https://graph.microsoft.com/v1.0/me/messages.", "owner": "agent", "time": "15 min", "url": "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow"}, {"phase": "Prepare", "title": "Enroll in the Microsoft AI Cloud Partner Program", "detail": "partner.microsoft.com > Join the AI Cloud Partner Program, signing in with an account in the same tenant as the app. Complete the email, identity, employment and business verification checks (Partner Center > Account settings > Verification summary). Upload incorporation documents and domain registrar documentation if asked.", "owner": "human", "time": "1 h", "wait": "3–5 business days typical; longer if more documents are requested", "url": "https://learn.microsoft.com/en-us/partner-center/verification-responses"}, {"phase": "Review", "title": "Mark the app publisher verified", "detail": "App registrations > your app > Branding & properties > 'Add Partner ID to verify publisher'. Enter the PartnerGlobal Partner One ID (from Partner Center > Account settings > Identifiers > Microsoft Cloud Partners Program) > Verify and save. Sign in with MFA. A blue verified badge appears next to Publisher display name within minutes.", "owner": "human", "time": "10 min", "url": "https://learn.microsoft.com/en-us/entra/identity-platform/mark-app-as-publisher-verified"}, {"phase": "Launch", "title": "Prepare the admin-consent path for enterprise customers", "detail": "Publish an admin-consent link: https://login.microsoftonline.com/{customer-tenant-id or organizations}/v2.0/adminconsent?client_id=...&scope=https://graph.microsoft.com/Mail.Read https://graph.microsoft.com/Mail.Send offline_access&redirect_uri=...&state=.... Write a short IT-admin doc listing each permission and why it is needed.", "owner": "agent", "time": "1 h", "url": "https://learn.microsoft.com/en-us/entra/identity-platform/v2-admin-consent"}, {"phase": "Launch", "title": "Optional: Microsoft 365 Publisher Attestation / Certification", "detail": "Partner Center > Microsoft 365 App Compliance. Publisher Attestation is a self-assessed questionnaire. Certification is an independent audit (annual) and helps with security-conscious enterprise admins. Neither is required to function.", "owner": "human", "time": "days to weeks", "wait": "Certification: 14-day document stage plus 60-day evidence review", "url": "https://learn.microsoft.com/en-us/microsoft-365-app-certification/docs/certification"}], "review": {"required": "never", "trigger": "No Microsoft app review exists for Graph delegated mail scopes. Effective gates: (1) publisher verification, needed to avoid risk-based step-up for multitenant apps and to qualify under 'verified publishers only' consent policies; (2) each customer tenant's user-consent policy and admin approval. (3) Since late 2025, the Microsoft-managed default consent policy requires admin consent for delegated mailbox/calendar/chat read permissions in tenants that use it.", "process": "Publisher verification is self-serve once your AI Cloud Partner Program account passes Microsoft's business verification. Per-tenant, admins grant consent through the admin consent endpoint, the Enterprise applications blade, or the admin consent request workflow.", "typical_wait": "Partner Center verification typically takes 3–5 business days (official). Linking the Partner ID takes minutes. Customer admin approval depends on the organization's IT process.", "reviewers_check": ["Partner Center: business email domain, legal business registration, domain registrar docs, employment, government ID", "Publisher domain matches the Partner Center primary contact email domain or a DNS-verified tenant domain", "Customer IT admins check permission breadth (delegated vs application), verified badge, privacy/terms URLs, and certification status"], "common_rejections": ["MPNGlobalAccountNotFound: used a location Partner ID instead of PartnerGlobal", "PublisherDomainMismatch: Partner Center email domain does not match the app's publisher domain", "MSANotSupported: app registered under a personal Microsoft account", "MPNAccountNotVetted: Partner Center verification still pending", "Customer admins decline apps requesting Mail.ReadWrite or application permissions when read-only delegated access would suffice"]}, "pre_approval_limits": ["Tenants on the Microsoft-managed user consent policy ('Let Microsoft manage your consent settings', default for new tenants): users cannot consent to Mail.Read/ReadWrite/ReadBasic, Calendars.*, Chat.* or EWS/IMAP/POP/EAS for third-party apps, verified or not (rollout Oct–Nov 2025, MC1163922). Existing consents keep working.", "Unverified multitenant app (registered after Nov 8, 2020) requesting non-basic scopes: user consent is stepped up to admin consent in tenants with user consent enabled (risk-based step-up is on by default), and users see AADSTS90094 or a 'request approval' prompt", "Tenants using microsoft-user-default-low allow user consent only for verified publishers' apps and low-impact permissions", "Tenants with user consent disabled require admin consent for every third-party app, verified or not", "Consent prompt shows 'unverified' publisher warning until verified"], "oauth": {"authorize_url": "https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize (tenant = common | organizations | consumers | tenant ID)", "token_url": "https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token", "pkce": "supported", "refresh_tokens": "Issued only when offline_access is requested. Default Max Inactive Time is 90 days (sliding: each use issues a new refresh token, so discard the old one). SPA-type redirect URIs get 24-hour refresh tokens. Revoked on password reset, admin revocation, or by Conditional Access/CAE events. Lifetimes are not configurable since Jan 30, 2021.", "access_token_lifetime": "Random 60–90 minutes (75 average). Can be up to about 24–28 hours with Continuous Access Evaluation-capable clients.", "redirect_uri_rules": "HTTPS required except localhost (http://localhost, where the port is ignored when matching). Exact, case-sensitive match. Maximum 256 characters per URI. Up to 256 URIs for org-only apps, 100 when personal accounts are included. Wildcards only for work/school-only apps via the manifest (not recommended). No query strings when personal accounts are supported. No special characters ! $ ' ( ) , ; and no IDNs. Platform type matters: Web vs SPA vs Mobile/desktop.", "scopes": "Delegated Graph scopes are requested as Mail.Read or https://graph.microsoft.com/Mail.Read. Mail.Send (delegated) is user-consentable. Mail.ReadBasic, Mail.Read and Mail.ReadWrite are flagged user-consentable in Graph, but the Microsoft-managed default consent policy (default for new tenants; updated Oct–Nov 2025) excludes them, plus Calendars.*, Chat.*, Contacts.ReadWrite and EWS/IMAP/POP/EAS, from user consent, so those need admin consent in such tenants. Application permissions (app-only) always need admin consent. Dynamic/incremental consent is supported. /.default requests all statically configured permissions.", "tenant_notes": "Use /common for mixed account types and /organizations for work/school only. After consent, a service principal (Enterprise application) is created in each customer tenant. Use the 'tid' claim to key tokens per tenant. Admin consent: /{tenant}/v2.0/adminconsent (do not use 'common'). Guest users need the resource tenant ID, not common."}, "gotchas": [{"title": "Unverified multitenant apps are stepped up to admin consent", "detail": "Risk-based step-up consent is on by default. For multitenant apps registered after Nov 2020 that are not publisher verified and request non-basic permissions (Mail.Read counts), user consent becomes an admin-consent requirement. Users hit AADSTS90094 unless the tenant has the admin consent workflow enabled.", "severity": "high", "evidence": ["e1", "e2"]}, {"title": "Many enterprise tenants disable user consent entirely", "detail": "Microsoft recommends allowing user consent only for verified publishers and low-impact permissions. Many tenants disable it outright. Your onboarding must include an admin-consent link and IT-facing docs even when you are verified.", "severity": "high", "evidence": ["e3", "e4"]}, {"title": "Publisher verification needs a verified Partner Center business account", "detail": "You need the PartnerGlobal (PGA) Partner One ID, an app registered in an Entra tenant linked to the PGA, a non-onmicrosoft publisher domain matching your Partner Center email domain, and MFA. Partner Center business verification usually takes 3–5 business days. Start it on day one.", "severity": "high", "evidence": ["e1", "e5", "e6"]}, {"title": "Client secrets expire (portal max 24 months)", "detail": "Secrets created in the portal cap at 24 months, and a forgotten expiry takes every customer connection down at once. Monitor expiry, keep two overlapping secrets, rotate, or use certificates. Org policies may cap lifetimes further.", "severity": "medium", "evidence": ["e7", "e8"]}, {"title": "offline_access is required for refresh tokens", "detail": "Without offline_access in the scope string, no refresh_token is returned and the agent loses access after about 75 minutes.", "severity": "medium", "evidence": ["e9"]}, {"title": "Refresh tokens die after 90 days of inactivity", "detail": "If an agent does not touch a user's connection for 90 days, the refresh token expires and the user must reconnect. Refresh periodically and always store the newest refresh token.", "severity": "medium", "evidence": ["e10", "e9"]}, {"title": "Personal-account support restricts configuration", "detail": "Including personal Microsoft accounts limits you to 100 redirect URIs, no wildcards or query strings, at most 2 client secrets, and 30 permissions per resource.", "severity": "low", "evidence": ["e11", "e12"]}, {"title": "Default consent policy now blocks user consent to Mail.Read", "detail": "Since an Oct–Nov 2025 rollout (MC1163922), tenants using the Microsoft-managed user consent policy (the default for new tenants) require admin consent for third-party apps requesting Mail.Read, Mail.ReadWrite, Mail.ReadBasic, Calendars.*, Chat.*, OnlineMeetings.*, Contacts.ReadWrite, People.Read and EWS/IMAP/POP/EAS, even from verified publishers. Mail.Send is not on the list. Earlier (mid-2025) the same policy excluded Files/Sites (MC1097272). Plan an admin-consent onboarding path (adminconsent link, admin consent workflow) for any read-mail agent.", "severity": "high", "evidence": ["e17", "e18", "e13"]}], "blockers": [{"symptom": "AADSTS90094: <app> needs permission to access resources in your organization that only an admin can grant.", "cause": "Tenant requires admin consent (user consent disabled, Microsoft-managed default policy excluding Mail.Read and other mailbox scopes, or risk-based step-up for an unverified publisher)", "fix": "Send the customer's admin the /{tenant}/v2.0/adminconsent link, or ask them to enable the admin consent request workflow. Publisher verification helps only for the step-up case."}, {"symptom": "AADSTS65001: The user or administrator has not consented to use the application", "cause": "Requested scope not yet consented (for example, a newly added Mail.Send)", "fix": "Re-run the authorization with the new scope (incremental consent), or have an admin re-consent."}, {"symptom": "AADSTS50011: The redirect URI ... does not match the redirect URIs configured for the application", "cause": "URI mismatch or wrong platform type", "fix": "Add the exact URI under Authentication > Web platform. Check case, trailing slash, and http vs https."}, {"symptom": "AADSTS7000215: Invalid client secret provided / AADSTS7000222: client secret keys are expired", "cause": "Wrong secret (you used the Secret ID instead of the Value) or an expired secret", "fix": "Create a new secret, deploy it, then delete the old one."}, {"symptom": "Consent screen shows 'unverified' next to the publisher", "cause": "Publisher verification not done", "fix": "Branding & properties > Add Partner ID to verify publisher."}, {"symptom": "MPNAccountNotFoundOrNoAccess / PublisherDomainMismatch when verifying", "cause": "Tenant not linked to the PGA, wrong role, or email domain mismatch", "fix": "Link the tenant in Partner Center, use the PartnerGlobal ID, and set the publisher domain to the domain of the Partner Center primary contact email."}], "agent_vs_human": {"agent_can": ["Choose minimal delegated scopes (Mail.ReadBasic vs Mail.Read vs Mail.ReadWrite)", "Generate the app manifest and redirect URIs", "Build the authorize, token and admin-consent URLs", "Implement PKCE, offline_access, token rotation and per-tenant storage", "Draft the privacy statement and terms", "Write IT-admin consent documentation", "Script publisher verification via Graph setVerifiedPublisher once a human has the Partner ID", "Monitor secret expiry"], "human_must": ["Sign in to Entra with MFA and an admin role", "Verify the custom domain via DNS", "Enroll in Partner Center and pass business, identity and employment verification", "Upload legal business and domain documents", "Click Verify and save for the Partner ID", "Contact customer IT admins for consent", "Optionally pay for Microsoft 365 Certification"]}, "evidence": [{"id": "e1", "claim": "Publisher verification requirements (PGA Partner One ID, publisher domain not onmicrosoft, MFA); free; minutes if prerequisites met; Nov 2020 consent change for unverified multitenant apps", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/publisher-verification-overview", "type": "official_docs", "status": "verified", "note": "Microsoft doesn't charge developers for publisher verification"}, {"id": "e2", "claim": "Risk-based step-up consent enabled by default; unverified multitenant nonbasic requests stepped up; AADSTS90094", "source": "https://learn.microsoft.com/entra/identity/enterprise-apps/configure-risk-based-step-up-consent", "type": "official_docs", "status": "verified", "note": "This step-up capability is enabled by default | Re-checked 2026-10-30; applies to newly registered unverified multitenant apps"}, {"id": "e3", "claim": "User consent policies: microsoft-user-default-low (verified publishers, low impact) vs legacy; Microsoft recommends verified-publisher-only", "source": "https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/configure-user-consent", "type": "official_docs", "status": "verified", "note": "allow user consent only for applications that have been published by a verified publisher"}, {"id": "e4", "claim": "Locked-down tenants can gate even delegated scopes behind admin approval", "source": "https://developer.nylas.com/docs/cookbook/use-cases/build/microsoft-oauth-scopes.md", "type": "community", "status": "reported", "note": "an administrator can still gate even delegated scopes"}, {"id": "e5", "claim": "Partner Center verification typically 3-5 business days; email/identity/employment/business checks", "source": "https://learn.microsoft.com/en-us/partner-center/verification-responses", "type": "official_docs", "status": "verified", "note": "In most cases, the process takes three to five business days"}, {"id": "e6", "claim": "Publisher verification error codes and fixes", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/troubleshoot-publisher-verification", "type": "official_docs", "status": "verified", "note": "MPNGlobalAccountNotFound, PublisherDomainMismatch, MSANotSupported"}, {"id": "e7", "claim": "Portal client secret expiry capped at 24 months; PowerShell can exceed; policies can restrict", "source": "https://o365reports.com/an-overview-of-client-secret-management-in-azure-ad/", "type": "community", "status": "reported", "note": "maximum of 24 months for the expiration of client secrets"}, {"id": "e8", "claim": "Microsoft recommends certificates over client secrets for production", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials", "type": "official_docs", "status": "verified", "note": "recommends that you use a certificate instead of a client secret"}, {"id": "e9", "claim": "Endpoints, tenant values, PKCE recommended for all and required for SPA; refresh token only with offline_access; discard old refresh token; SPA 24h", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow", "type": "official_docs", "status": "verified", "note": "Only provided if offline_access scope was requested"}, {"id": "e10", "claim": "Refresh token Max Inactive Time 90 days; not configurable since Jan 30 2021; access token 60-90 min", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/configurable-token-lifetimes", "type": "official_docs", "status": "verified", "note": "random value ranging between 60-90 minutes | Re-checked 2026-10-30"}, {"id": "e11", "claim": "Redirect URI limits: 256 vs 100 URIs, 256 chars, https except localhost, wildcards/query restrictions", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/reply-url", "type": "official_docs", "status": "verified", "note": "You can use a maximum of 256 characters for each redirect URI"}, {"id": "e12", "claim": "Supported account types and consumer limits (max two client secrets, 30 perms per resource)", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/supported-accounts-validation", "type": "official_docs", "status": "verified", "note": "Maximum of two client secrets for consumer-inclusive types"}, {"id": "e13", "claim": "Microsoft-managed policy requiring admin consent for third-party file/site access, rollout Jul-Aug 2025 (MC1097272)", "source": "https://office365itpros.com/2025/06/19/app-consent-policy-user-app-consent/", "type": "community", "status": "reported", "note": "require administrator consent for third-party apps that access files and sites"}, {"id": "e14", "claim": "Admin consent endpoint format; do not use common", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/v2-admin-consent", "type": "official_docs", "status": "verified", "note": "Do not use 'common'"}, {"id": "e15", "claim": "Microsoft 365 Certification is voluntary, annual, audited (14-day + 60-day stages)", "source": "https://learn.microsoft.com/en-us/microsoft-365-app-certification/docs/certification", "type": "official_docs", "status": "verified", "note": "Stage 2 Full Evidence Review: 60 day time frame"}, {"id": "e16", "claim": "Mark-as-verified portal steps (Branding & properties > Add Partner ID to verify publisher)", "source": "https://learn.microsoft.com/en-us/entra/identity-platform/mark-app-as-publisher-verified", "type": "official_docs", "status": "verified", "note": "Select Verify and save"}, {"id": "e17", "claim": "Microsoft-managed policy (microsoft-user-default-recommended, default for new tenants) lets users consent to delegated permissions EXCEPT Files/Sites .All, Mail.Read/ReadWrite/ReadBasic(+Shared), MailboxSettings, Calendars.*, Chat.*, OnlineMeetings.*, Contacts, Tasks, People.Read, EAS/EWS/IMAP/POP", "source": "https://learn.microsoft.com/en-gb/entra/identity/enterprise-apps/manage-app-consent-policies", "type": "official_docs", "status": "verified", "note": "\"End users can consent for any user consentable delegated permissions EXCEPT:\" (page updated 2026)"}, {"id": "e18", "claim": "MC1163922: admin approval required for third-party apps accessing Exchange/Teams content via delegated permissions in tenants on the Microsoft-managed policy; rollout end Oct to late Nov 2025; existing consents unaffected", "source": "https://mc.merill.net/message/MC1163922", "type": "community", "status": "verified", "note": "Mirror of Microsoft 365 Message Center post; corroborated by learn.microsoft.com e17 and m365admin.handsontek.net"}], "uncertain": ["Exact 'Admin consent required' flags for delegated Mail.Read/Mail.Send: the Graph permissions reference page was truncated when fetched; the 'No' (user-consentable) value is based on general knowledge plus a community source.", "The 24-month portal cap on client secrets comes from a community source; the official credentials page did not state it.", "The share of enterprise tenants that disable user consent is not published; 'many' is a qualitative judgement.", "Partner Center verification can exceed 5 business days when extra documentation is requested; I found no reliable community distribution of wait times.", "Share of customer tenants still on the Microsoft-managed default consent policy (vs custom or legacy policies) is not published; the excluded-permission list is auto-updated by Microsoft and may grow."], "last_checked": "2026-10-30", "probes": [{"what": "/common/oauth2/v2.0/authorize with all-zero GUID client_id, scope Mail.Read offline_access", "result": "AADSTS700038: <id> is not a valid application identifier", "outcome": "confirmed", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}], "aliases": ["Microsoft Outlook", "Microsoft Graph mail", "Outlook mail", "Office 365 mail"]}, "salesforce": {"slug": "salesforce", "name": "Salesforce (REST/SOAP APIs via External Client App)", "provider": "Salesforce", "website": "https://developer.salesforce.com", "category": "CRM", "composio_managed": true, "verdict": "Build a Packaged External Client App (not a Connected App) in a free Developer Edition org, ship it in a 2GP managed package, and have each customer's admin install it; plan for per-org admin friction, not a central Salesforce review.", "difficulty": {"score": 3, "label": "Moderate", "rationale": "No mandatory Salesforce review for OAuth, and a dev token takes under an hour. But since Spring '26 new Connected Apps are disabled by default, a Local External Client App only serves its own org, and since Sept 2025 uninstalled apps are blocked for most users. So multi-org production means 2GP packaging plus an admin install in every customer org. AppExchange security review is optional (roughly 3–9 weeks per attempt depending on queue)."}, "timeline": {"first_token": {"estimate": "30–60 min", "note": "Sign up for a Developer Edition org, create a Local External Client App, then wait up to ~10 min for it to become active before the first authorize call."}, "production": {"estimate": "1–2 weeks to a shippable package; then days–weeks per customer org; +4–8 weeks if you list on AppExchange", "active_effort": "1–3 days (Dev Hub, namespace, 2GP package, install docs for admins)", "waiting": "Mostly each customer admin's change-control process to install the package and assign access; optional AppExchange security review ~3–9 weeks per lap", "note": "Salesforce does not centrally approve OAuth clients. What gates production is (a) packaging the ECA so it can be installed cross-org, (b) customer admins installing it and granting Permitted Users/permission sets, and (c) customers being on an edition with API access."}}, "cost": "Free (Developer Edition org, ECA, 2GP packaging). Optional AppExchange security review: $999 per attempt for paid solutions (official, since March 2023; waived for free solutions). Customers need Enterprise/Performance/Unlimited/Developer edition, or Professional + paid API add-on.", "paths": [{"name": "Local External Client App (single org)", "who_for": "Your own org, internal tools, a single customer whose admin creates the ECA in their own org and gives you the keys.", "review": "none", "limits": "Only users of the org that created it can authorize; other orgs get 'Cross-org OAuth flows are not supported for this external client app'."}, {"name": "Packaged External Client App via 2GP managed package (multi-tenant)", "who_for": "SaaS / AI-agent products connecting many customer orgs with one consumer key.", "review": "No Salesforce review needed to share an install link; each customer admin must install and approve.", "limits": "Needs Dev Hub + registered namespace (two separate DE orgs). Customer admin controls Permitted Users, refresh token policy, IP relaxation, session timeout."}, {"name": "AppExchange listing", "who_for": "Vendors wanting discoverability and the trust signal; enterprise customers often require it.", "review": "AppExchange security review (static scan, dynamic test, manual review).", "limits": "Typically 3–9 weeks per submission; resubmissions re-queue; fee for paid solutions."}], "prerequisites": [{"item": "Salesforce Developer Edition org (free) at developer.salesforce.com/signup", "owner": "human", "note": "Needs a unique username in email format and email verification. Use a second DE org for the namespace if you will package."}, {"item": "User permission 'Create, edit, and delete External Client Apps' (System Administrator has it in DE)", "owner": "human", "note": "Needed to see New External Client App."}, {"item": "HTTPS callback URL on your backend (e.g. https://app.example.com/oauth/salesforce/callback)", "owner": "agent", "note": "Exact match against Callback URL field."}, {"item": "Salesforce CLI (sf) installed for packaging", "owner": "agent", "note": "sf --version; used for Dev Hub login, package create/version/promote."}, {"item": "Customer orgs on Enterprise, Performance, Unlimited or Developer edition (or Professional + API add-on), users with 'API Enabled'", "owner": "human", "note": "Confirm during sales/onboarding; otherwise calls fail with API_DISABLED_FOR_ORG."}], "steps": [{"phase": "Prepare", "title": "Create a Developer Edition org", "detail": "Sign up at developer.salesforce.com/signup, verify email, set password. Note your My Domain URL (https://<name>.develop.my.salesforce.com). If you will distribute, create a second DE org now for namespace registration.", "owner": "human", "time": "10 min", "url": "https://developer.salesforce.com/signup"}, {"phase": "Register", "title": "Create an External Client App (not a Connected App)", "detail": "Setup > Quick Find 'App Manager' (or 'External Client App Manager') > New External Client App. Basic Information: External Client App Name, API Name, Contact Email, Distribution State = Local (for dev) or Packaged (for distribution; do this in the Dev Hub org). Do not try 'New Connected App' — creation is disabled by default since Spring '26 and needs a Support case.", "owner": "human", "time": "10 min", "url": "https://trailhead.salesforce.com/content/learn/projects/build-integrations-with-external-client-apps/create-and-configure-an-external-client-app"}, {"phase": "Configure", "title": "Enable OAuth and select scopes", "detail": "Expand API (Enable OAuth Settings) > check Enable OAuth. Callback URL: your exact HTTPS callback (one per line). Selected OAuth Scopes: 'Manage user data via APIs (api)', 'Perform requests at any time (refresh_token, offline_access)', 'Access unique user identifiers (openid)'. Flow Enablement: Enable Authorization Code and Credentials Flow. Security: keep 'Require Proof Key for Code Exchange (PKCE)', 'Require Secret for Web Server Flow', 'Require Secret for Refresh Token Flow' unless you have a reason. Create.", "owner": "both", "time": "10 min"}, {"phase": "Configure", "title": "Copy Consumer Key and Secret", "detail": "Open the app > Settings tab > OAuth Settings > Consumer Key and Secret. Salesforce emails a verification code before revealing them. Store in your secret manager (consumer key = client_id, consumer secret = client_secret).", "owner": "human", "time": "5 min"}, {"phase": "Configure", "title": "Set OAuth policies in your org", "detail": "App > Policies tab > Edit. OAuth Policies: Permitted Users (All users may self-authorize vs Admin approved users are pre-authorized), Refresh Token Policy = 'Refresh token is valid until revoked' for agents, IP Relaxation. Note: in customer orgs their admin sets these, not you.", "owner": "human", "time": "5 min"}, {"phase": "Test", "title": "Wait for propagation, then run the web server flow with PKCE", "detail": "Wait up to ~10 minutes after creating/editing. Redirect user to https://login.salesforce.com/services/oauth2/authorize?response_type=code&client_id=...&redirect_uri=...&scope=api%20refresh_token%20openid&code_challenge=...&code_challenge_method=S256&state=... Exchange at /services/oauth2/token with code_verifier + client_secret. Persist instance_url and id from the response; call APIs at {instance_url}/services/data/vXX.X/.", "owner": "agent", "time": "15 min", "wait": "Up to ~10 min propagation"}, {"phase": "Launch", "title": "Set up Dev Hub and namespace for packaging", "detail": "Org A: Setup > Dev Hub > Enable Dev Hub (irreversible). Org B: Setup > Package Manager > Register Namespace. In Org A App Launcher > Namespace Registries > Link Namespace and log into Org B. A single org cannot be both Dev Hub and namespace org.", "owner": "human", "time": "30 min"}, {"phase": "Launch", "title": "Create a Packaged ECA and 2GP managed package", "detail": "In the Dev Hub create the ECA with Distribution State = Packaged (same OAuth config). Then: sf org login web --set-default-dev-hub; sf project generate; sf package create --package-type Managed --path force-app; retrieve ExternalClientApplication, ExtlClntAppOauthSettings (and ExtlClntAppOauthConfigurablePolicies) via package.xml; set namespace in sfdx-project.json; sf package version create --installation-key-bypass --code-coverage --wait 20. Global OAuth settings (consumer secret) are not packaged.", "owner": "agent", "time": "2–4 h", "url": "https://nango.dev/docs/api-integrations/salesforce/salesforce-api-oauth-app-setup.md"}, {"phase": "Launch", "title": "Promote the package version and publish install instructions", "detail": "Promote the version (sf package version promote) so it installs in production orgs (beta versions install only in sandboxes/scratch/DE). Write an admin guide: install URL, 'Install for Admins Only' vs specific profiles, then Setup > External Client App Manager > your app > Policies: Permitted Users, assign permission set/profile, Refresh Token Policy 'valid until revoked'.", "owner": "both", "time": "2 h"}, {"phase": "Launch", "title": "Customer admin installs and grants access", "detail": "Each customer admin opens the install link (login.salesforce.com for prod, test.salesforce.com for sandbox), installs, then grants users access. Only then can their users complete your OAuth flow.", "owner": "human", "time": "15–30 min per org", "wait": "Customer change-control: days to weeks"}, {"phase": "Review", "title": "Optional: AppExchange security review", "detail": "Partner Community > Publishing Console > create listing > submit for security review with scanner reports (Code Analyzer), test org credentials, and docs for your external endpoints.", "owner": "both", "time": "2–5 days prep", "wait": "~3–9 weeks per lap; resubmissions re-queue"}], "review": {"required": "conditional", "trigger": "Only if you list on AppExchange. No review is required to create an ECA or to distribute a managed package by install link; instead every customer org's admin must install/approve the app.", "process": "AppExchange: submit package + listing in the Partner Console; Salesforce Product Security runs static analysis, dynamic testing and manual review including your external web app/API endpoints.", "typical_wait": "~3–9 weeks per submission (ISVforce guide: ~3–4 weeks to initial report; Salesforce's 2023 blog cited a 6–9 week queue); failures add another full lap.", "reviewers_check": ["CRUD/FLS enforcement in Apex", "SOQL injection", "XSS / unescaped output", "CSRF", "Secure storage of OAuth tokens and secrets on your servers", "Scan reports for external endpoints", "Working test credentials"], "common_rejections": ["Missing CRUD/FLS checks", "Dynamic SOQL from user input", "Stale/unexplained scanner reports", "Reviewer cannot log into the test org", "Apex classes without sharing declarations"]}, "pre_approval_limits": ["Local ECA works only for users in the org where it was created (cross-org flows rejected).", "Uninstalled apps: since Sept 2025 only users with 'Approve Uninstalled Connected Apps' (or 'Use Any API Client' when API Access Control is on) can authorize an app not installed in their org.", "Developer Edition: 5 MB data storage and low API daily limits; fine for testing only.", "Beta (unpromoted) 2GP versions cannot be installed in customer production orgs."], "oauth": {"authorize_url": "https://login.salesforce.com/services/oauth2/authorize (sandbox: https://test.salesforce.com/...; or the org's My Domain https://<domain>.my.salesforce.com/services/oauth2/authorize)", "token_url": "https://login.salesforce.com/services/oauth2/token (sandbox: test.salesforce.com; or My Domain). Revoke: /services/oauth2/revoke", "pkce": "supported", "refresh_tokens": "Issued when refresh_token (offline_access) scope is granted. Lifetime is governed by the Refresh Token Policy set by the admin of each org (valid until revoked [default], expire after X, expire if unused for X, immediately expire). Optional refresh token rotation setting on the ECA.", "access_token_lifetime": "Not a fixed TTL: tied to the org's session timeout (commonly 2 h; admins can change per org/profile). Treat 401 INVALID_SESSION_ID as 'refresh now'.", "redirect_uri_rules": "Must match a Callback URL registered on the app exactly; HTTPS required for web apps (http://localhost is accepted for local dev in practice). Multiple callback URLs allowed, one per line.", "scopes": "Coarse scopes: api, refresh_token/offline_access, openid, id/profile/email, web, full, plus feature scopes (chatter_api, cdp_*, sfap_api, einstein_gpt_api…). Real data access is governed by the user's profile/permission sets (object/field security), not by scope.", "tenant_notes": "Every customer org has its own instance_url — always store instance_url from the token response and call APIs there. Production users log in via login.salesforce.com, sandbox users via test.salesforce.com; orgs with enforced My Domain login may require their My Domain host. Ask the user for environment (prod/sandbox/custom domain) before redirecting."}, "gotchas": [{"title": "New Connected Apps are disabled by default — use External Client Apps", "detail": "Since Spring '26 'New Connected App' is disabled by default in all orgs (UI and API); re-enabling requires a Salesforce Support case and Salesforce says even that exception is temporary. Existing Connected Apps keep working. Salesforce's own docs tie the change to Spring '26 (Help: \"New connected apps can no longer be created in Spring '26\").", "severity": "high", "evidence": ["e1", "e2", "e3"]}, {"title": "A Local ECA cannot authorize users from other orgs", "detail": "ECAs only connect users in the org that created them unless installed in the target org. Error: 'Cross-org OAuth flows are not supported for this external client app'. For multi-tenant SaaS you must package (2GP managed) and have customers install.", "severity": "high", "evidence": ["e4", "e5"]}, {"title": "Uninstalled apps blocked for most users since Sept 2025", "detail": "Users now need 'Approve Uninstalled Connected Apps' (or 'Use Any API Client' if API Access Control is enabled) to authorize an app not installed in their org. Symptom: OAUTH_APPROVAL_ERROR_GENERIC / error=invalid_client&error_description=app+must+be+installed+into+org. Fix: have the admin install the app (Setup > Connected Apps OAuth Usage > Install, or install your package).", "severity": "high", "evidence": ["e6", "e7", "e8"]}, {"title": "Up to ~10 minutes before a new/edited app works", "detail": "Freshly created apps commonly fail with invalid_client_id / redirect mismatch for several minutes. Wait before debugging.", "severity": "medium", "evidence": ["e9"]}, {"title": "Customer edition must include API access", "detail": "Enterprise, Performance, Unlimited and Developer include API access; Professional only via paid add-on. Users also need the 'API Enabled' permission. Qualify customers before onboarding.", "severity": "high", "evidence": ["e10"]}, {"title": "Refresh token lifetime is the customer admin's decision", "detail": "Each org's admin sets the Refresh Token Policy for your installed app; if they choose 'expire if not used for X' or 'immediately expire', your agent will lose access. Document the recommended 'valid until revoked' setting in your install guide.", "severity": "medium", "evidence": ["e11", "e12"]}, {"title": "PKCE and secret requirements are on by default", "detail": "New ECAs default to Require PKCE + Require Secret for Web Server and Refresh Token flows. Omitting code_challenge gives 'missing required code challenge'; public clients failing refresh usually need 'Require Secret for Refresh Token Flow' turned off.", "severity": "medium", "evidence": ["e9", "e13"]}, {"title": "Migrating a Connected App to an ECA issues new credentials", "detail": "The migration tool generates a new Consumer Key/Secret; old ones stop working and every existing user must re-authorize. Migration is one-way.", "severity": "medium", "evidence": ["e9", "e3"]}, {"title": "Packaging needs two DE orgs and is irreversible", "detail": "Enabling Dev Hub is permanent; the namespace must be registered in a different org and linked. ECAs support 2GP only (no 1GP).", "severity": "low", "evidence": ["e13", "e5"]}], "blockers": [{"symptom": "'New Connected App' button missing or creation blocked", "cause": "Connected App creation disabled by default (Spring '26).", "fix": "Create an External Client App instead; only if you truly need a Connected App, open a Salesforce Support case."}, {"symptom": "Cross-org OAuth flows are not supported for this external client app", "cause": "ECA is Local or not installed in the user's org.", "fix": "Package the ECA (Distribution State = Packaged, 2GP managed) and have the customer admin install it."}, {"symptom": "OAUTH_APPROVAL_ERROR_GENERIC or error_description=app must be installed into org", "cause": "Uninstalled-app restriction (Sept 2025).", "fix": "Customer admin installs the app/package, or grants 'Approve Uninstalled Connected Apps' to the authorizing user (or 'Use Any API Client' if API Access Control is on)."}, {"symptom": "invalid_client_id or redirect_uri_mismatch right after creating the app", "cause": "Propagation delay or callback mismatch.", "fix": "Wait ~10 min; compare redirect_uri byte-for-byte with Callback URL."}, {"symptom": "API_DISABLED_FOR_ORG / API is not enabled for this Organization or Partner", "cause": "Customer on Professional/Essentials without API add-on, or user lacks API Enabled.", "fix": "Customer buys API add-on/upgrades edition; admin enables 'API Enabled' on the profile/permission set."}, {"symptom": "invalid_grant: expired access/refresh token", "cause": "Org's Refresh Token Policy expired the token, user revoked, or admin changed policy.", "fix": "Ask the admin to set 'Refresh token is valid until revoked'; prompt user to reconnect."}, {"symptom": "invalid_grant: authentication failure on sandbox user", "cause": "Sandbox user sent to login.salesforce.com.", "fix": "Use test.salesforce.com or the org's My Domain for sandbox."}], "agent_vs_human": {"agent_can": ["Generate ECA metadata (ExternalClientApplication, ExtlClntAppOauthSettings) and package.xml", "Run sf CLI packaging commands once the human has logged in", "Implement PKCE web server flow, instance_url storage and refresh handling", "Draft customer-admin install guide (Permitted Users, refresh token policy, permission set)", "Draft AppExchange security review docs and run Code Analyzer", "Verify callback URL exact match"], "human_must": ["Sign up for DE orgs and verify email", "Create the ECA in Setup (or approve CLI deploy) and reveal the consumer secret via email code", "Enable Dev Hub and register/link namespace", "Accept Salesforce Partner/AppExchange terms and pay review fee", "Customer admins: install package and grant access"]}, "evidence": [{"id": "e1", "claim": "Creating connected apps is disabled by default; Support must enable it per org", "source": "https://developer.salesforce.com/docs/platform/sfdx-dev/guide/sfdx-dev-auth-connected-app.html", "type": "official_docs", "status": "verified", "note": "\"Creating connected apps is now disabled by default\"; links 'can no longer be created in Spring '26'"}, {"id": "e2", "claim": "Spring '26 disabled Connected App creation in UI and API; Support exception will be removed later", "source": "https://striim.com/docs/en/salesforce-connected-apps-and-external-client-apps.html", "type": "community", "status": "verified", "note": "Vendor doc summarizing Salesforce announcement | Confirmed by Salesforce sfdx dev guide (e1): \"Creating connected apps is now disabled by default\""}, {"id": "e3", "claim": "ECA migration issues new consumer key/secret; existing connected apps keep working", "source": "https://dev.to/dipojjal/connected-apps-are-going-away-heres-whats-next-fef", "type": "community", "status": "reported", "note": "Migrated ECA gets a new Consumer Key and Secret"}, {"id": "e4", "claim": "ECA only connects users in creating org; error 'Cross-org OAuth flows are not supported'", "source": "https://unified.to/blog/salesforce_external_client_apps_on_multiple_organizations", "type": "community", "status": "reported", "note": "Apr 2026; recommends packaging and admin install"}, {"id": "e5", "claim": "ECAs built for 2GP only; local apps stay in original org", "source": "https://salesforcegeek.in/external-client-vs-connected-apps/", "type": "community", "status": "reported", "note": "\"Built for 2GP packaging from the start\""}, {"id": "e6", "claim": "Early Sept 2025: most users lose access to uninstalled connected apps; Approve Uninstalled Connected Apps (Summer '25) or Use Any API Client permits it; prior authorizations generally keep working except device flow", "source": "https://admin.salesforce.com/blog/2025/get-ready-for-changes-to-connected-app-usage-restrictions", "type": "official_docs", "status": "verified", "note": "Salesforce Admins blog; secondary: soliantconsulting.com Sept 2025 post"}, {"id": "e7", "claim": "Error strings OAUTH_APPROVAL_ERROR_GENERIC and app must be installed into org", "source": "https://docs.movedata.io/troubleshooting/connection-and-authentication/salesforce-connected-app-usage-restrictions/", "type": "community", "status": "reported", "note": "error_description=app+must+be+installed+into+org"}, {"id": "e8", "claim": "Use Any API Client needed when API Access Control enabled; rollout Aug 28/Sep 2 2025; install via Connected Apps OAuth Usage", "source": "https://www.xappex.com/blog/oauth-approval-error-generic-salesforce/", "type": "community", "status": "reported", "note": "Enforcement reached existing orgs Sept 2, 2025"}, {"id": "e9", "claim": "Up to 10 minutes for new app to become active; PKCE default; migration invalidates creds", "source": "https://developers.apideck.com/apis/crm/salesforce/configuration", "type": "community", "status": "reported", "note": "\"It can take up to 10 minutes for the new app to become active.\""}, {"id": "e10", "claim": "API included in Enterprise, Performance, Unlimited, Developer; Professional via add-on; API Enabled required", "source": "https://developer.salesforce.com/docs/platform/api-rest/guide/intro-rest-compatible-editions.html", "type": "official_docs", "status": "verified", "note": "\"Professional Edition orgs can add API access as an add-on.\""}, {"id": "e11", "claim": "Refresh token policy options set by admin under Manage App Policies", "source": "https://www.jotform.com/help/understanding-refresh-tokens-in-salesforce/", "type": "community", "status": "reported", "note": "valid until revoked (default) / immediately expire / expire if unused / expire after"}, {"id": "e12", "claim": "Subscribers can only Edit Policies; owners can Edit Settings", "source": "https://trailhead.salesforce.com/content/learn/projects/build-integrations-with-external-client-apps/create-and-configure-an-external-client-app", "type": "official_docs", "status": "verified", "note": "Owner vs subscriber edit rights on ECA"}, {"id": "e13", "claim": "ECA creation steps, PKCE/secret defaults, Dev Hub + namespace packaging steps", "source": "https://nango.dev/docs/api-integrations/salesforce/salesforce-api-oauth-app-setup.md", "type": "community", "status": "reported", "note": "Enable Dev Hub is irreversible; separate namespace org"}, {"id": "e14", "claim": "OAuth endpoints; use test.salesforce.com for sandboxes", "source": "https://developer.salesforce.com/docs/atlas.en-us.222.0.api_rest.meta/api/intro_understanding_oauth_endpoints.htm", "type": "official_docs", "status": "verified", "note": "Older doc version; endpoints unchanged"}, {"id": "e15", "claim": "Developer Edition free, 5 MB data storage", "source": "https://developer.salesforce.com/docs/atlas.en-us.264.0.api_rest.meta/api_rest/quickstart_dev_org.htm", "type": "official_docs", "status": "verified", "note": "\"a free and easy solution\""}, {"id": "e16", "claim": "Security review fee $999 per attempt for paid apps (since Mar 16 2023, no annual fee); queue cited as 6-9 weeks in 2023; ISVforce guide says ~3-4 weeks to initial report", "source": "https://developer.salesforce.com/blogs/2023/04/prepare-your-app-to-pass-the-appexchange-security-review", "type": "official_docs", "status": "verified", "note": "\"The security review fee is $999 per attempt for paid apps\"; tekunda.com reports 4-5 weeks"}, {"id": "e17", "claim": "Session-timeout-based access token lifetime (~2h default)", "source": "https://developer.salesforce.com/docs/atlas.en-us.222.0.api_rest.meta/api/intro_understanding_oauth_endpoints.htm", "type": "inferred", "status": "uncertain", "note": "Not stated on fetched pages; based on general Salesforce behaviour"}], "uncertain": ["Official Salesforce Help wording on Local vs Packaged ECA cross-org behaviour was not fetched; the cross-org restriction comes from community sources (Unified.to, Nango).", "Whether the Sept 2025 uninstalled-app restriction applies to ECAs identically (moot in practice since ECAs must be installed cross-org).", "Access token lifetime: depends on org session settings; no single official number captured.", "Current AppExchange security review fee for free listings and exact queue times (fee page not fetched for 2026).", "Whether beta 2GP versions are blocked from production installs is from general packaging knowledge, not re-verified this session."], "last_checked": "2026-10-30", "probes": [{"what": "login.salesforce.com authorize with fake client_id", "result": "error=invalid_client_id&error_description=client identifier invalid (also what you see during the ~10 min propagation window after creating an app)", "outcome": "confirmed", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}], "aliases": ["Sales Cloud"]}, "shopify": {"slug": "shopify", "name": "Shopify (Admin GraphQL API)", "provider": "Shopify", "website": "https://shopify.dev", "category": "E-commerce", "composio_managed": false, "verdict": "Create the app in the Dev Dashboard (dev.shopify.com) and pick distribution carefully because it can't be changed. Custom distribution reaches one store or one Plus org with no review, same day. Letting arbitrary merchants connect needs public distribution and App Store review, which has been running 2–6+ weeks in 2026, plus a separate protected-customer-data approval if your agent reads customer names, emails, phones or addresses.", "difficulty": {"score": 4, "label": "Hard", "rationale": "Development and custom distribution are self-serve. The App Store path is predictable but heavy. You need a merchant-facing UI in the admin, three mandatory compliance webhooks, expiring offline tokens, Shopify Billing if you charge, and a screencast plus test credentials. Level 2 protected customer data review adds security controls. Review queues have been backlogged through 2026, with community reports of 2–5 weeks before first contact."}, "timeline": {"first_token": {"estimate": "30–60 min", "note": "Sign up for a free Partner account, create an app in the Dev Dashboard (or with `shopify app init`), create a dev store, install the app and run the auth code grant. Protected customer fields work on dev stores once you select them in API access requests, with no review."}, "production": {"estimate": "Custom distribution: same day. Public/App Store: 3–8+ weeks", "active_effort": "Custom: 1–2 h. Public: 1–3 weeks (embedded UI, compliance webhooks, billing, listing assets, screencast, PCD data-protection answers)", "waiting": "App Store review: officially 'up to 2 weeks', but community reports in 2026 run 2–5+ weeks, and each fix-and-resubmit can add more. Protected customer data review is part of the same submission.", "note": "The wait is driven by the App Review queue (backlogged since early 2026 per Shopify staff), resubmission cycles (resubmitting sends you to the back of the queue), and Level 2 PCD justification."}}, "cost": "Free to build and to list. Charging merchants through an App Store app must go through Shopify App Pricing or the Billing API, and Shopify takes a revenue share (not verified here).", "paths": [{"name": "Custom distribution", "who_for": "One specific merchant (an agency client, or your own store) or multiple stores in a single Shopify Plus organization", "review": "none", "limi
