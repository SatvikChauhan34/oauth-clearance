grace period. Persist atomically and serialize refreshes per connection. An unused refresh token expires after 60 days, meaning re-authorisation.", "owner": "agent", "time": "1–2 h", "url": "https://devblog.xero.com/xero-api-token-management-best-practices-and-troubleshooting-01853f4244a9"}, {"phase": "Launch", "title": "Upgrade to Core before the 6th connection", "detail": "Developer Portal > your app or org billing > add a credit card (the only accepted method). Without it, the 6th org can't connect. Monitor connection count and egress in the dashboard. Disconnect inactive tenants (Owner role only) to stay under caps.", "owner": "human", "time": "10 min", "url": "https://developer.xero.com/faq/pricing-and-policy-updates"}, {"phase": "Review", "title": "Prepare for App Certification (to exceed 50 connections)", "detail": "Meet the certification checkpoints: 1 Connection (use Sign Up / Sign In with Xero), 2 Branding and naming, 3 App Launcher, 4 Scopes (minimum), 5 Error handling (429/401/validation), 6 Data integrity, 7 Account and payment mapping, 8 Taxes. Onboard beta customers. Write support docs.", "owner": "both", "time": "1–3 weeks", "url": "https://developer.xero.com/documentation/xero-app-store/app-partner-guides/certification-checkpoints"}, {"phase": "Review", "title": "Apply for certification and a higher tier", "detail": "Complete the certification application form from the Developer Portal (My Apps). Xero reviews the integration. After you pass, apply for the Plus tier in the portal and optionally create a Xero App Store listing. For Advanced, complete the security assessment.", "owner": "human", "time": "1–2 h", "wait": "No published SLA. Integrators report several months end to end.", "url": "https://developer.xero.com/documentation/xero-app-store/app-partner-guides/building-and-growing-your-app"}], "review": {"required": "conditional", "trigger": "More than 50 connected organisations (Plus tier and above) needs App Certification. More than 1,000 (Advanced) also needs an initial and annual security assessment. Journals/XPM/Bulk Connections need use-case approval. A Xero App Store listing requires certification.", "process": "Build to the certification checkpoints, onboard beta customers, then submit the certification application. Xero reviews the integration (connection flow, branding, scopes, error handling, data mapping), then you list on the App Store (optional below Enterprise) and select a tier in the Developer Portal. Contact: api@xero.com.", "typical_wait": "Not published. Codat: 'It can take several months to become a Xero App Partner.'", "reviewers_check": ["Connection UX uses Sign Up / Sign In with Xero and the official Connect to Xero button", "Branding and naming comply with Xero guidelines (no 'Xero' in app name misuse)", "App Launcher integration", "Minimum necessary scopes", "Graceful error handling (rate limits, expired tokens, validation errors)", "Data integrity (no duplicate or erroneous writes)", "Correct account, payment and tax mapping for writes"], "common_rejections": ["Not enough real customers or beta users using the integration (reported)", "Requesting broader scopes than features need", "Non-compliant branding or connect button", "Weak handling of tax and account mapping on transaction writes"]}, "pre_approval_limits": ["Starter tier: max 5 connected organisations; 1,000 API calls/day per org, 60/min, 5 concurrent", "Core tier (no certification, card required): max 50 connections, 10 GB egress/month then AUD 2.40/GB, 5,000 calls/day/org", "Starter/Core apps can't be listed on the Xero App Store", "Journals endpoint, Practice Manager API and Bulk Connections unavailable below Advanced (needs security assessment and use-case approval)", "The old 25-uncertified-connection limit is superseded by tier caps from 2 Mar 2026"], "oauth": {"authorize_url": "https://login.xero.com/identity/connect/authorize", "token_url": "https://identity.xero.com/connect/token", "pkce": "supported", "refresh_tokens": "Only issued if offline_access is in scope. They rotate on every use; the previous token stays usable for a 30-min grace period. They expire after 60 days unused. invalid_grant means re-authorise.", "access_token_lifetime": "30 minutes (id_token 5 min, auth code 5 min single-use)", "redirect_uri_rules": "Absolute URIs, exact match. HTTPS required except http://localhost (127.0.0.1 not accepted, per community report). Multiple URIs per app (community reports up to 50).", "scopes": "Space-separated and additive. Apps created on or after 2 Mar 2026 must use granular accounting scopes (invoices, payments, banktransactions, manualjournals, classicexpenses, plus per-report read scopes). Pre-2 Mar 2026 apps can mix broad and granular until Sept 2027 (devblog: 13 Sep 2027), and moving to granular needs every user to re-consent. Missing scope gives 401 with WWW-Authenticate: insufficient_scope. Finance, bank feeds and payroll APIs carry extra restrictions.", "tenant_notes": "One token can access multiple orgs. List them with GET https://api.xero.com/connections, filter by authEventId, and send the Xero-tenant-id header on every call. A connection is one org linked to your app and counts toward the tier cap. Remove with DELETE /connections/{id}. A wrong-but-authorised tenant ID silently returns another org's data."}, "gotchas": [{"title": "Connection caps are now tiered: 5 free, 50 paid without certification", "detail": "From 2 Mar 2026 the free Starter tier allows 5 connected orgs. You need a card for Core (50), and Plus (1,000) needs App Certification. Plan certification early because it can take months.", "severity": "high", "evidence": ["e1", "e2", "e7"]}, {"title": "AI training on Xero data is prohibited", "detail": "The Developer Terms prohibit using data obtained through Xero APIs to train or contribute to AI/ML models. Agent builders must ensure Xero data isn't used for model training or fine-tuning.", "severity": "high", "evidence": ["e2"]}, {"title": "New apps can't use broad scopes", "detail": "Apps created on or after 2 Mar 2026 must request granular scopes. Code samples using accounting.transactions or accounting.reports.read fail for new apps.", "severity": "high", "evidence": ["e3", "e4"]}, {"title": "Rotating refresh tokens break with concurrent workers", "detail": "Each refresh invalidates the prior token after 30 min. Parallel refreshes or failing to persist the new token cause invalid_grant, which needs full re-auth.", "severity": "high", "evidence": ["e5", "e6"]}, {"title": "/connections returns all historical tenants", "detail": "It isn't scoped to the current auth flow. Use the authEventId claim, or users end up connected to the wrong org.", "severity": "medium", "evidence": ["e8"]}, {"title": "Egress-based billing", "detail": "Core and above meter data pulled from Xero (10 GB included on Core). Agents doing full syncs can incur overage at AUD 2.40/GB.", "severity": "medium", "evidence": ["e1"]}, {"title": "Starter rate limit is low", "detail": "1,000 calls/day per org on Starter versus 5,000 on Core+. Agent loops can exhaust it quickly (429).", "severity": "medium", "evidence": ["e1", "e2"]}, {"title": "Forgetting offline_access", "detail": "No refresh token is issued, so the agent loses access after 30 min.", "severity": "medium", "evidence": ["e8"]}, {"title": "Custom Connections cost the customer money", "detail": "These are per-connection monthly fees paid by the subscriber org, in AU/NZ/UK/US only. They suit one-org installs, not multi-tenant SaaS.", "severity": "low", "evidence": ["e9"]}], "blockers": [{"symptom": "6th organisation can't connect", "cause": "Starter tier cap of 5 connections", "fix": "Add payment details in the Developer Portal to move to Core (50)"}, {"symptom": "51st organisation can't connect", "cause": "Core tier cap; Plus needs App Certification", "fix": "Complete certification checkpoints and apply; disconnect inactive orgs meanwhile"}, {"symptom": "invalid_scope or unauthorized_client when requesting accounting.transactions", "cause": "App created on or after 2 Mar 2026 can only use granular scopes", "fix": "Request accounting.invoices / payments / banktransactions etc."}, {"symptom": "invalid_grant on refresh", "cause": "Stale or rotated refresh token, 60-day inactivity, user revoked, or race between workers", "fix": "Persist the latest token atomically with a per-connection lock; after one retry, mark the connection for re-auth"}, {"symptom": "403 AuthenticationUnsuccessful", "cause": "Missing or unauthorised Xero-tenant-id header", "fix": "Call /connections and use the right tenantId"}, {"symptom": "429 Too Many Requests", "cause": "Per-org daily/minute limits (60/min, 1,000 or 5,000/day)", "fix": "Honor Retry-After, batch, use If-Modified-Since; upgrade tier"}], "agent_vs_human": {"agent_can": ["pick the minimum granular scopes", "generate authorize URLs and token/refresh code with locking", "implement /connections tenant selection with authEventId", "build rate-limit and egress-aware sync", "draft certification checkpoint evidence and support docs", "draft App Store listing copy"], "human_must": ["create a Xero account and sign in with MFA", "accept the Developer Terms", "create the app and copy the client secret", "add a credit card for Core+", "recruit beta customers", "submit the certification application and attend review calls", "complete the security assessment (Advanced+)"]}, "evidence": [{"id": "e1", "claim": "Tier table: Starter 5 / Core 50 / Plus 1,000 / Advanced 10,000; fees AUD 0/35/245/1,445; Plus needs certification; Advanced needs security assessment", "source": "https://developer.xero.com/pricing", "type": "official_docs", "status": "verified", "note": "Core prerequisites: None. Effective 2 March 2026. | Re-checked 2026-10-30; fees tax-exclusive; effective 2 Mar 2026"}, {"id": "e2", "claim": "Developer Terms prohibit using API data to train AI/ML; Starter rate limits; card before 6th connection", "source": "https://developer.xero.com/faq/pricing-and-policy-updates", "type": "official_docs", "status": "verified", "note": "prohibit the use of data obtained through Xero's APIs to train"}, {"id": "e3", "claim": "Apps created on/after 2 Mar 2026 must use granular scopes; existing apps until 13 Sep 2027", "source": "https://devblog.xero.com/upcoming-changes-to-xero-accounting-api-scopes-705c5a9621a0", "type": "official_docs", "status": "verified", "note": "effective March 2 for newly created apps | Existing apps migrate by 13 Sep 2027 (re-checked)"}, {"id": "e4", "claim": "Deprecated broad scopes accounting.transactions and accounting.reports.read; users must re-authorise", "source": "https://apideck.com/blog/xero-scopes", "type": "community", "status": "reported", "note": "Consistent with Xero devblog"}, {"id": "e5", "claim": "Access token 30 min, refresh token 60 days, 30-min grace period", "source": "https://devblog.xero.com/xero-api-token-management-best-practices-and-troubleshooting-01853f4244a9", "type": "official_docs", "status": "verified", "note": "Access tokens expire after 30 minutes."}, {"id": "e6", "claim": "invalid_grant causes: rotation, races, inactivity", "source": "https://nango.dev/blog/xero-oauth-refresh-token-invalid-grant", "type": "community", "status": "reported", "note": "Recommends per-connection locking"}, {"id": "e7", "claim": "Uncertified apps capped at 5 connections; partnership can take several months", "source": "https://docs-integration.codat.io/integrations/accounting/xero/xero-app-partner-program", "type": "community", "status": "reported", "note": "It can take several months to become a Xero App Partner"}, {"id": "e8", "claim": "Endpoints, /connections behaviour, authEventId, offline_access, redirect URI rules, Demo Company uses prod API", "source": "https://dev.to/ilshadyx/xero-api-integration-guide-2026-oauth-tenants-and-your-first-query-ked", "type": "community", "status": "reported", "note": "Published Aug 4, 2026 by a vendor"}, {"id": "e9", "claim": "Custom Connections: client credentials, single org, per-connection monthly fee, demo free", "source": "https://developer.xero.com/announcements/custom-integrations-are-coming", "type": "official_docs", "status": "verified", "note": "US $5/month USD per connection"}, {"id": "e10", "claim": "Eight certification checkpoints", "source": "https://developer.xero.com/documentation/xero-app-store/app-partner-guides/certification-checkpoints", "type": "official_docs", "status": "verified", "note": "Only headings could be read (JS-rendered page)"}, {"id": "e11", "claim": "App partner journey: onboard beta customers, apply, review, list", "source": "https://developer.xero.com/documentation/xero-app-store/app-partner-guides/building-and-growing-your-app", "type": "official_docs", "status": "verified", "note": "No timeline stated"}, {"id": "e12", "claim": "Partner requirements cite at least 3 customers for certification; >25 tenants as premium benefit (older doc)", "source": "https://developer.xero.com/static/otherfiles/Grow-with-the-Xero-App-Store.pdf", "type": "official_docs", "status": "uncertain", "note": "Undated PDF; likely predates 2026 tiers"}], "uncertain": ["Exact number of beta customers needed for certification: Xero PDF says at least 3, a Xero devblog post title says 10 (couldn't fetch)", "Certification review duration; no official SLA, only partner reports of 'several months'", "Exact app-creation form field labels and integration type names; official docs pages are JS-rendered and only headings were readable", "Max redirect URIs per app (50) and localhost-vs-127.0.0.1 rule come from a community source", "Demo Company reset cadence (commonly cited as 28 days) not verified", "Whether an app that already has >5 or >50 connections at migration was grandfathered"], "last_checked": "2026-10-30", "probes": [{"what": "login.xero.com authorize with fake client_id", "result": "Error page: 'unauthorized_client — Unknown client or client not enabled' (HTTP 500 page)", "outcome": "confirmed", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}]}, "zoom": {"slug": "zoom", "name": "Zoom", "provider": "Zoom Communications", "website": "https://marketplace.zoom.us/", "category": "Video Conferencing", "composio_managed": true, "verdict": "Build a user-managed General app with granular scopes and test it in your own account the same day. Users outside your Zoom account can't authorize it until it passes Marketplace review (published or unlisted) or Zoom approves a time-boxed beta share URL. Start preparing your security evidence (SSDLC, SAST/DAST, privacy policy, test plan) on day one.", "difficulty": {"score": 4, "label": "Hard", "rationale": "Users in other Zoom accounts can only authorize after a Zoom review. The review covers functional/usability testing, scope evaluation, Technical Design compliance, and OWASP-based security testing. Zoom often asks for evidence like SSDLC docs and SAST/DAST output, which works as a light security assessment and is hard for solo developers. It's usually 2-4 weeks, but community threads show stalls of months."}, "timeline": {"first_token": {"estimate": "15-30 min", "note": "Go to marketplace.zoom.us > Develop > Build App > General App. Add a redirect URL and allow list, add scopes, then use Local Test > Add App Now with development credentials, in your own account only."}, "production": {"estimate": "3-6+ weeks", "active_effort": "3-7 days (Technical Design section, security evidence, test plan, support and docs pages on your own domain, listing assets, deauthorization handling)", "waiting": "Officially each submission gets a 72h (business-day) SLA and security review takes up to 2 weeks. The total is typically 2-4 weeks, depending on remediation rounds.", "note": "The wait depends on how complete your Technical Design and security evidence are, how many scopes you request and whether they're justified, and how many reject-and-resubmit cycles you go through. The beta share URL needs its own approval (about 3-4 business days) and expires after 4 weeks."}}, "cost": "Free to build and publish. Developers on free Zoom accounts must upgrade to a paid (credit card) account or submit the developer information form before publishing. You may need third-party SAST/DAST tooling or a pen test to produce evidence.", "paths": [{"name": "Private (unpublished) app", "who_for": "Development, or internal use inside your own Zoom account", "review": "none", "limits": "Only users in your own Zoom account can authorize it. Private apps have addition caps (10 for account-level apps, 100 for user-level apps). No deauthorization webhooks."}, {"name": "Beta (shared authorization URL)", "who_for": "Design partners outside your account before publishing", "review": "Zoom approval of 'Request to Share' (security evidence required), typically 3-4 business days", "limits": "Limited number of external users. The URL is valid 4 weeks, with 2 extensions of 4 weeks each. You can't publicize the app or use Zoom branding. Publishing invalidates beta URLs."}, {"name": "Published or unlisted Marketplace app", "who_for": "Production, any Zoom account", "review": "Full Marketplace review: submission completeness, branding, functionality, usability, compliance (Technical Design), security (scope evaluation and OWASP testing)", "limits": "No subscriber limits. Unlisted apps go through the same review and still need full metadata. Later scope changes are re-reviewed using the development client ID."}], "prerequisites": [{"item": "Zoom account where you are owner/admin or have the Zoom for developers role", "owner": "human", "note": "On a free account you must upgrade or submit the developer info form before publishing."}, {"item": "Public HTTPS OAuth redirect URL and allow-list entries on your company domain (no localhost for review)", "owner": "agent", "note": "Localhost and 127.0.0.1 callbacks are rejected in review submissions."}, {"item": "Deauthorization Notification endpoint (webhook) that deletes user data and revokes tokens", "owner": "agent", "note": "Required for published apps. Private apps never receive it."}, {"item": "Privacy policy, support page (hours, response time, contacts), and user docs for add/use/remove, all hosted on your own domain", "owner": "both", "note": "Google Drive or Dropbox links get rejected."}, {"item": "Security evidence: SSDLC description, SAST and DAST scanner output, plus 3 of 5 of: pen test summary, security policy, incident response policy, vulnerability management, infra/dependency management", "owner": "both", "note": "Mandatory for beta share URL approval. Commonly requested during Marketplace security review."}, {"item": "Business details for EU/discoverability form", "owner": "human", "note": "Community-reported as required even for unlisted apps."}], "steps": [{"phase": "Register", "title": "Create a General app", "detail": "Go to marketplace.zoom.us, sign in, then Develop > Build App (or Developer > Created apps > Develop > Build an app). Choose General app > Create and rename it with the pencil icon. Under Basic Information, choose **User-managed** (each user authorizes their own data; best for most agents) or **Admin-managed** (an account admin installs for the whole account and gets account-wide access).", "owner": "human", "time": "5 min", "url": "https://developers.zoom.us/docs/integrations/create.md"}, {"phase": "Configure", "title": "Set OAuth redirect URL and allow list", "detail": "Under OAuth Information, set the OAuth Redirect URL (required). Optionally turn on 'Use Strict Mode URL' (exact match) and 'Subdomain check'. Under OAuth Allow List (required), add every redirect URL or base domain you use. Use HTTPS only for production and review.", "owner": "agent", "time": "10 min"}, {"phase": "Configure", "title": "Add granular scopes with justifications", "detail": "Under Scopes > Add Scopes, pick product scopes (granular format, e.g. meeting:read:meeting, user:read:user; admin variants end in :admin). Write the Scope Description for each one. Every scope is a request to Zoom's Security Review team, so request only what you will demo in the test plan.", "owner": "both", "time": "20 min"}, {"phase": "Configure", "title": "Event subscriptions and deauthorization", "detail": "Under Features > Event Subscriptions, add your endpoint and verify it with the Secret Token (verification tokens are deprecated). Implement the app_deauthorized notification: delete the user's data and call POST https://zoom.us/oauth/revoke. Prefer webhooks over polling.", "owner": "agent", "time": "1-2 h", "url": "https://developers.zoom.us/docs/integrations/end-user-auth/"}, {"phase": "Test", "title": "Local test with development credentials", "detail": "Open Local Test > Add App Now > Allow to authorize in your own account. Exchange the code at https://zoom.us/oauth/token (Basic auth with client_id:client_secret). You get an access token (1h) and refresh token (90 days, rotated on each refresh). Under Authorization URL > Generate, you can share the link with users in your own account only.", "owner": "both", "time": "15 min", "url": "https://developers.zoom.us/docs/integrations/oauth/"}, {"phase": "Prepare", "title": "Complete the Technical Design section and gather evidence", "detail": "Fill out the Technical Design section in the build flow (stack, architecture, data handling, encryption, retention). Attach evidence for every 'Yes' answer: SSDLC doc, SAST and DAST screenshots or official scanner output (custom summaries aren't accepted), privacy policy, and 3 of the 5 policy/pen-test artifacts. Confirm TLS 1.2+.", "owner": "both", "time": "1-3 days", "url": "https://developers.zoom.us/docs/distribute/security-requirements/"}, {"phase": "Review", "title": "(Optional) Request a beta share URL", "detail": "Go to Manage > your app > Production tab > Beta Test > Share App > Request to Share. Once approved, you get an authorization URL for a limited number of external users, valid 4 weeks (2 x 4-week extensions).", "owner": "human", "time": "15 min", "wait": "Typically 3-4 business days", "url": "https://developers.zoom.us/docs/distribute/sharing-private-and-beta-apps/"}, {"phase": "Prepare", "title": "Prepare listing and test plan", "detail": "Write short and long descriptions, add 2-3 gallery images, pick categories, and set the 'Adding your app' option that matches your real install flow. Link the support URL, privacy policy, and user docs (add, use, remove) on your domain. Write a step-by-step test plan per scope with a test account. A test plan is required on every submission, including resubmissions.", "owner": "both", "time": "1-2 days", "url": "https://developers.zoom.us/docs/distribute/app-submission/common-rejection-issues/"}, {"phase": "Review", "title": "Submit for review with production credentials", "detail": "Switch to the Production client ID for the initial 'Create' publish request; updates later use the development client ID. Choose Publish (listed) or unlisted, then submit. Respond to reviewer notes in the submission notifications.", "owner": "human", "time": "1 h", "wait": "72h per-submission SLA; security review up to 2 weeks; 2-4 weeks total is typical", "url": "https://developers.zoom.us/docs/distribute/app-review-process/"}, {"phase": "Launch", "title": "Publish and monitor", "detail": "After approval, publish. Any user can now authorize. Beta URLs stop working. Zoom monitors published apps continuously and may remove a risky app during remediation.", "owner": "human", "time": "-"}], "review": {"required": "always", "trigger": "Any authorization by users outside your own Zoom account. Published and unlisted apps need full review. Beta sharing needs a separate Zoom approval.", "process": "Submission completeness, branding, functionality (install, uninstall, config, sign-up, data flow), usability, compliance (Technical Design vs security/privacy requirements), then security review (OAuth scope evaluation and OWASP Top 10 security testing). Failures get a remediation report; you fix and resubmit.", "typical_wait": "Official: 72h SLA per submission (business days); security review up to 2 weeks, 'usually way less'. Staff estimate 2-4 weeks overall. Community outliers run to ~3 months when threads stall.", "reviewers_check": ["Test plan covering every scope, with a working test account", "Each scope is used and justified (unused scopes get denied)", "Correct client ID (production for new apps, development for updates)", "Support, privacy and docs URLs on company-owned domains", "User docs for add, use and remove; deauthorization fully implemented (handle the notification and revoke the token)", "Technical Design attestations backed by evidence (SSDLC, SAST/DAST, policies)", "Branding guidelines; no ads or unexpected audio; transparent data collection"], "common_rejections": ["Insufficient test plan", "Wrong client ID submitted", "Docs or support hosted on Google Drive/Dropbox", "Insufficient user documentation or long description", "Gallery images missing or off-spec (need 2-3)", "Free-account developer without upgrade or developer info form", "Support page missing hours, response times or contacts", "Unused or unjustified scopes", "Wrong 'Adding your app' option", "Unlisted app missing metadata", "Incomplete removal flow (no token revoke on deauthorization)", "No evidence for Technical Design attestations (SSDLC, DAST/SAST)"]}, "pre_approval_limits": ["Before review, only users in your own Zoom account can authorize (private app)", "Private app addition caps: 10 (account-level), 100 (user-level)", "Beta share URL: limited external users, 4-week validity plus 2 extensions, no public promotion or Zoom branding", "Private and development apps don't receive deauthorization notifications"], "oauth": {"authorize_url": "https://zoom.us/oauth/authorize", "token_url": "https://zoom.us/oauth/token (revoke: https://zoom.us/oauth/revoke)", "pkce": "supported", "refresh_tokens": "Refresh tokens last 90 days. Each refresh returns a new refresh_token; always use the latest. When it expires, the user has to re-authorize.", "access_token_lifetime": "1 hour", "redirect_uri_rules": "Must be on the OAuth Allow List. Optional Strict Mode (exact match) and subdomain check. HTTPS required for standard (non-PKCE) apps. Loopback http://127.0.0.1:{port} only for PKCE/native clients (port ignored); avoid the hostname 'localhost'. Review submissions with localhost callbacks are rejected. Error: 'Invalid redirect: <uri>'.", "scopes": "Granular scopes such as resource:action:object (e.g. user:read:user, with admin variants ending in :admin). Each scope added is a request reviewed by Zoom Security. User-managed apps get user-level scopes; admin-managed apps can get account-wide admin scopes.", "tenant_notes": "One global authorization server. User-managed apps: each user authorizes their own data. Admin-managed apps: an account admin installs for the whole account. Server-to-Server OAuth (account_credentials) only works on your own account, so it's not suitable for end-user connections. Development and production client IDs are separate."}, "gotchas": [{"title": "Nobody outside your account can connect until review or beta approval", "detail": "Private apps work only for members of your own Zoom account. External users need a Zoom-approved beta URL (4-week windows) or a published/unlisted app that has passed review. There's no 'testing mode with N external users' like Google has.", "severity": "high", "evidence": ["e1", "e2"]}, {"title": "Security evidence is often the real blocker", "detail": "Beta URL approval requires SSDLC docs, SAST and DAST scanner output (official output only), a privacy policy, and 3 of 5 policy/pen-test artifacts. Marketplace reviewers also reject apps whose Technical Design attestations lack evidence. Solo developers report being stuck here.", "severity": "high", "evidence": ["e3", "e4"]}, {"title": "Review time is unpredictable", "detail": "Officially each submission gets a 72h SLA and security review takes up to 2 weeks, with 2-4 weeks typical overall. Forum threads show multi-week silences and one approval confirmed about 3 months later.", "severity": "medium", "evidence": ["e5", "e6", "e7"]}, {"title": "Production vs development client IDs", "detail": "Submit the first publish request with the Production client ID and later updates with the Development client ID. Using the wrong one is a listed rejection reason.", "severity": "medium", "evidence": ["e8", "e9"]}, {"title": "Deauthorization must delete data and revoke tokens", "detail": "Published apps get an app_deauthorized POST for each uninstall. You must delete the user's data, and custom removal flows must call /oauth/revoke. Private apps never receive the event, so you can't test it in production until you publish.", "severity": "medium", "evidence": ["e10", "e9", "e11"]}, {"title": "Every scope is a review request", "detail": "Unused or unjustified scopes get denied and you're asked to remove them. Keep agent scopes minimal and cover each one in the test plan.", "severity": "medium", "evidence": ["e9", "e12"]}, {"title": "Docs must live on your own domain", "detail": "Support, privacy and docs links on Google Drive or Dropbox get rejected. The support page needs hours, response times and contact options.", "severity": "low", "evidence": ["e9"]}, {"title": "Refresh tokens rotate and expire after 90 days", "detail": "Store the newest refresh token after every refresh. An inactive user (90 days) has to reconnect.", "severity": "low", "evidence": ["e11"]}], "blockers": [{"symptom": "Invalid redirect: <redirectUri>", "cause": "Redirect URI isn't on the OAuth Allow List (or Strict Mode or subdomain check fails, or it's localhost on a non-PKCE app)", "fix": "Add the exact HTTPS URL to the OAuth Allow List and the Redirect URL field."}, {"symptom": "External user can't authorize the app (error, or the app doesn't install)", "cause": "App is private/unpublished. Only your own account can authorize.", "fix": "Request a beta share URL (Production > Beta Test > Request to Share) or get the app published or unlisted through review."}, {"symptom": "Submission rejected: 'did not provide supporting evidence to what you attested in the Technical Design section'", "cause": "Missing SSDLC, SAST/DAST or policy evidence", "fix": "Upload scanner output and policies, or work with your security reviewer on alternatives case by case."}, {"symptom": "Rejected for unused scopes", "cause": "Scopes not exercised in the test plan", "fix": "Remove them, or add test steps that exercise them."}, {"symptom": "invalid_grant on refresh", "cause": "Using an old refresh token, or it expired after 90 days", "fix": "Persist the latest refresh token each time. Re-run user OAuth if it expired."}], "agent_vs_human": {"agent_can": ["choose minimal granular scopes and write scope descriptions", "implement OAuth, refresh and revoke", "implement the deauthorization webhook and data deletion", "draft Technical Design answers", "run SAST/DAST tooling and collect output", "draft privacy policy, support page and user docs", "write the per-scope test plan"], "human_must": ["sign in to Zoom Marketplace with a developer-enabled account", "upgrade account or submit developer info form", "fill in business/EU details", "attest to security practices and provide policy documents", "click Request to Share and Submit", "answer reviewer notifications"]}, "evidence": [{"id": "e1", "claim": "Private apps shareable only within your account; beta apps to limited external users with Zoom approval; 4-week URLs, 2 extensions; caps 10/100", "source": "https://developers.zoom.us/docs/distribute/sharing-private-and-beta-apps/", "type": "official_docs", "status": "verified", "note": "\"only share private apps with members within your Zoom account\" | Re-checked: 4-week URL, two 4-week extensions, Zoom approval ~3-4 business days"}, {"id": "e2", "claim": // Shared agent definition: prompt, tool specs, output schema and helpers. Used by the server (lib/runner.mjs) and inlined into the page.
// Keep this file dependency-free; build/build.py inlines it into the page with `export` stripped.

const TOOL_DEFS = {
  check_composio_directory: {
    description: "Look up an app in Composio's managed-auth directory (387 OAuth toolkits, captured 2026-10-29). Returns whether Composio offers a managed OAuth app (developer can start without registering) or the developer must bring their own, plus close name matches.",
    inputSchema: { type: "object", properties: { name: { type: "string", description: "App or product name, e.g. 'Google Calendar'" } }, required: ["name"] }
  },
  get_library_guide: {
    description: "Return a condensed, human-verified guide from our library (slugs: gmail, outlook, notion, slack, github, zoom, salesforce, linkedin, twitter, shopify, xero, docusign). Use it when the target app shares a provider platform (e.g. Google Calendar -> gmail, Microsoft Teams -> outlook, Instagram -> none) or to calibrate difficulty against a known app.",
    inputSchema: { type: "object", properties: { slug: { type: "string" } }, required: ["slug"] }
  },
  web_search: {
    description: "Search the web. Returns result titles, URLs and snippets. Use queries like '<app> OAuth app developer register', '<app> app review marketplace requirements', '<app> oauth scopes'.",
    inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] }
  },
  read_url: {
    description: "Open a URL and return its visible text (truncated). Use for the provider's official developer docs: OAuth guide, app registration, app review / marketplace / verification policy pages.",
    inputSchema: { type: "object", properties: { url: { type: "string" } }, required: ["url"] }
  },
  probe_authorize_endpoint: {
    description: "Live setup attempt without an account: requests the provider's OAuth authorize URL with a deliberately invalid client_id and redirect_uri https://example.com/callback, and returns what the provider shows (e.g. 'invalid_client'). Confirms the endpoint exists and the exact error a developer sees. Pass the bare authorize URL; query params are added for you.",
    inputSchema: { type: "object", properties: { authorize_url: { type: "string" }, scope: { type: "string", description: "optional scope string to include" } }, required: ["authorize_url"] }
  }
};

const GUIDE_SHAPE = `{
 "slug": "lowercase-id", "name": "App (which API)", "provider": "Company", "website": "https://developer-portal-url",
 "category": "e.g. CRM", "oauth_supported": "yes|no|partial",
 "auth_alternatives": "only if OAuth is missing/limited: API keys, PATs, etc.",
 "verdict": "1-2 sentences a developer can act on",
 "difficulty": {"score": 1, "label": "Instant|Easy|Moderate|Hard|Gated", "rationale": "..."},
 "timeline": {"first_token": {"estimate": "15–30 min", "note": "..."},
              "production": {"estimate": "range", "active_effort": "range", "waiting": "range", "note": "what drives the wait"}},
 "cost": "Free | paid tier needed | assessment fee ...",
 "paths": [{"name": "e.g. Private / own workspace", "who_for": "...", "review": "none|...", "limits": "..."}],
 "prerequisites": [{"item": "...", "owner": "human|agent", "note": "..."}],
 "steps": [{"phase": "Prepare|Register|Configure|Test|Review|Launch", "title": "...", "detail": "exact console names/menus/fields",
            "owner": "agent|human|both", "time": "10 min", "wait": "optional", "url": "https://..."}],
 "review": {"required": "never|conditional|always", "trigger": "...", "process": "...", "typical_wait": "...",
            "reviewers_check": ["..."], "common_rejections": ["..."]},
 "pre_approval_limits": ["..."],
 "oauth": {"authorize_url": "...", "token_url": "...", "pkce": "...", "refresh_tokens": "...", "access_token_lifetime": "...",
           "redirect_uri_rules": "...", "scopes": "...", "tenant_notes": "..."},
 "gotchas": [{"title": "...", "detail": "...", "severity": "high|medium|low", "evidence": ["e1"]}],
 "blockers": [{"symptom": "...", "cause": "...", "fix": "..."}],
 "agent_vs_human": {"agent_can": ["..."], "human_must": ["..."]},
 "evidence": [{"id": "e1", "claim": "...", "source": "https://url-you-actually-read-or-empty", "type": "official_docs|tested|community|inferred",
               "status": "verified|reported|uncertain", "note": "what you saw (<=15 word quote)"}],
 "probes": [{"what": "...", "result": "...", "outcome": "confirmed|partial|failed|skipped"}],
 "uncertain": ["..."],
 "confidence": "high|medium|low"
}`;

const RUBRIC = `Difficulty (score/label):
1 Instant  - self-serve; any user can authorize right away; no review ever.
2 Easy     - self-serve; review only for optional marketplace listing.
3 Moderate - verification or review needed for production but predictable (days to ~2 weeks).
4 Hard     - security assessment, multi-week review, business verification, or hard user caps until approved.
5 Gated    - partner program, sales contact, or paid tier required just to get access to the useful APIs.
Score the path an AI-agent developer most likely needs (multi-tenant, public, scopes that read user data). If paths differ a lot, say so in rationale.`;

function buildPrompt(input, ctx = {}) {
  const { mode = "browser", today = new Date().toISOString().slice(0, 10), existing = null } = ctx;
  const toolsLine = mode === "knowledge"
    ? "You have NO web access in this run (only the directory + library tools). Use your own knowledge, mark every claim type=inferred, status=uncertain unless it comes from a library guide, set confidence to low or medium, and say plainly in `uncertain` that nothing was checked against live sources."
    : "You can search the web, read pages and probe the authorize endpoint. Base claims on the provider's CURRENT official docs; label community-sourced numbers type=community. Only cite URLs you actually opened.";
  return `You are an integrations expert agent. A developer building an AI agent wants their end users to connect "${input}" via OAuth. Investigate what it takes to create THEIR OWN OAuth app with this provider and get it approved for production, then produce a guide.

Today is ${today}. ${toolsLine}

Work plan (be economical: at most ~6 tool rounds; call several tools in the same round when you can):
1. Resolve the input to a specific product + provider. If ambiguous (e.g. "Teams"), pick the most likely and note the ambiguity in "uncertain". If the input is a website, identify the product behind it.
2. check_composio_directory for the app. If the provider shares a platform with a library guide (Google, Microsoft, Atlassian, Meta...), call get_library_guide for it.
3. Find and read the official OAuth / app registration docs and the review / verification / marketplace policy.
4. probe_authorize_endpoint once you know the authorize URL (if the tool is available).
5. Write the guide.

What developers need most, in order: (a) how hard and how long, split into time to first working token vs time until any outside user can connect at production scale (active work vs waiting on the provider); (b) what triggers review and what reviewers check; (c) caps and limits before approval (test-user caps, tenant/connection caps, token expiry in test mode); (d) nuances that break agents (refresh-token behaviour, rate limits for unlisted apps, admin consent, data/AI-training restrictions, per-tenant base URLs); (e) a step plan saying which steps an agent can do (research, drafting privacy policy/scope justifications/demo script, generating config and code, verifying redirect URIs) and which a human must do (sign in/2FA, accept terms, verify domain, pay, submit business documents, record demo video, press submit).

If the app has no third-party OAuth at all, set oauth_supported "no", explain the alternative auth in auth_alternatives, keep steps short, and score difficulty for the alternative. If the input is not a real app, return {"error": "not_found", "message": "...", "suggestions": ["..."]}.

${RUBRIC}

Honesty rules: ranges not false precision; never invent URLs; anything you could not confirm goes in "uncertain" with status "uncertain"; evidence ids referenced from gotchas must exist.
${existing ? `\nAn existing guide is provided for re-checking. Verify its riskiest claims, correct anything stale, and keep what holds:\n${JSON.stringify(existing).slice(0, 30000)}\n` : ""}
Reply with ONLY one JSON object in exactly this shape (no prose before or after):
${GUIDE_SHAPE}`;
}

const LIB_KEYS = ["slug", "name", "verdict", "difficulty", "timeline", "cost", "paths", "review", "pre_approval_limits", "oauth", "gotchas", "uncertain"];
function condenseGuide(g) {
  if (!g) return null;
  const o = {};
  for (const k of LIB_KEYS) if (g[k] !== undefined) o[k] = g[k];
  o.steps = (g.steps || []).map(s => ({ phase: s.phase, title: s.title, owner: s.owner, time: s.time, wait: s.wait }));
  return o;
}

function checkComposio(dir, name) {
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const q = norm(name);
  const all = [...dir.managed.map(n => ({ n, managed: true })), ...dir.byo.map(n => ({ n, managed: false }))];
  const exact = all.filter(x => norm(x.n) === q);
  const close = all.filter(x => !exact.includes(x) && (norm(x.n).includes(q) || (q.includes(norm(x.n)) && norm(x.n).length > 3))).slice(0, 8);
  return {
    source: dir.source, captured: dir.captured,
    exact: exact.map(x => ({ name: x.n, composio: x.managed ? "managed OAuth available" : "bring your own OAuth app" })),
    close_matches: close.map(x => ({ name: x.n, composio: x.managed ? "managed OAuth available" : "bring your own OAuth app" })),
    note: exact.length || close.length ? "" : "Not in Composio's OAuth directory: either no OAuth toolkit exists there or the app uses API keys/other auth."
  };
}

function probeUrl(authorizeUrl, scope) {
  const u = new URL(authorizeUrl.replace(/\{[^}]+\}/g, "common"));
  u.searchParams.set("client_id", "probe_invalid_client_00000000");
  u.searchParams.set("redirect_uri", "https://example.com/callback");
  u.searchParams.set("response_type", "code");
  u.searchParams.set("state", "probe");
  if (scope) u.searchParams.set("scope", scope);
  return u.toString();
}

// Make a model-produced guide safe to render: fill defaults, coerce types, clamp score.
function normalizeGuide(g, meta = {}) {
  if (!g || typeof g !== "object") throw new Error("Agent returned no guide");
  if (g.error) return g;
  const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
  const str = v => (v == null ? "" : typeof v === "string" ? v : JSON.stringify(v));
  const labels = ["", "Instant", "Easy", "Moderate", "Hard", "Gated"];
  const d = g.difficulty || {};
  let score = Math.round(Number(d.score)); if (!(score >= 1 && score <= 5)) score = 3;
  const out = {
    ...g,
    slug: str(g.slug || g.name || "app").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""),
    name: str(g.name || "Unknown app"), provider: str(g.provider), website: str(g.website), category: str(g.category),
    verdict: str(g.verdict),
    difficulty: { score, label: labels[score], rationale: str(d.rationale) },
    timeline: {
      first_token: { estimate: str(g.timeline?.first_token?.estimate || "unknown"), note: str(g.timeline?.first_token?.note) },
      production: { estimate: str(g.timeline?.production?.estimate || "unknown"), active_effort: str(g.timeline?.production?.active_effort), waiting: str(g.timeline?.production?.waiting), note: str(g.timeline?.production?.note) }
    },
    cost: str(g.cost),
    paths: arr(g.paths), prerequisites: arr(g.prerequisites), steps: arr(g.steps),
    review: g.review && typeof g.review === "object" ? { ...g.review, reviewers_check: arr(g.review.reviewers_check), common_rejections: arr(g.review.common_rejections) } : { required: "unknown" },
    pre_approval_limits: arr(g.pre_approval_limits).map(str), oauth: g.oauth || {},
    gotchas: arr(g.gotchas), blockers: arr(g.blockers),
    agent_vs_human: { agent_can: arr(g.agent_vs_human?.agent_can).map(str), human_must: arr(g.agent_vs_human?.human_must).map(str) },
    evidence: arr(g.evidence), probes: arr(g.probes), uncertain: arr(g.uncertain).map(str),
    confidence: ["high", "medium", "low"].includes(g.confidence) ? g.confidence : "medium",
    generated: { at: new Date().toISOString(), ...meta },
    last_checked: new Date().toISOString().slice(0, 10)
  };
  return out;
}

</script>
<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
const LIB = DATA.guides; // slug -> guide
const LABELS = ["", "Instant", "Easy", "Moderate", "Hard", "Gated"];
const DCOL = n => `var(--d${n})`;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const generated = new Map(); // id -> guide (db + this session)
let ENV = { kind: "static", live: false };

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600); }
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || "Copied"); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast(okMsg || "Copied"); } catch { toast("Select and copy the text manually"); } ta.remove(); }
}

const diffBadge = g => { const n = g.difficulty?.score || 3; return `<span class="diff" style="color:${DCOL(n)}"><span class="meter" aria-hidden="true">${[1,2,3,4,5].map(i => `<i style="${i <= n ? `background:${DCOL(n)}` : ""}"></i>`).join("")}</span>${n} · ${esc(LABELS[n])}</span>`; };
const composioChip = m => m === true ? `<span class="chip" title="Composio's directory offers a managed OAuth app for this toolkit">Composio-managed available</span>` : m === false ? `<span class="chip" title="Composio's directory lists this toolkit as bring-your-own OAuth app">Bring your own app</span>` : "";
const reviewWord = r => ({ never: "No review", conditional: "Review if…", always: "Review required" }[r?.required] || "Review: unknown");

// ---------- routing
const routes = { library: viewLibrary, new: viewNew, method: viewMethod };
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "library";
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", false));
  let navKey = "library";
  if (routes[h]) { navKey = h; routes[h](); }
  else if (LIB[h]) viewGuide(LIB[h], { source: "library" });
  else if (h.startsWith("gen-") && generated.has(h.slice(4))) viewGuide(generated.get(h.slice(4)), { source: "generated", id: h.slice(4) });
  else if (h.startsWith("gen-")) { $("#app").innerHTML = `<p class="muted">Loading generated guide…</p>`; envReady.then(loadGenerated).then(() => generated.has(h.slice(4)) ? route() : ($("#app").innerHTML = `<p>That generated guide isn't available in this view. <a href="#library">Back to the library</a></p>`)); }
  else viewLibrary();
  const a = document.querySelector(`[data-nav="${navKey}"]`); if (a) a.setAttribute("aria-current", "page");
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

// ---------- library
let diffFilter = 0, catFilter = "all";
function viewLibrary() {
  const ready = Object.values(LIB).sort((a, b) => a.difficulty.score - b.difficulty.score || a.name.localeCompare(b.name));
  $("#app").innerHTML = `
  <section style="display:grid;gap:12px">
    <span class="eyebrow">OAuth app setup &amp; approval guides for agent builders</span>
    <h1>Know what it takes to get your OAuth app approved before you start.</h1>
    <p class="lead">Look up an app to see how hard it is, how long it takes (including the wait for review), what can block you, and which steps an agent can do for you. Apps outside the library get a guide researched live by an agent.</p>
    <form class="lookup" id="lookup" autocomplete="off"><label for="q" class="sr">App name or website</label>
      <input id="q" placeholder="App name or website, e.g. Google Calendar or hubspot.com" list="appnames">
      <datalist id="appnames">${DATA.catalog.map(c => `<option value="${esc(c.name)}">`).join("")}</datalist>
      <button class="btn primary" type="submit">Look up</button></form>
    <div class="tries"><span class="small muted">Try:</span>${["Gmail", "Slack", "GitHub", "Google Calendar", "HubSpot", "Calendly", "Pipedrive"].map(t => `<button type="button" data-try="${esc(t)}">${esc(t)}</button>`).join("")}</div>
  </section>

  <section class="block">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
      <div><h2>The two clocks</h2><p class="muted small">Time to a first working token vs. time until users outside your own account can connect at production scale. Log scale. Hover a row for details.</p></div>
    </div>
    <div class="panel chart" id="chart"></div>
  </section>

  <section class="block">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
      <h2>Ready guides <span class="muted" style="font-weight:500">(${ready.length})</span></h2>
      <div class="filters" id="dfilters">${[0,1,2,3,4,5].map(n => `<button class="chip ${diffFilter === n ? "on" : ""}" data-d="${n}">${n ? `<span class="dot" style="background:${DCOL(n)}"></span>${LABELS[n]}` : "All"}</button>`).join("")}</div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="block" id="genlist-wrap" hidden>
    <h2>Generated by the agent</h2>
    <p class="muted small">Researched live by the agent on request. Not human-reviewed: check the evidence section of each guide.</p>
    <div class="cards" id="genlist"></div>
  </section>

  <section class="block">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
      <div><h2>Catalog: 100 OAuth apps</h2><p class="muted small">Seeded from Composio's managed-auth directory. ${Object.keys(LIB).length} have a reviewed guide; the rest can be generated on demand.</p></div>
      <div class="filters" id="cfilters">${[["all","All"],["ready","Has guide"],["byo","Bring-your-own only"],["managed","Composio-managed"]].map(([k,l]) => `<button class="chip ${catFilter === k ? "on" : ""}" data-c="${k}">${l}</button>`).join("")}</div>
    </div>
    <div class="panel table-wrap"><table><thead><tr><th>App</th><th>Category</th><th>Composio directory</th><th>Guide</th></tr></thead><tbody id="catbody"></tbody></table></div>
  </section>`;
  drawCards(ready); drawChart(ready); drawCatalog(); drawGenList();
  $("#lookup").onsubmit = e => { e.preventDefault(); lookup($("#q").value); };
  document.querySelectorAll("[data-try]").forEach(b => b.onclick = () => lookup(b.dataset.try));
  $("#dfilters").onclick = e => { const b = e.target.closest("[data-d]"); if (!b) return; diffFilter = +b.dataset.d; document.querySelectorAll("#dfilters .chip").forEach(c => c.classList.toggle("on", c === b)); drawCards(ready); };
  $("#cfilters").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; catFilter = b.dataset.c; document.querySelectorAll("#cfilters .chip").forEach(c => c.classList.toggle("on", c === b)); drawCatalog(); };
}
function card(g, href, extra = "") {
  return `<a class="card" href="${href}">
    <div class="top"><h3>${esc(g.name.replace(/\s*\(.*\)$/, ""))}</h3>${diffBadge(g)}</div>
    <div class="clocks"><div><span class="muted">First token</span><b>${esc(g.timeline.first_token.estimate)}</b></div><div><span class="muted">Production</span><b>${esc(shortProd(g))}</b></div></div>
    <p class="verdict">${esc(g.verdict)}</p>
    <div class="badges"><span class="chip">${esc(reviewWord(g.review))}</span>${composioChip(g.composio_managed)}${extra}</div></a>`;
}
function shortProd(g) { const c = DATA.chart[g.slug]; return c ? c.label : g.timeline.production.estimate.split(/[.;(]/)[0].slice(0, 48); }
function drawCards(list) { $("#cards").innerHTML = list.filter(g => !diffFilter || g.difficulty.score === diffFilter).map(g => card(g, "#" + g.slug)).join("") || `<p class="muted">No ready guides at this level yet.</p>`; }
function drawGenList() {
  const el = $("#genlist"); if (!el) return;
  const items = [...generated.entries()].filter(([, g]) => !g.error);
  $("#genlist-wrap").hidden = !items.length;
  el.innerHTML = items.map(([id, g]) => card(g, "#gen-" + id, `<span class="chip">AI-generated</span>`)).join("");
}
function drawCatalog() {
  const genBySlug = {}; for (const [id, g] of generated) genBySlug[(g.catalog_slug || g.slug)] = id;
  const rows = DATA.catalog.filter(c => catFilter === "all" || (catFilter === "ready" && LIB[c.slug]) || (catFilter === "byo" && !c.managed) || (catFilter === "managed" && c.managed));
  $("#catbody").innerHTML = rows.map(c => {
    const st = LIB[c.slug] ? `<a class="status-ready" href="#${c.slug}">Ready · ${esc(LABELS[LIB[c.slug].difficulty.score])}</a>`
      : genBySlug[c.slug] ? `<a class="status-gen" href="#gen-${genBySlug[c.slug]}">Generated</a>`
      : `<button class="btn" data-gen="${esc(c.name)}" data-slug="${esc(c.slug)}">Generate</button>`;
    return `<tr><td>${esc(c.name)}</td><td class="muted">${esc(c.category)}</td><td>${c.managed ? "Managed available" : "<b>Bring your own</b>"}</td><td>${st}</td></tr>`;
  }).join("");
  $("#catbody").onclick = e => { const b = e.target.closest("[data-gen]"); if (b) startGenerate(b.dataset.gen, { catalogSlug: b.dataset.slug }); };
}
function lookup(raw) {
  const q = String(raw || "").trim(); if (!q) return;
  const n = s => s.toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/[^a-z0-9]/g, "");
  const nq = n(q);
  const hit = Object.values(LIB).find(g => [g.slug, g.name, g.name.replace(/\s*\(.*\)$/, ""), g.provider].some(x => x && n(x) === nq) || (g.aliases || []).some(a => n(a) === nq) || nq.startsWith(g.slug + "com"));
  if (hit) { location.hash = hit.slug; return; }
  for (const [id, g] of generated) if (n(g.name) === nq || n(g.query || "") === nq) { location.hash = "gen-" + id; return; }
  const cat = DATA.catalog.find(c => n(c.name) === nq);
  startGenerate(q, { catalogSlug: cat?.slug });
}

// ---------- chart (log-scale range bars)
function drawChart(list) {
  const rows = list.filter(g => DATA.chart[g.slug]).sort((a, b) => DATA.chart[a.slug].prod[1] - DATA.chart[b.slug].prod[1]);
  const W = 960, L = 150, R = 150, rowH = 30, top = 28, H = top + rows.length * rowH + 10;
  const lo = Math.log10(5), hi = Math.log10(260000);
  const x = m => L + (Math.log10(Math.max(5, m)) - lo) / (hi - lo) * (W - L - R);
  const ticks = [[10, "10 min"], [60, "1 h"], [1440, "1 day"], [10080, "1 wk"], [43200, "1 mo"], [129600, "3 mo"], [259200, "6 mo"]];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Time to first token and to production per app">`;
  for (const [m, t] of ticks) s += `<line x1="${x(m)}" x2="${x(m)}" y1="${top - 6}" y2="${H - 6}" stroke="var(--line)" stroke-width="1"/><text x="${x(m)}" y="${top - 12}" text-anchor="middle">${t}</text>`;
  rows.forEach((g, i) => {
    const c = DATA.chart[g.slug], y = top + i * rowH + rowH / 2, col = DCOL(g.difficulty.score);
    s += `<g class="row" data-slug="${g.slug}" style="cursor:pointer"><rect class="hit" x="0" y="${y - rowH / 2}" width="${W}" height="${rowH}" fill="transparent" rx="6"/>
      <text class="name" x="${L - 12}" y="${y + 4}" text-anchor="end">${esc(g.name.replace(/\s*\(.*\)$/, ""))}</text>
      <line x1="${x(c.first)}" x2="${x(c.prod[0])}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2" stroke-dasharray="2 3" opacity=".7"/>

  });
  s += `</svg>`;
  $("#chart").innerHTML = `<div class="chart-wrap">${s}</div><div class="legend"><span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--muted)" stroke-width="2"/></svg>First working token</span><span><svg width="26" height="10"><rect width="26" height="10" rx="4" fill="var(--muted)"/></svg>Production window (incl. review wait)</span>${[1,2,3,4,5].map(n => `<span><span class="dot" style="background:${DCOL(n)}"></span>${LABELS[n]}</span>`).join("")}</div>`;
  const tip = $("#tip");
  $("#chart").querySelectorAll(".row").forEach(r => {
    const g = LIB[r.dataset.slug];
    r.onmousemove = e => { tip.hidden = false; tip.innerHTML = `<b>${esc(g.name)}</b><br>First token: ${esc(g.timeline.first_token.estimate)}<br>Production: ${esc(g.timeline.production.estimate)}`; tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px"; tip.style.top = e.clientY + 14 + "px"; };
    r.onmouseleave = () => (tip.hidden = true);
    r.onclick = () => { tip.hidden = true; location.hash = g.slug; };

}

// ---------- markdown export
function toMarkdown(g, isGen) {
  const L = [], li = a => (a || []).map(x => `- ${x}`).join("\n");
  L.push(`# ${g.name}: OAuth app setup & approval guide`, "");
  if (isGen) L.push(`> Generated by an agent on ${g.generated?.at?.slice(0, 10) || ""} (web-researched). Not human-reviewed. Confidence: ${g.confidence}.`, "");
  L.push(`**Difficulty:** ${g.difficulty.score}/5 ${g.difficulty.label}. ${g.difficulty.rationale}`, "", `**Verdict:** ${g.verdict}`, "");
  L.push(`| Clock | Estimate |`, `|---|---|`, `| First working token | ${g.timeline.first_token.estimate} |`, `| Open to real users | ${g.timeline.production.estimate} |`, `| Your active work | ${g.timeline.production.active_effort || "-"} |`, `| Waiting on provider | ${g.timeline.production.waiting || "-"} |`, `| Cost | ${g.cost || "-"} |`, "");
  if (g.composio_managed !== undefined) L.push(`**Composio directory:** ${g.composio_managed ? "managed OAuth app available (own app optional, for white-label / custom scopes / own quota)" : "bring your own OAuth app (required)"}`, "");
  L.push("## Paths", ...(g.paths || []).map(p => `- **${p.name}** (${p.who_for}). Review: ${p.review}. Limits: ${p.limits}`), "");
  L.push("## Step plan");
  (g.steps || []).forEach((s, i) => L.push(`${i + 1}. [ ] **${s.title}** _(${s.phase || ""} · ${s.owner === "agent" ? "agent" : s.owner === "both" ? "agent drafts, you submit" : "you"}${s.time ? " · " + s.time : ""}${s.wait ? " · wait " + s.wait : ""})_  \n   ${s.detail}${s.url ? `  \n   ${s.url}` : ""}`));
  L.push("", "## Agent can", li(g.agent_vs_human.agent_can), "", "## You must", li(g.agent_vs_human.human_must), "");
  L.push("## Review", `- Required: ${g.review.required}`, `- Trigger: ${g.review.trigger || "-"}`, `- Process: ${g.review.process || "-"}`, `- Typical wait: ${g.review.typical_wait || "-"}`, "", "Reviewers check:", li(g.review.reviewers_check), "", "Common rejections:", li(g.review.common_rejections), "");
  L.push("## Limits before approval", li(g.pre_approval_limits), "", "## Gotchas", ...(g.gotchas || []).map(x => `- **[${x.severity}] ${x.title}**: ${x.detail}${x.evidence?.length ? ` (${x.evidence.join(", ")})` : ""}`), "");
  L.push("## When you're blocked", "| You see | Why | What to do |", "|---|---|---|", ...(g.blockers || []).map(b => `| ${b.symptom} | ${b.cause} | ${b.fix} |`.replace(/\n/g, " ")), "");
  const o = g.oauth || {}; L.push("## OAuth reference", ...Object.entries(o).map(([k, v]) => `- ${k}: ${v}`), "");
  if ((g.uncertain || []).length) L.push("## Not confirmed", li(g.uncertain), "");
  L.push("## Evidence", ...(g.evidence || []).map(e => `- ${e.id} [${e.status}, ${e.type}] ${e.claim}${e.source ? ` (${e.source})` : ""}`), "", `_Last checked ${g.last_checked || ""}._`);
  return L.join("\n");
}
async function downloadMd(g, isGen) {
  const text = toMarkdown(g, isGen), filename = `${g.slug}-oauth-guide.md`;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" })); a.download = filename; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

let run = null; // {ctl, input, log:[], status, guide, error}

  $("#app").innerHTML = `
  <section style="display:grid;gap:12px">
    <span class="eyebrow">Live generation</span><h1>Generate a guide for any app</h1>
    <p class="lead">Enter an app name or its website. An agent identifies the provider, checks Composio's directory, reads the provider's developer docs, tries the authorize endpoint, and writes a guide in the same format as the library, with sources and open questions marked.</p>
    <form class="lookup" id="genform" autocomplete="off"><label for="gq" class="sr">App name or website</label><input id="gq" placeholder="e.g. Calendly, pipedrive.com, Google Calendar" value="${esc(run?.input || "")}"><button class="btn primary" id="gobtn" type="submit" ${canGen ? "" : "disabled"}>Generate</button></form>
    <div class="mode">${run?.status === "running" ? `<span class="spinner"></span>` : ""}<span>${envNote}</span></div>

  <section class="block gen">
    <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)"><h3>Agent activity</h3><button class="btn" id="stop" ${run?.status === "running" ? "" : "hidden"}>Stop</button></div><div class="log" id="log" role="log" aria-live="polite"></div></div>
    <div class="panel" style="padding:16px;display:grid;gap:10px" id="genout"></div>
  </section>`;
  $("#genform").onsubmit = e => { e.preventDefault(); const v = $("#gq").value.trim(); if (v) startGenerate(v, {}); };

}
function paintRun() {
  const log = $("#log"), out = $("#genout"); if (!log || !out) return;
  if (!run) { log.innerHTML = `<div><span class="t"></span><span class="muted">The agent's tool calls will appear here.</span></div>`; out.innerHTML = `<h3>What you get</h3><p class="small muted">A full guide: difficulty, the two clocks, step plan split between agent and human, review triggers, limits before approval, gotchas, blockers, OAuth reference, and an evidence list. It's added to the library so anyone can open it.</p>`; return; }
  log.innerHTML = run.log.map(l => `<div><span class="t">${l.t}</span><span class="k-${l.k}">${esc(l.m)}</span></div>`).join("");
  log.scrollTop = log.scrollHeight;
  if (run.status === "running") out.innerHTML = `<div style="display:flex;gap:10px"><span class="spinner"></span><div><b>Investigating ${esc(run.input)}</b><p class="small muted">${run.chars ? `Writing the guide… ${run.chars.toLocaleString()} characters` : "Researching. A full run usually takes 1–4 minutes."}</p></div></div>`;
  else if (run.status === "done" && run.guide && !run.guide.error) out.innerHTML = `<span class="eyebrow">Ready</span><h2>${esc(run.guide.name)}</h2><div>${diffBadge(run.guide)}</div><p class="small">${esc(run.guide.verdict)}</p><div class="guide-actions"><a class="btn primary" href="#gen-${run.id}">Open the guide</a></div><p class="small muted">${run.saved ? "Added to the library: anyone can open it from there." : "Kept in this view only (couldn't save it to the library)."}</p>`;
  else if (run.status === "done" && run.guide?.error) out.innerHTML = `<h3>Couldn't identify that app</h3><p class="small">${esc(run.guide.message)}</p>${(run.guide.suggestions || []).map(s => `<button class="btn" data-try="${esc(s)}">${esc(s)}</button>`).join(" ")}`;
  else if (run.status === "error") out.innerHTML = `<h3>The run stopped</h3><p class="small">${esc(run.error)}</p><button class="btn" id="retry">Try again</button>`;
  out.querySelectorAll("[data-try]").forEach(b => b.onclick = () => startGenerate(b.dataset.try, {}));
  const r = $("#retry"); if (r) r.onclick = () => startGenerate(run.input, run.opts || {});
  const stop = $("#stop"); if (stop) stop.hidden = run.status !== "running";
}
function logLine(k, m) { if (!run) return; const s = Math.round((Date.now() - run.t0) / 1000); run.log.push({ t: `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`, k, m }); paintRun(); }

async function startGenerate(input, opts) {
  if (run?.status === "running") { toast("A guide is already being generated"); location.hash = "new"; return; }
  if (!(ENV.kind === "server" && ENV.live)) { location.hash = "new"; toast("Live generation isn't available on this copy"); return; }
  run = { input, opts, ctl: new AbortController(), log: [], status: "running", t0: Date.now(), chars: 0 };
  if (location.hash !== "#new") location.hash = "new"; else viewNew();
  logLine("ok", opts.existing ? `Re-checking "${input}" against live sources` : `Starting: "${input}"`);
  try {
    const { guide, id } = await runServer(input, opts);
    if (!guide.error) {
      guide.query = input; if (opts.catalogSlug) guide.catalog_slug = opts.catalogSlug;
      const dirHit = checkComposio(DATA.directory, guide.name.replace(/\s*\(.*\)$/, "")).exact[0] || checkComposio(DATA.directory, input).exact[0];
      if (dirHit) guide.composio_managed = /managed/.test(dirHit.composio);
      run.id = id || (guide.slug || "app") + "-local";
      generated.set(run.id, guide);
      run.saved = !!id;
      logLine("ok", `Guide ready: ${guide.difficulty.score}/5 ${guide.difficulty.label}`);
    } else logLine("err", "Agent could not identify the app");
    run.guide = guide; run.status = "done";
  } catch (e) {
    run.status = "error";
    run.error = e?.name === "AbortError" ? "Stopped." : (e?.message || String(e));
    logLine("err", run.error);
  }
  paintRun();
}

// Server runner: SSE stream from /api/generate
async function runServer(input, opts) {
  const res = await fetch("api/generate", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ input, catalogSlug: opts.catalogSlug || null, existing: opts.existing ? condenseGuide(opts.existing) : null }), signal: run.ctl.signal });
  if (!res.ok || !res.body) throw new Error((await res.text().catch(() => "")) || `Server error ${res.status}`);
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", guide = null, gid = null;
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split("\n").find(l => l.startsWith("data:")); if (!line) continue;
      const ev = JSON.parse(line.slice(5));
      if (ev.type === "log") logLine(ev.kind || "tool", ev.message);
      else if (ev.type === "text") { run.chars = ev.chars; paintRun(); }
      else if (ev.type === "guide") { guide = ev.guide; gid = ev.id; }
      else if (ev.type === "error") throw new Error(ev.message);
    }
  }
  if (!guide) throw new Error("The server ended without a guide");
  return { guide, id: gid };
}

// ---------- shared storage for generated guides
async function loadGenerated() {
  try {
    if (ENV.kind === "server") { const r = await fetch("api/guides"); if (r.ok) for (const [id, g] of Object.entries(await r.json())) if (/^[a-z0-9-]{3,80}$/.test(id) && g && typeof g === "object") generated.set(id, g); }
  } catch (e) { console.warn("load failed", e); }
  drawGenList(); if ($("#catbody")) drawCatalog();
}

// ---------- method page
function viewMethod() {
  const V = DATA.verification, c = V.reduce((a, v) => (a[v.verdict] = (a[v.verdict] || 0) + 1, a), {});
  const allEv = Object.values(LIB).flatMap(g => g.evidence || []), evc = allEv.reduce((a, e) => (a[e.status] = (a[e.status] || 0) + 1, a), {});
  const probes = Object.values(LIB).flatMap(g => (g.probes || []).map(p => ({ ...p, app: g.name.replace(/\s*\(.*\)$/, "") })));
  $("#app").innerHTML = `
  <section style="display:grid;gap:12px"><span class="eyebrow">How this works</span><h1>Method &amp; evidence</h1>
    <p class="lead">What a provider OAuth app is, how these guides were researched and checked, and what we could not verify.</p></section>

  <section class="block"><h2>What you're actually setting up</h2>
    <p style="max-width:70ch">A <b>provider OAuth app</b> is a registration you create in the provider's developer console (Google Cloud, Slack API, Entra ID…). It gives you a client ID and secret, fixes your redirect URIs and scopes, and decides what your users see on the consent screen. Your integration uses it to send each user through consent; each user's approval becomes a <b>connection</b> (their tokens). One app, many connections. The provider decides how many users your app may serve before it's verified, which scopes need review, and how long that takes.</p>
    <div class="panel flow" style="padding:12px"><svg viewBox="0 0 900 170" role="img" aria-label="Developer registers OAuth app with provider; end users consent through it; tokens let the agent act">
      <rect x="10" y="40" width="190" height="70" rx="10"/><text x="105" y="70" text-anchor="middle" font-weight="600">You (developer)</text><text x="105" y="90" text-anchor="middle" class="sub">build the agent</text>
      <rect class="acc" x="260" y="40" width="200" height="70" rx="10" stroke-width="2"/><text x="360" y="68" text-anchor="middle" font-weight="600">Provider OAuth app</text><text x="360" y="88" text-anchor="middle" class="sub">client ID · scopes · redirect URIs</text>
      <rect x="520" y="40" width="170" height="70" rx="10"/><text x="605" y="70" text-anchor="middle" font-weight="600">Your users</text><text x="605" y="90" text-anchor="middle" class="sub">approve on consent screen</text>
      <rect x="740" y="40" width="150" height="70" rx="10"/><text x="815" y="70" text-anchor="middle" font-weight="600">Connections</text><text x="815" y="90" text-anchor="middle" class="sub">tokens per user</text>
      <path d="M200 75 H258"/><path d="M460 75 H518"/><path d="M690 75 H738"/>
      <text x="229" y="66" text-anchor="middle" class="sub">register</text><text x="489" y="66" text-anchor="middle" class="sub">consent</text><text x="714" y="66" text-anchor="middle" class="sub">tokens</text>
      <text x="360" y="140" text-anchor="middle" class="sub">The gate: verification / review / partner approval decides who can pass through here, and when.</text>
    </svg></div>
    <div class="callout info"><b>Managed vs. bring your own.</b> Composio's directory (captured ${esc(DATA.directory.captured)}) lists ${DATA.directory.counts.managed} OAuth toolkits where Composio supplies the app, and ${DATA.directory.counts.byo} where the developer must register their own. Managed apps get you building today; your own app is needed for your brand on the consent screen, custom scopes, or your own rate-limit quota. So we prioritized (1) bring-your-own apps, where there's no fallback, and (2) managed apps where the production path is long (Google restricted scopes, Slack Marketplace), because that's where developers get surprised.</div>
  </section>

  <section class="block"><h2>Product decisions</h2>
    <ul class="list" style="max-width:76ch">
      <li><b>Two clocks, not one estimate.</b> "15 minutes" and "8 weeks" are both true for Gmail. Every guide separates time to a first working token from time until real users can connect, and splits the second into your work vs. waiting on the provider.</li>
      <li><b>Paths before steps.</b> Requirements change with who connects (own workspace, a few pilot customers, public). Each guide names the paths so you don't over- or under-prepare.</li>
      <li><b>Agent vs. you on every step.</b> Agents can research, draft privacy policies, scope justifications and demo scripts, generate config and verify redirect URIs. Signing in, accepting terms, paying, verifying a domain and pressing submit stay with you.</li>
      <li><b>Evidence on every claim that matters.</b> Gotchas link to sources; each source is marked verified, reported, or uncertain; open questions are listed instead of hidden.</li>
      <li><b>Generated guides look the same but say what they are.</b> Live guides carry an AI-generated banner, a confidence level, and say whether the agent could browse.</li>
      <li><b>One difficulty rubric.</b> 1 Instant (no review ever) · 2 Easy (optional listing review) · 3 Moderate (predictable verification, days) · 4 Hard (security assessment, multi-week review, hard caps) · 5 Gated (partner program, sales, or paid tier just to get access).</li>
    </ul>
  </section>

  <section class="block"><h2>How the library was built</h2>
    <ol class="list" style="max-width:76ch">
      <li><b>Four research agents in parallel</b>, three apps each, chosen to cover the range: instant (GitHub), self-serve with caveats (Notion, LinkedIn basics, X), verification (Outlook, Salesforce), marketplace or security review (Slack, Zoom, Shopify, Gmail), and paid or partner gates (Xero, DocuSign). They read official docs first and labeled community-sourced numbers.</li>
      <li><b>An adversarial fact-checker agent</b> re-checked ${V.length} high-impact claims against primary sources and edited the guides: ${c.confirmed || 0} confirmed, ${c.corrected || 0} corrected, ${c.unverifiable || 0} unverifiable.</li>
      <li><b>Live setup probes.</b> We requested each provider's real authorize endpoint with an invalid client ID from a real browser (no accounts created, no credentials) to confirm endpoints and capture the exact errors.</li>
      <li><b>Live generation</b> runs the same research brief as one agent with tools: Composio directory lookup, library lookup, web search, page reading, and the endpoint probe.</li>
    </ol>
    <div class="conf"><span class="st-verified">● ${evc.verified || 0} evidence items verified</span><span class="st-reported">● ${evc.reported || 0} reported</span><span class="st-uncertain">● ${evc.uncertain || 0} uncertain</span><span class="muted">across ${allEv.length} sources in ${Object.keys(LIB).length} guides</span></div>
  </section>

  <section class="block"><h2>What the fact-checker changed</h2>
    <div class="panel table-wrap"><table><thead><tr><th>App</th><th>Claim</th><th>Verdict</th></tr></thead><tbody>
    ${V.slice().sort((a, b) => (a.verdict === "corrected" ? -1 : 0) - (b.verdict === "corrected" ? -1 : 0)).map(v => `<tr><td>${esc(LIB[v.app]?.name.replace(/\s*\(.*\)$/, "") || v.app)}</td><td>${esc(v.claim)}${v.verdict === "corrected" ? `<div class="small muted"><b>Before:</b> ${esc(v.before)}<br><b>After:</b> ${esc(v.after)}</div>` : ""}</td><td class="${v.verdict === "confirmed" ? "st-verified" : "st-reported"}"><b>${esc(v.verdict)}</b>${(v.sources || []).filter(safeUrl).slice(0, 2).map((s, i) => ` <a class="small" href="${esc(s)}" target="_blank" rel="noopener">src${i + 1}</a>`).join("")}</td></tr>`).join("")}
    </tbody></table></div>
  </section>

  <section class="block"><h2>Live endpoint probes (${esc(probes[0]?.date || "")})</h2>
    <div class="panel table-wrap"><table><thead><tr><th>App</th><th>Probe</th><th>Provider returned</th><th>Outcome</th></tr></thead><tbody>
    ${probes.map(p => `<tr><td>${esc(p.app)}</td><td>${esc(p.what)}</td><td><code>${esc(p.result)}</code></td><td>${esc(p.outcome)}</td></tr>`).join("")}</tbody></table></div>
  </section>

  <section class="block"><h2>Limitations</h2>
    <ul class="list" style="max-width:76ch">
      <li>No provider apps were created or submitted for review: that needs accounts, terms acceptance and sometimes payment, which stay with a human. Probes confirm endpoints and errors, not approval outcomes.</li>
      <li>Review wait times are mostly community-reported; providers rarely publish SLAs. They're given as ranges with the source type marked.</li>
      <li>Policies move fast (Slack, X, Xero, Salesforce and Notion all changed materially in 2025–2026). Every guide shows its check date and has a re-check button.</li>
      <li>Some provider docs render only with JavaScript (Xero, DocuSign) and parts came from official blogs and staff posts instead; those items are marked.</li>
      <li>Live guides are researched in one pass by one agent and are not human-reviewed; they carry a banner and a confidence level.</li>
    </ul>
  </section>`;
}

// ---------- boot
let envReady;
async function boot() {
  envReady = (async () => { try { const r = await fetch("api/health"); if (r.ok) { const h = await r.json(); ENV.kind = "server"; ENV.live = !!h.live; } } catch {} })();
  route();
  await envReady;
  await loadGenerated();
  if (location.hash === "#new") viewNew();
}
boot();
})();
</script>
