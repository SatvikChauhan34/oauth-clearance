<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="OAuth app setup and approval guides for developers building AI agents."><title>OAuth Clearance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a permit office. Library = departures board of apps; each guide opens on a "clearance ticket" (two clocks), then the flight plan (steps), then the evidence file. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#eceef2; --ink:#141a24; --muted:#586273; --faint:#8a93a3; --line:#dde1e8;
  --accent:#1d3fc4; --accent-ink:#ffffff; --accent-soft:#e6ebfb;
  --d1:#1f9d6b; --d2:#2f7fc0; --d3:#b08c00; --d4:#cc3340; --d5:#8e44c2;
  --ok:#1f8a5b; --warn:#a86b00; --bad:#c22f3c;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1217; --surface:#171b22; --sunk:#1d222b; --ink:#e7eaf0; --muted:#a2abba; --faint:#6f7888; --line:#2a303b;
  --accent:#8ea6ff; --accent-ink:#0f1217; --accent-soft:#1f2740;
  --d1:#2ea677; --d2:#4a8fd4; --d3:#b8931f; --d4:#e2585f; --d5:#ad6be0;
  --ok:#3dbb84; --warn:#d9a03a; --bad:#ef6b73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#171b22; --sunk:#1d222b; --ink:#e7eaf0; --muted:#a2abba; --faint:#6f7888; --line:#2a303b;
  --accent:#8ea6ff; --accent-ink:#0f1217; --accent-soft:#1f2740;
  --d1:#2ea677; --d2:#4a8fd4; --d3:#b8931f; --d4:#e2585f; --d5:#ad6be0;
  --ok:#3dbb84; --warn:#d9a03a; --bad:#ef6b73; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;overflow-wrap:break-word}
.step,.gotcha,.callout,.path,.clock{overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent);overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.12;margin:0}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px}
.skip:focus{left:16px}
/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none}
.brand .stamp{width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;transform:rotate(-8deg)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--sunk);color:var(--ink)}
main{padding-block:28px 64px}
/* generic */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.diff{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.meter{display:inline-flex;gap:2px}
.meter i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.grid{display:grid;gap:16px}
section.block{display:grid;gap:14px;margin-top:36px}
section.block > *, .content > section > *, main > section > *{min-width:0}
section.block, .content, .content > section, main > section{grid-template-columns:minmax(0,1fr)}
.lead{font-size:17px;color:var(--muted);max-width:62ch}
/* lookup */
.lookup{display:flex;gap:8px;margin-top:20px;max-width:680px}
.lookup input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tries{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tries button{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:3px 10px;font-size:13px}
/* chart */
.chart-wrap{overflow-x:auto;padding:16px 16px 8px}
.chart-wrap svg{display:block;min-width:640px;width:100%}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .name{fill:var(--ink);font-family:var(--f-body);font-size:12.5px;font-weight:500}
.chart .row:hover .hit{fill:var(--sunk)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:fixed;pointer-events:none;z-index:20;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 10px;border-radius:8px;max-width:280px;line-height:1.4}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:grid;gap:10px;align-content:start;padding:16px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.card:hover{border-color:var(--faint)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:17px}
.card .clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px}
.card .clocks b{display:block;font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--ink)}
.card .verdict{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* catalog */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td .btn{padding:4px 10px;font-size:13px}
.status-ready{color:var(--ok);font-weight:600}
.status-gen{color:var(--accent);font-weight:600}
/* ticket */
.ticket{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket .main{padding:24px;display:grid;gap:14px;align-content:start}
.ticket .stub{padding:24px;border-left:2px dashed var(--line);background:var(--sunk);display:grid;gap:16px;align-content:start;position:relative}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .stub::before{top:-11px}.ticket .stub::after{bottom:-11px}
.clock{display:grid;gap:2px}
.clock .v{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.clock .s{font-size:13px;color:var(--muted)}
.split{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.split span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.verdict-big{font-size:17px;max-width:62ch}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.callout.info{background:var(--accent-soft);border-color:transparent}
.guide-actions{display:flex;gap:8px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;margin-top:28px}
.toc{position:sticky;top:76px;align-self:start;display:grid;gap:2px;font-size:13.5px}
.toc a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px}
.toc a:hover{background:var(--sunk);color:var(--ink)}
.content{display:grid;gap:36px;min-width:0}
.content > section{display:grid;gap:14px;scroll-margin-top:76px}
/* paths */
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.path{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:6px;align-content:start;font-size:14px}
/* steps */
.phase{display:grid;gap:8px}
.phase-h{display:flex;align-items:center;gap:10px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.step input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.step.done{opacity:.6}
.step.done .st{text-decoration:line-through}
.step .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.step .meta .chip{white-space:normal;max-width:100%}
.owner-agent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.owner-human{color:var(--ink);border-color:var(--faint)}
.wait{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
/* two col lists */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{margin:0;padding-left:18px;display:grid;gap:6px}
.gotcha{border-left:3px solid var(--line);padding:4px 0 4px 14px;display:grid;gap:4px}
.gotcha.high{border-color:var(--bad)}.gotcha.medium{border-color:var(--warn)}.gotcha.low{border-color:var(--faint)}
.sev{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.sev.high{color:var(--bad)}.sev.medium{color:var(--warn)}.sev.low{color:var(--muted)}
.ev-ref{font-family:var(--f-mono);font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.st-verified{color:var(--ok)} .st-reported{color:var(--warn)} .st-uncertain{color:var(--bad)}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:target{background:var(--accent-soft)}
.conf{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
/* generator */
.gen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.log{font-family:var(--f-mono);font-size:12.5px;display:grid;gap:6px;max-height:420px;overflow:auto;padding:14px}
.log div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px}
.log .t{color:var(--faint)}
.log .k-tool{color:var(--accent)} .log .k-err{color:var(--bad)} .log .k-ok{color:var(--ok)}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--sunk);font-size:13.5px}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;flex:none;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
/* method */
.flow{overflow-x:auto}
.flow svg{min-width:640px;width:100%;display:block}
.flow text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.flow .sub{fill:var(--muted);font-size:11.5px}
.flow rect{fill:var(--surface);stroke:var(--line)}
.flow .acc{stroke:var(--accent)}
.flow path{stroke:var(--faint);fill:none;stroke-width:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30}
@media (max-width:860px){
  .ticket{grid-template-columns:minmax(0,1fr)}
  .ticket .stub{border-left:0;border-top:2px dashed var(--line)}
  .ticket .stub::before,.ticket .stub::after{display:none}
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  nav.tabs{margin-left:0;width:100%}
  nav.tabs a{padding:6px 10px;font-size:14px}
  .clock .v{font-size:22px}
  .twocol,.gen{grid-template-columns:minmax(0,1fr)}
  dl.kv{grid-template-columns:minmax(0,1fr)}
  dl.kv dt{margin-top:6px}
}

<script>
const DATA = {"guides": {"docusign": {"slug": "docusign", "name": "Docusign (eSignature REST API)", "provider": "Docusign", "website": "https://developers.docusign.com", "category": "E-signature", "composio_managed": false, "verdict": "Building against the free demo environment takes minutes. A single integration key that many customers authorise counts as a Public integration, and Docusign staff confirm going live with one needs Docusign Partner Program membership (reportedly ≥20 employees and ≥1 year old) plus a production account whose plan supports key promotion. Small teams should plan on Bring-Your-Own-Key, where each customer creates and goes live with their own key.", "difficulty": {"score": 5, "label": "Gated", "rationale": "The demo key is instant. The Oct 2025 Go-Live flow dropped the 20-API-call rule and often approves instantly or within ~48 h. But a multi-tenant public integration needs Partner Program membership (with company-size criteria) and a production plan that allows key promotion. Self-serve Business Pro accounts have been refused, and sales has pointed to custom plans."}, "timeline": {"first_token": {"estimate": "10–20 min", "note": "Free developer account, create an app and integration key in Apps and Keys, add a redirect URI and secret, then authorise against account-d.docusign.com"}, "production": {"estimate": "Private (own company): same day to 2 days. Public multi-tenant: several weeks to months, or not possible for small companies.", "active_effort": "1–3 days (production account purchase, Go-Live form, partner onboarding materials, video)", "waiting": "Go-Live check: instant or ≤48 h if flagged. Partner Program onboarding and App Review (GTM materials, video): weeks, with community reports of applications pending for weeks.", "note": "Driven by integration type classification, Partner Program eligibility, and whether your production account plan supports promoting a key."}}, "cost": "Developer account free. Production account needed to promote a key. Developer API plans: Starter $50/mo (40 envelopes/mo), Intermediate $300/mo, Advanced $480/mo, Enhanced custom. Docusign staff say Go-Live itself has no fee. Partner Program terms and any fees are not published.", "paths": [{"name": "Private custom integration (your own company's account)", "who_for": "Internal tools or an agent acting only within your own Docusign account and users", "review": "Automated Go-Live eligibility check; may be flagged for review (≤48 h)", "limits": "Intended for your own employees and users. Not for many separate customer accounts authorising one key."}, {"name": "Public integration (one key, many customer accounts)", "who_for": "Multi-tenant AI agent SaaS where each customer connects their own Docusign account", "review": "Go-Live check plus Partner Program onboarding and App Review (info collection, GTM materials, video review)", "limits": "Requires Docusign Partner Program membership (staff-confirmed). Applications from companies with <20 employees have been rejected. Integration type can't be changed once in review or live without contacting Support."}, {"name": "Bring Your Own Key (BYOK)", "who_for": "Small vendors who can't join the Partner Program", "review": "Each customer runs Go-Live for their own key as a private custom integration in their own production account", "limits": "Each customer must create an integration key in their Docusign account, add your redirect URI, complete Go-Live, and paste the key and secret into your app. Heavy onboarding friction. Accounts are limited to 100 integration keys."}], "prerequisites": [{"item": "Free Docusign developer account (demo environment)", "owner": "human", "note": "Signup at developers.docusign.com; admin at apps-d.docusign.com"}, {"item": "HTTPS redirect URI", "owner": "agent", "note": "Registered on the integration key"}, {"item": "Privacy policy and terms of service URLs", "owner": "human", "note": "Requested during Go-Live (community)"}, {"item": "Paid production Docusign account on a plan that supports promoting integration keys", "owner": "human", "note": "Needed for Go-Live. Plan eligibility varies and has been case by case."}, {"item": "Docusign Partner Program membership (public integrations only)", "owner": "human", "note": "Apply via the Partner Portal; an onboarding rep starts App Review"}, {"item": "RSA key pair (JWT Grant only)", "owner": "agent", "note": "Generated in Apps and Keys"}], "steps": [{"phase": "Register", "title": "Create a developer account and integration key", "detail": "Sign up for a free developer account, then go to Admin (apps-d.docusign.com) > Integrations > Apps and Keys > Add App and Integration Key. Name the app. Copy the Integration Key (client_id) and API Account ID.", "owner": "human", "time": "10 min", "url": "https://prismatic.io/docs/components/docusign.md"}, {"phase": "Configure", "title": "Configure authentication", "detail": "For an agent backend with a user present: Authorization Code Grant, answering that the app can securely store a client secret, then Add Secret Key (shown once). For a public client: Auth Code with PKCE. Add Redirect URIs. For background or agent-without-user flows: JWT Grant. Generate an RSA keypair, request scopes 'signature impersonation', and get one-time consent per user (or admin consent for an org).", "owner": "agent", "time": "15 min", "url": "https://www.docusign.com/blog/demystifying-docusign-authentication"}, {"phase": "Test", "title": "Get a demo token", "detail": "Send the user to https://account-d.docusign.com/oauth/auth?response_type=code&scope=signature%20extended&client_id=...&redirect_uri=...&state=.... POST to https://account-d.docusign.com/oauth/token (Basic auth with integration_key:secret). The access token's expires_in is 28800 (8 h), and the refresh token lasts 30 days. Include 'extended' so each refresh extends refresh-token life by 30 days.", "owner": "agent", "time": "15 min", "url": "https://www.docusign.com/blog/developers/authorization-code-grant-refresh-tokens"}, {"phase": "Test", "title": "Look up account and base URI", "detail": "GET https://account-d.docusign.com/oauth/userinfo. From accounts[], pick is_default (or let the user choose by account_name) and store account_id and base_uri. Call {base_uri}/restapi/v2.1/accounts/{account_id}/.... Don't hardcode demo.docusign.net; production base URIs vary by region (na2, na3, eu, au...).", "owner": "agent", "time": "15 min", "url": "https://docusign.com/blog/developers/the-trenches-making-api-calls-members-multiple-accounts"}, {"phase": "Review", "title": "Decide integration type (private vs public vs BYOK)", "detail": "If many separate customers will authorise YOUR key, it's Public and needs Partner Program membership. Apply via the Partner Portal, tell the onboarding rep you built an ISV integration and want App Review, and review the ISV connector implementation guide. If you can't qualify, use BYOK.", "owner": "human", "time": "1–2 h", "wait": "Partner onboarding: weeks (reported)", "url": "https://community.docusign.com/go-live-70/go-live-for-a-public-integration-when-every-customer-uses-their-own-docusign-account-27596"}, {"phase": "Review", "title": "Run Go-Live in Apps and Keys", "detail": "Apps and Keys > your integration > Edit > select integration type, then enter credentials for the production account to promote to. The eligibility validation runs and returns Approved (usually immediate), Needs review (follow the shown steps; typically ≤48 h), or Not allowed (the plan doesn't support that type). The old 20 successful demo API calls requirement was removed in Oct 2025.", "owner": "human", "time": "15 min", "wait": "Instant to ~48 h", "url": "https://community.docusign.com/go-live-70/no-more-20-api-calls-introducing-the-streamlined-integration-go-live-experience-in-apps-keys-25623"}, {"phase": "Launch", "title": "Reconfigure for production", "detail": "In the PRODUCTION account's Apps and Keys, add a new secret key and RSA keypair (demo ones don't carry over, per community reports) and re-add redirect URIs. Switch auth to https://account.docusign.com/oauth/auth and /oauth/token, and userinfo to https://account.docusign.com/oauth/userinfo. Users must re-authenticate; JWT users must re-consent in production.", "owner": "both", "time": "30 min", "url": "https://community.docusign.com/go-live-70/need-guidance-moving-docusign-integration-from-developer-demo-to-production-after-purchasing-developer-starter-plan-26739"}], "review": {"required": "always", "trigger": "Any production use needs Go-Live (promoting the integration key from the demo account to a production account). A Public integration adds Partner Program membership and App Review.", "process": "Since Oct 2025: in Apps and Keys select the integration type and production account. Automated eligibility validation then instantly approves, flags for review, or disallows. Public integrations go through Partner Program onboarding (info collection, GTM materials, video review), described by Docusign as 'not a certification or exam'.", "typical_wait": "Go-Live: instant in most cases, ≤48 h if flagged. Partner onboarding: weeks, with reports of applications pending for weeks with no reply.", "reviewers_check": ["Integration type matches use (private = own employees; public = many customers)", "Production account plan supports the selected integration type", "Partner Program membership for public integrations", "For partner App Review: GTM materials and a video demo of the integration", "OAuth configured correctly with redirect URIs, privacy and terms URLs (community)"], "common_rejections": ["'Your account doesn't support promoting an integration key to production' (Business Pro or self-serve plans; sales points to custom plans)", "Partner Program application rejected because the company has fewer than 20 employees", "Wrong integration type selected; can't be changed once in review without Support", "Production account doesn't appear in Go-Live (plan doesn't support the type)"]}, "pre_approval_limits": ["Integration keys created in the developer account work only against the demo environment (account-d.docusign.com, demo.docusign.net); demo envelopes aren't legally binding", "No real customer accounts can authorise a non-promoted key", "Each Docusign account is limited to 100 integration keys"], "oauth": {"authorize_url": "https://account.docusign.com/oauth/auth (demo: https://account-d.docusign.com/oauth/auth)", "token_url": "https://account.docusign.com/oauth/token (demo: https://account-d.docusign.com/oauth/token)", "pkce": "supported", "refresh_tokens": "Authorization Code Grant: refresh token valid 30 days. With the 'extended' scope, each use extends it by 30 days. Unused for 30 days means full re-auth, and a never-expiring refresh token isn't available. JWT Grant issues no refresh token; mint a new JWT assertion each hour.", "access_token_lifetime": "Auth Code Grant: 8 hours (expires_in 28800). JWT Grant: 1 hour.", "redirect_uri_rules": "Must be registered on the integration key and match. Production redirect URIs and secrets are configured on the promoted key in the production account.", "scopes": "eSignature: 'signature' (plus 'extended' for long-lived refresh). JWT adds 'impersonation' and needs user consent once (individual consent URL) or organization admin consent with a claimed domain. Other APIs (Navigator, Maestro, Admin, Rooms, Click) have their own scopes.", "tenant_notes": "One user can belong to several Docusign accounts across regions. After auth, call /oauth/userinfo, choose the account (is_default or user choice), and store account_id plus base_uri; API calls go to {base_uri}/restapi/v2.1/accounts/{account_id}. Demo and production are completely separate identity systems."}, "gotchas": [{"title": "Multi-tenant = Public integration = Partner Program required", "detail": "Docusign staff (Aug 2026): one key authorised by multiple separate customers is Public, and Partner Program membership is required even without reselling or embedded signing. Small companies (<20 employees) have been rejected and pointed to BYOK.", "severity": "high", "evidence": ["e3", "e4"]}, {"title": "Production account plan may not support key promotion", "detail": "A developer who bought Business Pro after Docusign Support said it was enough got 'Your account doesn't support promoting an integration key to production', and sales pointed to a custom enterprise plan (Jul 2026).", "severity": "high", "evidence": ["e5"]}, {"title": "The 20-API-call rule is gone", "detail": "Many guides still say you need 20 successful demo calls (and a 30-day window). Docusign replaced this in Oct 2025 with instant eligibility validation in Apps and Keys.", "severity": "medium", "evidence": ["e1"]}, {"title": "Integration type is locked once in review or live", "detail": "Choosing the wrong type means contacting Customer Support; you can't cancel the review to change type.", "severity": "medium", "evidence": ["e1"]}, {"title": "Hardcoded base URIs break in production", "detail": "Production accounts live on regional hosts. Always use userinfo base_uri per account.", "severity": "medium", "evidence": ["e6", "e7"]}, {"title": "Refresh tokens die after 30 days idle", "detail": "Without 'extended', and even with it if unused for 30 days, agents need a scheduled refresh or users must reconnect.", "severity": "medium", "evidence": ["e8", "e9"]}, {"title": "JWT impersonation needs per-user consent", "detail": "Background agents using JWT must get each impersonated user (or an org admin with a claimed domain) to grant consent once. Otherwise token requests fail with consent_required.", "severity": "medium", "evidence": ["e10"]}], "blockers": [{"symptom": "'Your account doesn't support promoting an integration key to production'", "cause": "Production account plan doesn't allow key promotion for the chosen type", "fix": "Contact Docusign sales for a plan that supports it (reportedly custom/enterprise), or switch to BYOK"}, {"symptom": "Go-Live result 'Not allowed' / no production account listed", "cause": "Plan doesn't support the selected integration type", "fix": "Upgrade the plan or choose the correct type; contact Developer Support"}, {"symptom": "Partner Program application rejected", "cause": "Eligibility criteria (reported: ≥20 employees, ≥1 year in business)", "fix": "Use BYOK until eligible"}, {"symptom": "consent_required on JWT token request", "cause": "User hasn't granted consent for signature+impersonation", "fix": "Send the user through the consent URL (Auth Code flow) once, or get admin consent"}, {"symptom": "invalid_grant on refresh", "cause": "Refresh token unused for 30+ days, or using a demo key against production", "fix": "Re-run Auth Code flow; request 'extended'; confirm environment"}, {"symptom": "USER_AUTHENTICATION_FAILED / wrong account errors in production", "cause": "Using demo base URI or account ID", "fix": "Re-fetch userinfo from account.docusign.com and use its base_uri and account_id"}], "agent_vs_human": {"agent_can": ["generate auth code and JWT flows, consent URLs and RSA key handling", "implement userinfo account/base_uri selection", "draft Go-Live and partner application text and GTM materials", "build a BYOK onboarding flow (per-tenant key and secret storage, instructions for customer admins)", "write the demo video script"], "human_must": ["create the developer account", "purchase a production account or negotiate a plan with sales", "apply to the Partner Program and meet with the onboarding rep", "record the review video", "enter production credentials in Go-Live", "give consent for JWT impersonation", "for BYOK, each customer admin creates and promotes their own key"]}, "evidence": [{"id": "e1", "claim": "Oct 2025: 20-call requirement removed; Go-Live = select type + production account, instant/flagged (≤48h)/not allowed; public needs Partner Program; type locked", "source": "https://community.docusign.com/go-live-70/no-more-20-api-calls-introducing-the-streamlined-integration-go-live-experience-in-apps-keys-25623", "type": "community", "status": "verified", "note": "Docusign employee post, Oct 3, 2025 | Staff post by Docusign Employee, Oct 3 2025"}, {"id": "e2", "claim": "Go-Live docs page last modified 2026-10-14", "source": "https://developers.docusign.com/docs/esign-rest-api/go-live/", "type": "official_docs", "status": "uncertain", "note": "JS-rendered; body could not be read"}, {"id": "e3", "claim": "One key used by multiple customers is Public; Partner Program membership required; alternative BYOK", "source": "https://community.docusign.com/go-live-70/go-live-for-a-public-integration-when-every-customer-uses-their-own-docusign-account-27596", "type": "community", "status": "verified", "note": "Docusign employee reply, Aug 31, 2026 | Docusign Employee reply Aug 31 2026: \"partner Program membership is required to launch a public integration\""}, {"id": "e4", "claim": "Partner application rejected for <20 employees; Support recommends BYOK", "source": "https://community.docusign.com/go-live-70/go-live-path-for-a-public-integration-from-an-isv-with-under-20-employees-27679", "type": "community", "status": "reported", "note": "Sep 4–5, 2026"}, {"id": "e5", "claim": "Business Pro couldn't promote key; sales says custom enterprise plan; conflicting Support guidance", "source": "https://community.docusign.com/go-live-70/go-live-eligibility-question-isv-connector-public-integration-for-a-small-isv-27321", "type": "community", "status": "reported", "note": "Your account doesn't support promoting an integration key to production"}, {"id": "e6", "claim": "Demo vs production auth/token/userinfo URLs; Auth Code + PKCE preferred; JWT needs one-time consent", "source": "https://www.docusign.com/blog/demystifying-docusign-authentication", "type": "official_docs", "status": "verified", "note": "Docusign developer blog"}, {"id": "e7", "claim": "userinfo accounts[] with account_id, is_default, base_uri; append /restapi", "source": "https://docusign.com/blog/developers/the-trenches-making-api-calls-members-multiple-accounts", "type": "official_docs", "status": "verified", "note": "Docusign developer blog"}, {"id": "e8", "claim": "Auth code access token 8h (28800s); refresh token 30 days; extended scope adds 30 days per use", "source": "https://www.docusign.com/blog/developers/authorization-code-grant-refresh-tokens", "type": "official_docs", "status": "verified", "note": "eight-hour lifespan"}, {"id": "e9", "claim": "Non-expiring refresh tokens not available; must use within 30 days", "source": "https://community.docusign.com/esignature-api-63/refresh-token-expiry-5298", "type": "community", "status": "verified", "note": "Docusign staff, June 2024"}, {"id": "e10", "claim": "JWT: RSA keypair, signature+impersonation scopes, one-time consent, 1h token", "source": "https://www.docusign.com/blog/developers/the-trenches-authenticate-without-user-interaction-system-user", "type": "official_docs", "status": "verified", "note": "one-time manual step"}, {"id": "e11", "claim": "Partner onboarding: join program, rep sets up portal, App Review with GTM materials and video", "source": "https://community.docusign.com/go-live-70/partner-program-next-steps-26615", "type": "community", "status": "reported", "note": "Docusign employee, Mar 11, 2026; applicant waited weeks"}, {"id": "e12", "claim": "Go-Live has no fees", "source": "https://community.docusign.com/go-live-70/if-i-register-as-an-isv-partner-i-won-t-need-to-pay-any-additional-fees-to-go-live-with-the-app-in-production-right-21569", "type": "community", "status": "reported", "note": "Docusign employee, Nov 2024"}, {"id": "e13", "claim": "Developer API plan prices and envelope limits", "source": "https://ecom.docusign.com/plans/developer", "type": "official_docs", "status": "verified", "note": "Starter $50/mo, 40 envelopes/mo"}, {"id": "e14", "claim": "Accounts limited to 100 integration keys; per-customer keys for multi-instance", "source": "https://www.docusign.com/blog/developers/integration-keys-explained-a-practical-guide-for-isvs", "type": "official_docs", "status": "verified", "note": "Docusign developer blog"}, {"id": "e15", "claim": "Apps and Keys setup steps; demo-only before Go-Live (older 20-call note superseded)", "source": "https://prismatic.io/docs/components/docusign.md", "type": "community", "status": "reported", "note": "Vendor doc still cites 20 calls"}], "uncertain": ["Official Partner Program eligibility (≥20 employees, ≥1 year) is only reported by applicants and wasn't seen on an official page", "Which production plans can promote a key for private vs public types; Docusign Support and sales gave conflicting answers in 2026", "Partner Program fees, if any, and App Review duration", "Whether the Developer API Starter plan ($50/mo) supports key promotion for public integrations", "Official go-live, after-go-live and Developer FAQ pages are JS-rendered and couldn't be read; details rely on Docusign-staff community posts and the Docusign blog", "Whether demo secrets and RSA keys must be regenerated in production (commonly stated; not verified on an official page)"], "last_checked": "2026-10-30", "probes": [{"what": "Demo authorize (account-d.docusign.com) with fake integration key", "result": "'Something went wrong — The client id provided is not registered with Docusign.'", "outcome": "confirmed", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}], "aliases": ["Docusign eSignature"]}, "github": {"slug": "github", "name": "GitHub", "provider": "GitHub (Microsoft)", "website": "https://github.com/settings/apps", "category": "Developer Tools", "composio_managed": true, "verdict": "Register a GitHub App (not an OAuth App) set to 'Any account' and you're production-ready in under an hour, with no review. Before customers can use it in their orgs, an org owner must install it, so build that request step into your onboarding.", "difficulty": {"score": 1, "label": "Instant", "rationale": "Neither GitHub Apps nor OAuth Apps go through any review. Any GitHub user can authorize as soon as the app is created. Marketplace listing is optional and only required to sell through GitHub. The real friction is per-customer: org owners must install GitHub Apps or approve OAuth Apps, and SAML SSO orgs need an active SSO session."}, "timeline": {"first_token": {"estimate": "10-20 min", "note": "Go to Settings > Developer settings > GitHub Apps > New GitHub App, set the callback URL and permissions, generate a client secret, then run the web flow. You get a ghu_ user token right away."}, "production": {"estimate": "Same day", "active_effort": "2-6 hours (permissions design, private key handling, refresh logic, install flow UX)", "waiting": "None from GitHub. Per-customer waits happen while org owners approve installs. Optional Marketplace listing requires a publisher verification and listing review, with no published SLA.", "note": "The only gate is customer org policy: owners must install the GitHub App or approve the OAuth App. Optional Marketplace listing (and paid plans: verified publisher, 100 installs for GitHub Apps / 200 users for OAuth Apps)."}}, "cost": "Free. A Marketplace listing is free. Paid plans require a verified-publisher org and financial onboarding.", "paths": [{"name": "GitHub App (recommended for agents)", "who_for": "Agents that act on repos/orgs, need fine-grained permissions, webhooks, or bot-identity actions", "review": "none", "limits": "Org owners install the app and choose repositories. Installation tokens last 1h. User tokens last 8h with 6-month refresh tokens (expiry enabled by default). Rate limit for installation tokens is 5,000/h scaling to 12,500/h (15,000/h on GHEC)."}, {"name": "OAuth App", "who_for": "Simple 'act as the user' agents, or legacy integrations that need broad scopes such as repo", "review": "none", "limits": "Coarse scopes (repo = all private repos). Subject to org OAuth app access restrictions, which are on by default for new orgs. Shares the user's 5,000/h rate limit. Expiring tokens default on for new apps since Aug 2026."}, {"name": "GitHub Marketplace listing (optional)", "who_for": "Discoverability or selling through GitHub billing", "review": "Listing review by GitHub. Paid plans need publisher verification.", "limits": "Must be publicly available (no preview or invite-only). Must do more than authentication. Paid plans need 100 installs (GitHub App) or 200 users (OAuth App)."}], "prerequisites": [{"item": "A GitHub account; an organization account to own the app is recommended", "owner": "human", "note": "Org ownership is required for paid Marketplace plans and makes transfer and team management easier."}, {"item": "HTTPS callback URL (up to 10) and, optionally, a webhook URL with a secret", "owner": "agent", "note": "Loopback 127.0.0.1 with any port is allowed for native/CLI apps."}, {"item": "Secure storage for the app private key (.pem), client secret, user refresh tokens and installation IDs", "owner": "agent", "note": "The private key signs JWTs to mint installation tokens."}], "steps": [{"phase": "Prepare", "title": "Choose GitHub App vs OAuth App", "detail": "Choose a GitHub App when the agent needs fine-grained per-repo permissions, should act as its own bot (installation token), wants central webhooks, or must avoid OAuth app restrictions. Choose an OAuth App only if you need classic scopes and purely user-identity actions. A GitHub App user token can only do what both the user and the app are allowed to do.", "owner": "agent", "time": "15 min", "url": "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/differences-between-github-apps-and-oauth-apps"}, {"phase": "Register", "title": "Register the GitHub App", "detail": "Go to Settings (user or org) > Developer settings > GitHub Apps > New GitHub App. Fill in: GitHub App name (max 34 chars, globally unique), Homepage URL, Callback URL (up to 10), keep 'Expire user authorization tokens' checked, optionally 'Request user authorization (OAuth) during installation', and 'Enable Device Flow' for CLI agents. Optionally add a Setup URL (unavailable if you request OAuth during install). Add the Webhook URL and secret, or uncheck Active. Set Permissions to the minimum read/write needed. For 'Where can this GitHub App be installed?', choose **Any account**.", "owner": "human", "time": "15 min", "url": "https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/registering-a-github-app"}, {"phase": "Configure", "title": "Generate credentials", "detail": "On the app settings page, click Generate a new client secret and Generate a private key (.pem). Note the App ID and Client ID; the refresh call uses the Client ID, not the App ID.", "owner": "human", "time": "5 min"}, {"phase": "Configure", "title": "Implement user authorization (web or device flow)", "detail": "Web flow: GET https://github.com/login/oauth/authorize?client_id=...&redirect_uri=...&state=...&code_challenge=...&code_challenge_method=S256, then POST https://github.com/login/oauth/access_token. You get access_token (ghu_, 8h) and refresh_token (ghr_, 6 months). Refresh with grant_type=refresh_token. The device flow must be enabled first and needs no client secret.", "owner": "agent", "time": "1-2 h", "url": "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app"}, {"phase": "Configure", "title": "Implement installation flow and installation tokens", "detail": "Send users to https://github.com/apps/<slug>/installations/new. After install, store installation_id from the Setup URL query or the installation webhook. Mint 1-hour installation tokens by signing a JWT with the private key and calling POST /app/installations/{id}/access_tokens.", "owner": "agent", "time": "1-2 h"}, {"phase": "Test", "title": "Install on a test org and authorize a test user", "detail": "Install on a personal account and a test org. Check that the permission prompt is minimal, that refresh works, and how the 'Request' button behaves for a non-owner member.", "owner": "both", "time": "30 min"}, {"phase": "Launch", "title": "Ship; no review needed", "detail": "The app is usable by any GitHub account immediately. Document for customers that an org owner must install it (or approve the request). For SAML SSO orgs, users need an active SSO session when authorizing.", "owner": "human", "time": "-"}, {"phase": "Review", "title": "(Optional) Marketplace listing", "detail": "In app settings, go to Marketplace > list in GitHub Marketplace. You need a privacy policy, support link/email, logo and screenshots, and a pricing plan, and you accept the Marketplace Developer Agreement. For paid plans: an org-owned app, publisher verification (org 2FA, verified domain, support email), plan-change webhooks, and monthly and annual billing.", "owner": "human", "time": "0.5-2 days", "wait": "No SLA published", "url": "https://docs.github.com/en/apps/github-marketplace/creating-apps-for-github-marketplace/requirements-for-listing-an-app"}], "review": {"required": "never", "trigger": "No review to authorize users or install anywhere. Only an optional Marketplace listing is reviewed (paid plans additionally need publisher verification).", "process": "None for normal use. Marketplace: submit the listing, GitHub reviews it, and for paid listings the org requests publisher verification.", "typical_wait": "None for normal use. Marketplace review time is not published.", "reviewers_check": ["Marketplace only: valid privacy policy, support contact and working links", "App integrates with GitHub beyond authentication and is publicly available", "Paid: verified publisher org, purchase event handling, monthly and annual plans, install minimums"], "common_rejections": ["Marketplace: app in preview or invite-only", "Marketplace: listing that only does sign-in", "Marketplace: broken links or missing privacy policy"]}, "pre_approval_limits": ["No provider-side limits before 'approval'; there is no approval step", "Customer orgs: OAuth App access restrictions are enabled by default for new orgs. Members can request, and owners approve.", "Customer orgs: only org owners (or repo admins, for apps without org or repository-administration permissions) can install a GitHub App. Members get 'Request'.", "OAuth Apps: max 10 tokens per user/app/scope combination, and 10 new tokens per hour"], "oauth": {"authorize_url": "https://github.com/login/oauth/authorize (device flow: https://github.com/login/device/code)", "token_url": "https://github.com/login/oauth/access_token", "pkce": "supported", "refresh_tokens": "GitHub Apps: expiring user tokens on by default. Refresh tokens (ghr_) last 6 months and each refresh returns a new pair. OAuth Apps: expiring tokens opt-in via app setting or the offline_access scope, and on by default for new apps since 2026-08-14. Refresh token lasts 6 months.", "access_token_lifetime": "GitHub App user token 8h (28800s). Installation token 1h. OAuth App tokens are long-lived unless expiration is enabled (then 8h).", "redirect_uri_rules": "Up to 10 callback URLs for both GitHub Apps and, since Aug 2026, OAuth Apps. redirect_uri must match a registered callback, with no extra params. If omitted, GitHub uses the first callback. Wildcard (subdomain/subpath) matching can be set per URI; it is on by legacy default for apps with a single callback, so disable it if you don't need it. Loopback: port may differ, and 127.0.0.1 or ::1 are preferred over localhost. Mismatch error: redirect_uri_mismatch.", "scopes": "GitHub Apps use fine-grained permissions (none / read / read & write per resource), and the user token gets the intersection of app and user access. The scope field in the response is always empty. OAuth Apps use classic scopes (repo, read:org, workflow...), which are coarse. repo grants all private repos.", "tenant_notes": "One app serves all of github.com. GitHub Enterprise Server needs a separate app per instance (base URL https://<host>/login/oauth/...). For GHEC SAML SSO orgs, users need an active SSO session when authorizing and must reauthorize after SSO is enabled. GHEC-owned or approved apps get a 15,000/h rate limit."}, "gotchas": [{"title": "Org owners must approve before your agent sees org repos", "detail": "OAuth Apps: new orgs have OAuth App access restrictions on by default. Until an owner approves, a member's token can't reach org resources, and nothing errors at authorize time; org repos just don't show up. GitHub Apps: only owners (or repo admins, for narrowly-permissioned apps) can install, and members see 'Request'. Build an 'ask your org owner' step into onboarding.", "severity": "high", "evidence": ["e3", "e4"]}, {"title": "User tokens expire after 8h; refresh tokens after 6 months", "detail": "Agents running in the background must refresh. Each refresh rotates both tokens, so persist them atomically. If the refresh token lapses (no activity for 6 months), the user must re-authorize through the web or device flow.", "severity": "high", "evidence": ["e2", "e5"]}, {"title": "OAuth Apps changed in Aug 2026", "detail": "New OAuth Apps now issue expiring tokens (8h, 6-month refresh) by default. They can register up to 10 callback URLs and set wildcard matching per URI. Older SDKs that assume non-expiring gho_ tokens will break. Single-callback apps had implicit wildcard matching, which you should turn off.", "severity": "medium", "evidence": ["e6", "e5"]}, {"title": "Pick 'Any account' at registration", "detail": "'Only on this account' means nobody else can install your GitHub App. It's the most common reason for 'my customer can't find the install button'.", "severity": "medium", "evidence": ["e1"]}, {"title": "Rate limits differ by token type", "detail": "User tokens (OAuth or GitHub App) share the user's 5,000/h budget with their PATs and other apps. Installation tokens get 5,000/h scaling up to 12,500/h (15,000/h on GHEC). Agents doing heavy repo crawling should use installation tokens.", "severity": "medium", "evidence": ["e7"]}, {"title": "SAML SSO orgs", "detail": "Users must have an active SSO session when authorizing your app, and must reauthorize after the org enables SSO. Otherwise the app can't access that org.", "severity": "medium", "evidence": ["e8"]}, {"title": "GitHub Enterprise Server is a separate registration", "detail": "Customers on GHES need the app registered on their own instance (different base URLs). github.com apps don't work there.", "severity": "low", "evidence": ["e1"]}], "blockers": [{"symptom": "redirect_uri_mismatch", "cause": "redirect_uri isn't one of the registered callback URLs (or has extra query params)", "fix": "Add it under the app's Callback URL list (max 10), or remove extra params."}, {"symptom": "Agent can't see a user's org repos after successful OAuth", "cause": "OAuth App access restrictions (org) or the GitHub App isn't installed on that org/repo", "fix": "The user requests access, and an org owner approves it (OAuth App) or installs the GitHub App and selects repos."}, {"symptom": "401 Bad credentials after ~8h", "cause": "Expired ghu_ user token", "fix": "POST /login/oauth/access_token with grant_type=refresh_token, client_id (not the App ID) and client_secret, then store the new pair."}, {"symptom": "bad_refresh_token", "cause": "Refresh token already used (rotated) or expired after 6 months", "fix": "Re-run the web or device flow. Serialize refreshes per user."}, {"symptom": "Customer sees 'Request' instead of 'Install'", "cause": "Customer isn't an org owner", "fix": "The org owner approves the request from the notification."}], "agent_vs_human": {"agent_can": ["choose minimal permissions", "generate app manifest (GitHub App Manifest flow)", "implement web, device and installation-token flows", "implement JWT signing and token refresh", "verify callback URLs", "draft Marketplace listing, privacy policy and support docs"], "human_must": ["sign in / 2FA", "create the app (or approve the manifest flow)", "download and secure the private key", "accept the Marketplace Developer Agreement (if listing)", "verify the org domain and enable org 2FA for publisher verification", "be org owner to install on their own orgs"]}, "evidence": [{"id": "e1", "claim": "GitHub App registration fields: up to 10 callback URLs, expire tokens, device flow, Only on this account / Any account", "source": "https://docs.github.com/en/apps/creating-github-apps/registering-a-github-app/registering-a-github-app", "type": "official_docs", "status": "verified", "note": "\"You can enter up to 10 callback URLs.\""}, {"id": "e2", "claim": "User token 8h, refresh token 6 months; setting 'User-to-server token expiration'", "source": "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/refreshing-user-access-tokens", "type": "official_docs", "status": "verified", "note": "expires_in 28800; refresh_token_expires_in 15897600"}, {"id": "e3", "claim": "OAuth App access restrictions enabled by default for new orgs; members can request approval", "source": "https://docs.github.com/en/organizations/managing-oauth-access-to-your-organizations-data/about-oauth-app-access-restrictions", "type": "official_docs", "status": "verified", "note": "\"OAuth app access restrictions are enabled by default\""}, {"id": "e4", "claim": "Only org owners (or limited repo admins) install GitHub Apps; members trigger owner request", "source": "https://docs.github.com/en/apps/using-github-apps/installing-a-github-app-from-a-third-party", "type": "official_docs", "status": "verified", "note": "Buttons: Install / Install and request / Request"}, {"id": "e5", "claim": "OAuth App: PKCE S256 only, up to 10 tokens per user/app/scope, wildcard on single callback before Aug 3 2026, loopback port can differ", "source": "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps", "type": "official_docs", "status": "verified", "note": "\"plain code challenge method is not supported\""}, {"id": "e6", "claim": "Aug 14 2026: OAuth apps get up to 10 redirect URIs, expiring tokens default for new apps, offline_access, per-URI wildcard", "source": "https://github.blog/changelog/2026-08-14-multiple-redirect-uris-and-token-refresh-for-oauth-apps", "type": "official_docs", "status": "verified", "note": "Short-lived tokens on by default for new apps | Re-checked: \"Short-lived tokens are enabled by default for all new applications\""}, {"id": "e7", "claim": "Rate limits: user 5,000/h; installation 5,000 to 12,500/h; GHEC 15,000/h", "source": "https://docs.github.com/en/rest/using-the-rest-api/rate-limits-for-the-rest-api", "type": "official_docs", "status": "verified", "note": "\"cannot increase beyond 12,500 requests per hour\""}, {"id": "e8", "claim": "Active SSO session required to authorize OAuth/GitHub Apps for SSO orgs", "source": "https://docs.github.com/en/enterprise-cloud@latest/authentication/authenticating-with-single-sign-on/about-authentication-with-single-sign-on", "type": "official_docs", "status": "verified", "note": "\"You must have an active SSO session each time you authorize\""}, {"id": "e9", "claim": "GitHub App vs OAuth App differences (granular perms, installation token 1h, org policies don't apply to GitHub Apps)", "source": "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/differences-between-github-apps-and-oauth-apps", "type": "official_docs", "status": "verified", "note": "\"GitHub Apps aren't subject to organization application policies.\""}, {"id": "e10", "claim": "Marketplace listing requirements; paid needs verified publisher and 100 installs (GitHub App) / 200 users (OAuth App)", "source": "https://docs.github.com/en/apps/github-marketplace/creating-apps-for-github-marketplace/requirements-for-listing-an-app", "type": "official_docs", "status": "verified", "note": "Apps must be publicly available, not invite-only"}, {"id": "e11", "claim": "Publisher verification: org 2FA, verified domain, support email", "source": "https://docs.github.com/en/apps/github-marketplace/github-marketplace-overview/applying-for-publisher-verification-for-your-organization", "type": "official_docs", "status": "verified", "note": "\"Two-factor authentication is enabled for your organization.\""}, {"id": "e12", "claim": "OAuth App registration: up to 10 callback URLs; 100 OAuth apps per owner", "source": "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/creating-an-oauth-app", "type": "official_docs", "status": "verified", "note": "\"A user or organization can own up to 100 OAuth apps.\" | Re-checked: \"Expire user access tokens\" enabled by default"}, {"id": "e13", "claim": "User token PKCE S256, device flow must be enabled, ghu_/ghr_ prefixes, permissions intersection", "source": "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app", "type": "official_docs", "status": "verified", "note": "\"only has permissions that both the user and the app have\""}], "uncertain": ["Marketplace listing review duration is not published, and I found no reliable recent community data.", "Exact error string for an expired refresh token isn't documented on the refresh page (bad_refresh_token comes from general experience and isn't verified here).", "Whether GHES versions before 3.23 support the Aug 2026 OAuth App changes (multiple redirect URIs, expiring tokens). The changelog says they arrive in GHES 3.23.", "Whether the 'Expire user authorization tokens' default could change. Treat it as on by default but configurable."], "last_checked": "2026-10-30", "probes": [{"what": "Authorize endpoint with fake client_id while signed out", "result": "Redirects to github.com/login with return_to preserved; client_id is validated only after sign-in", "outcome": "partial", "date": "2026-10-30", "method": "Live browser request (no account created, no credentials used)"}], "aliases": ["GitHub App"]}, "gmail": {"slug": "gmail", "name": "Gmail (Google Workspace APIs)", "provider": "Google", "website": "https://developers.google.com/workspace/gmail/api", "category": "Email", "composio_managed": true, "verdict": "If your agent only needs to send mail, request gmail.send alone (sensitive scope: about 10 days of review, no security audit). Any read, draft or modify scope is restricted and adds a paid annual CASA assessment, so plan on 4–8+ weeks and start the review process on day one.", "difficulty": {"score": 4, "label": "Hard", "rationale": "Every useful read scope (gmail.readonly, gmail.modify, gmail.compose, gmail.metadata, https://mail.google.com/) is restricted. Restricted scopes need brand verification, a data-access review with a YouTube demo video, and an annual third-party CASA security assessment that you pay for. A send-only app (gmail.send is sensitive) is closer to a 3: Moderate."}, "timeline": {"first_token": {"estimate": "15–30 min", "note": "Create a project, configure Google Auth Platform (Branding, Audience = External, Testing), add yourself as a test user, create a Web OAuth client, and run the code flow. Users see an 'unverified app' screen and refresh tokens expire after 7 days."}, "production": {"estimate": "4–8+ weeks for restricted scopes; about 1–3 weeks for gmail.send only", "active_effort": "3–7 days (domain verification, privacy policy, demo video, justifications, CASA scan fixes and questionnaire)", "waiting": "Brand check: minutes, or 2–3 business days if escalated. Sensitive review: up to about 10 days. Restricted review plus CASA: several weeks, about 5–20 days for a well-prepared CASA alone.", "note": "Total time depends on (1) whether you request restricted scopes, (2) how many back-and-forth emails Trust & Safety sends (each pauses the clock), (3) how many SAST/DAST scan cycles you need before the CASA lab issues a Letter of Validation, and (4) whether your homepage, privacy policy and authorized domains are already compliant."}}, "cost": "Google verification is free. Restricted scopes need an annual CASA Tier 2 assessment paid to an authorized lab: community-reported $540–$1,000+ at the low end (TAC Security), with Tier 3 at several thousand dollars. You may also pay for a domain and hosting for the homepage and privacy policy.", "paths": [{"name": "Internal (Google Workspace org only)", "who_for": "Agents used only by people in your own Workspace or Cloud Identity organization", "review": "none. Set Audience user type to Internal; verification is not required regardless of scopes.", "limits": "Accounts outside the org get an org_internal error. Requires the GCP project to belong to a Google Cloud Organization."}, {"name": "External, Testing / unverified", "who_for": "Development, demos, design partners", "review": "none", "limits": "At most 100 test users, listed explicitly (lifetime quota, no reset). Refresh tokens and authorizations expire after 7 days. Users see the 'Google hasn't verified this app' warning."}, {"name": "External, In production + verified", "who_for": "Public multi-tenant agent products where any Gmail or Workspace user connects", "review": "Brand verification, then sensitive-scope review (gmail.send) or restricted-scope review plus annual CASA (read/modify scopes)", "limits": "Unlimited users after approval. Re-verification and CASA are required every 12 months. Adding a new scope requires supplementary review."}], "prerequisites": [{"item": "Google account with 2-Step Verification, and a Google Cloud project (ideally under a Cloud Organization)", "owner": "human", "note": "Add at least one more Owner/Editor so renewal emails are not missed."}, {"item": "A domain you own, with a public homepage describing the app (not behind login)", "owner": "human", "note": "The homepage must be on a verified authorized domain."}, {"item": "Privacy policy on the same domain, linked from the homepage, including the Google API Services User Data Policy / Limited Use disclosure and an AI/ML training statement", "owner": "agent", "note": "The agent can draft it; a human must publish and approve it."}, {"item": "Domain ownership verified in Google Search Console for every authorized domain (homepage, privacy policy, redirect URI hosts)", "owner": "human", "note": "Uses a DNS TXT or CNAME record."}, {"item": "Monitored support email and developer contact email (not a departed employee's mailbox)", "owner": "human", "note": "Use a Google Group or alias."}, {"item": "YouTube channel for an unlisted demo video", "owner": "human", "note": "Required for sensitive and restricted scope review."}, {"item": "Budget and owner for the CASA assessment (restricted scopes only)", "owner": "human", "note": "Annual and paid to the lab."}], "steps": [{"phase": "Prepare", "title": "Pick the narrowest Gmail scopes", "detail": "Map each agent feature to a scope. Send-only: https://www.googleapis.com/auth/gmail.send (sensitive). Labels only: gmail.labels (non-sensitive). Anything that reads message content or metadata, creates drafts, or modifies labels on messages (gmail.readonly, gmail.metadata, gmail.compose, gmail.modify, gmail.insert, gmail.settings.*, https://mail.google.com/) is restricted. Prefer gmail.readonly or gmail.modify over https://mail.google.com/ unless you need permanent delete or IMAP/SMTP.", "owner": "agent", "time": "30 min", "url": "https://developers.google.com/workspace/gmail/api/auth/scopes"}, {"phase": "Register", "title": "Create project and enable Gmail API", "detail": "Cloud Console > select or create project > APIs & Services > Library > 'Gmail API' > Enable.", "owner": "human", "time": "5 min", "url": "https://console.cloud.google.com/apis/library/gmail.googleapis.com"}, {"phase": "Configure", "title": "Google Auth Platform: Get started", "detail": "Console > Google Auth Platform > Overview > Get started. App Information: App name (no 'Google' or 'Gmail' in the name) and User support email. Audience: External (or Internal for Workspace-only). Contact information: developer emails. Accept the API Services User Data Policy.", "owner": "human", "time": "10 min", "url": "https://console.cloud.google.com/auth/overview"}, {"phase": "Configure", "title": "Branding", "detail": "Google Auth Platform > Branding: logo (120x120), Application home page, Application privacy policy link, Application terms of service link, and Authorized domains (add the top private domain of the homepage, privacy policy and redirect URIs). Each domain must be verified in Search Console by an Owner/Editor of the project.", "owner": "both", "time": "20 min", "url": "https://console.cloud.google.com/auth/branding"}, {"phase": "Configure", "title": "Data Access: declare scopes", "detail": "Google Auth Platform > Data Access > Add or remove scopes. Add exactly the scopes your code requests and no extras. The console groups them as non-sensitive, sensitive and restricted.", "owner": "agent", "time": "5 min", "url": "https://console.cloud.google.com/auth/scopes"}, {"phase": "Configure", "title": "Audience: test users", "detail": "Google Auth Platform > Audience: Publishing status = Testing. Under Test users, add up to 100 Google accounts. This is a lifetime quota, and removing a user does not refund a slot.", "owner": "human", "time": "5 min", "url": "https://console.cloud.google.com/auth/audience"}, {"phase": "Register", "title": "Create OAuth client", "detail": "Google Auth Platform > Clients > Create client > Application type 'Web application'. Add Authorized redirect URIs (exact match, https except localhost, no wildcards or fragments). Download the JSON immediately: since 2025 the client secret is masked after creation.", "owner": "human", "time": "5 min", "url": "https://console.cloud.google.com/auth/clients"}, {"phase": "Test", "title": "Run the authorization code flow", "detail": "Redirect to https://accounts.google.com/o/oauth2/v2/auth with response_type=code, access_type=offline, prompt=consent (to always get a refresh_token), include_granted_scopes=true, state and PKCE. Exchange the code at https://oauth2.googleapis.com/token. Handle partial grants: users can uncheck scopes on the consent screen.", "owner": "agent", "time": "15 min", "url": "https://developers.google.com/identity/protocols/oauth2/web-server"}, {"phase": "Review", "title": "Verify branding", "detail": "Google Auth Platform > Branding > Verify Branding. The automated check usually takes minutes, with escalations taking about 2–3 business days. When it shows 'Ready to publish', click Publish branding within 7 days or the result expires.", "owner": "human", "time": "10 min", "wait": "minutes to 2–3 business days", "url": "https://developers.google.com/identity/protocols/oauth2/production-readiness/sensitive-scope-verification"}, {"phase": "Review", "title": "Record demo video", "detail": "Screen-record in English: the full sign-in and consent flow, with the address bar showing client_id=... and the consent screen showing your app name and every requested scope, then each feature that uses each scope. Upload to YouTube Studio with Visibility = Unlisted.", "owner": "human", "time": "1–2 h", "url": "https://developers.google.com/identity/protocols/oauth2/production-readiness/restricted-scope-verification"}, {"phase": "Review", "title": "Submit data access verification", "detail": "Google Auth Platform > Verification Center > data access. Confirm the declared scopes, select the application type/use case, give per-scope justifications (feature, why a narrower scope will not work), add up to 3 documentation links and the YouTube link, then click the Submit button at the bottom of the form. 'Proceed' on warnings does not submit.", "owner": "both", "time": "1 h", "wait": "Sensitive: up to about 10 days. Restricted: several weeks.", "url": "https://console.cloud.google.com/auth/verification"}, {"phase": "Review", "title": "Respond to Trust & Safety emails", "detail": "Reviewers email the project contacts with requested changes (privacy policy wording, video re-shoot, scope reduction). Reply in the same thread. Review pauses until you respond.", "owner": "human", "time": "varies", "wait": "24–48 h per email round (community-reported)"}, {"phase": "Review", "title": "CASA security assessment (restricted scopes only)", "detail": "After the other requirements pass, Google tells you to start CASA. Choose an authorized lab (e.g., TAC Security), run the required SAST/DAST scan and fix high and medium findings, complete the self-assessment questionnaire (about 50 questions), and obtain the Letter of Validation. The lab sends it to Google, which can take up to about a week to process.", "owner": "both", "time": "2–5 days effort", "wait": "about 5–20 days (community-reported)", "url": "https://support.google.com/cloud/answer/13465431"}, {"phase": "Launch", "title": "Publish to production", "detail": "Google Auth Platform > Audience > Publish app (In production). Once verified, the unverified-app screen and 100-user cap are removed. Set a calendar reminder about 90 days before the CASA/LOV anniversary for annual re-verification.", "owner": "human", "time": "5 min", "url": "https://console.cloud.google.com/auth/audience"}], "review": {"required": "conditional", "trigger": "External user type plus any sensitive scope (gmail.send) or restricted scope (gmail.readonly, gmail.modify, gmail.compose, gmail.metadata, gmail.insert, gmail.settings.*, https://mail.google.com/) for more than 100 users or beyond Testing. Exempt: Internal apps, apps in Testing, personal use under 100 users, service accounts with no user data, and Workspace admin-trusted apps.", "process": "1) Brand verification (automated, sometimes manual). 2) Data access review by Google Trust & Safety: scope justifications, demo video, privacy policy and Limited Use compliance. 3) Restricted scopes only: CASA security assessment through an App Defense Alliance-authorized lab, ending in a Letter of Validation. 4) Annual re-verification and CASA every 12 months.", "typical_wait": "Brand: minutes to 3 business days. Sensitive: up to about 10 days (Google's figure). Restricted: 'several weeks' (Google's wording); community reports range from 2–3 weeks when well prepared to 6–12 weeks.", "reviewers_check": ["Homepage on a verified domain you own, public, and describing the app", "Privacy policy linked from both the homepage and the consent screen (matching URLs), disclosing Google user data use and Limited Use compliance", "App name and logo match the product and do not imply Google affiliation", "Each requested scope is used by a shipped, user-facing feature visible in the demo video", "Narrower scopes would not suffice (for example, gmail.readonly instead of mail.google.com)", "Demo video shows the client_id in the URL bar and the full English consent screen", "Data is not transferred, sold, used for ads, or used to train generalized AI/ML models", "CASA: secure data handling, encryption, and data deletion on request"], "common_rejections": ["Requesting scopes for features not yet built, or scopes not shown in the video", "Scope mismatch between the code, the Data Access page, and the submission", "Homepage behind login, or on an unverified domain or subdomain", "Privacy policy missing the Limited Use statement or a description of AI use", "Demo video not showing the client_id or consent screen, or not in English", "Using https://mail.google.com/ when gmail.modify or gmail.readonly would do", "Form never submitted (clicked 'Proceed' instead of Submit)", "Unmonitored contact email, so Trust & Safety follow-ups expire"]}, "pre_approval_limits": ["Testing: at most 100 test users, explicitly listed on the Audience page", "Testing (External): refresh tokens and authorizations expire after 7 days, unless only basic profile/email scopes are requested", "Unverified app requesting sensitive or restricted scopes: 100 new users lifetime cap (cannot be reset), and users must click Advanced > 'Go to <app> (unsafe)'", "Projects with unverified restricted scopes in production cannot onboard new users beyond the cap until verified"], "oauth": {"authorize_url": "https://accounts.google.com/o/oauth2/v2/auth", "token_url": "https://oauth2.googleapis.com/token", "pkce": "supported (S256 + plain, confirmed via Google OIDC discovery document on 2026-10-30)", "refresh_tokens": "Issued only with access_type=offline, and only on the first consent unless prompt=consent is set. Long-lived in production, but invalidated if unused for 6 months, revoked by the user, or the user changes their password (for tokens with Gmail scopes), or if the 100-refresh-tokens-per-account-per-client limit is exceeded (oldest silently invalidated). In Testing (External), they expire after 7 days. Failure surfaces as invalid_grant.", "access_token_lifetime": "About 1 hour (use expires_in, typically 3599 seconds)", "redirect_uri_rules": "Exact match including scheme, case and trailing slash. HTTPS required except localhost or loopback IP. No raw IPs (except loopback), wildcards, fragments, userinfo, path traversal or open redirects. The TLD must be on the public suffix list. Error: redirect_uri_mismatch.", "scopes": "Three tiers. Non-sensitive (gmail.labels, gmail.addons.current.action.compose, gmail.addons.current.message.action). Sensitive (gmail.send, gmail.addons.current.message.metadata, gmail.addons.current.message.readonly) needs verification. Restricted (https://mail.google.com/, gmail.readonly, gmail.compose, gmail.insert, gmail.modify, gmail.metadata, gmail.settings.basic, gmail.settings.sharing) needs verification plus annual CASA. Granular consent lets users deselect individual scopes, so check the granted scopes in the token response. Use include_granted_scopes=true for incremental auth.", "tenant_notes": "One global endpoint covers consumer Gmail and Workspace. Workspace admins can block or allow third-party apps (Admin console > Security > API controls > App access control). A trusted app bypasses verification for that domain only. An Internal user type restricts the app to your own Cloud Organization."}, "gotchas": [{"title": "gmail.readonly and gmail.modify are restricted, not sensitive", "detail": "Several vendor blogs list gmail.readonly as sensitive. Google's scope table lists gmail.readonly, gmail.modify, gmail.compose and gmail.metadata as restricted, so any agent that reads email needs CASA. Only gmail.send (plus add-on-specific scopes) is sensitive.", "severity": "high", "evidence": ["e1", "e2"]}, {"title": "7-day refresh token expiry in Testing", "detail": "External apps in Testing get refresh tokens that expire after 7 days. Agents that run unattended will start throwing invalid_grant a week after a tester connects. This is not a bug in your code.", "severity": "high", "evidence": ["e3", "e4"]}, {"title": "100-user lifetime quota", "detail": "Both the test-user list and the unverified-app user cap count toward a lifetime total of 100, and you cannot reset it. Do not burn slots on throwaway accounts.", "severity": "high", "evidence": ["e4", "e5"]}, {"title": "CASA is annual and paid", "detail": "Restricted-scope approval lasts 12 months from the assessor's letter. Google emails about 90 days before expiry. If renewal lapses, the unverified screen returns. Budget yearly, not once.", "severity": "high", "evidence": ["e6", "e7", "e8"]}, {"title": "No training generalized AI models on Gmail data", "detail": "The Workspace API user data policy prohibits transferring Workspace data to train generalized or non-personalized AI/ML models. Your privacy policy must say so explicitly. This is a frequent issue for AI-agent products.", "severity": "high", "evidence": ["e9", "e8"]}, {"title": "Client secret shown only once", "detail": "Since mid-2025 the Cloud Console masks OAuth client secrets after creation. Download the JSON at creation time or create a new secret.", "severity": "medium", "evidence": ["e10"]}, {"title": "Unused OAuth clients are auto-deleted", "detail": "Clients with no token exchanges for 6 months are deleted. They can be restored within 30 days.", "severity": "medium", "evidence": ["e10"]}, {"title": "Branding verification result expires in 7 days", "detail": "After Verify Branding shows compliant, you must click Publish branding within 7 days or re-run it. Data access review requires published branding first.", "severity": "low", "evidence": ["e11"]}, {"title": "100 refresh tokens per user per client", "detail": "If an agent re-authorizes the same user repeatedly (for example, one token per agent instance), the oldest tokens are silently invalidated after 100. Reuse one refresh token per user.", "severity": "medium", "evidence": ["e3"]}, {"title": "Refresh token returned only on first consent", "detail": "Without prompt=consent, re-authorization returns no refresh_token. Store it on the first exchange.", "severity": "medium", "evidence": ["e12"]}], "blockers": [{"symptom": "'Google hasn't verified this app' screen", "cause": "Sensitive or restricted scopes requested before verification", "fix": "For testers, click Advanced > Go to app. For production, complete brand and data access verification (plus CASA for restricted scopes)."}, {"symptom": "Error 403: access_denied - '<app> has not completed the Google verification process ... can only be accessed by developer-approved testers'", "cause": "The app is in Testing and the user is not on the Test users list", "fix": "Add the account under Google Auth Platform > Audience > Test users, or publish and verify."}, {"symptom": "invalid_grant on refresh after about 7 days", "cause": "External app in Testing status", "fix": "Move to In production (and verify), or re-authorize testers weekly."}, {"symptom": "Error 400: redirect_uri_mismatch", "cause": "Redirect URI is not exactly registered on the Web client (trailing slash, http vs https, port)", "fix": "Add
